<style>
#tsugumori-glyph-behaviours { --ps-black:#0a0a0a; --ps-paper:#e8e8e8; --ps-red:#cc1515; --ps-muted:#a09b96; --ps-line:#34302f; color:var(--ps-paper); font-family:'JetBrains Mono','DejaVu Sans Mono',monospace; width:100%; background:transparent; font-size:12px; line-height:1.5; }

#tsugumori-glyph-behaviours .ps-artist { color:var(--ps-muted); margin:7px 0 0; font-size:13px; }
#tsugumori-glyph-behaviours .ps-button { appearance:none; position:relative; isolation:isolate; display:inline-flex; align-items:center; justify-content:center; font:inherit; font-size:11px; font-weight:500; letter-spacing:1px; padding:12px; min-height:60px; min-width:0; color:var(--ps-paper); background:transparent; border:0; border-radius:0; cursor:pointer; white-space:nowrap; }
#tsugumori-glyph-behaviours .ps-button::before { content:''; position:absolute; z-index:0; inset:9px; background:var(--ps-red); transform:scaleX(0); transform-origin:left; transition:transform 220ms cubic-bezier(.2,.75,.2,1); }
#tsugumori-glyph-behaviours .ps-button::after { content:''; position:absolute; pointer-events:none; inset:0; --ps-corner:var(--ps-muted); background:linear-gradient(var(--ps-corner),var(--ps-corner)) left top/10px 1px no-repeat,linear-gradient(var(--ps-corner),var(--ps-corner)) left top/1px 10px no-repeat,linear-gradient(var(--ps-corner),var(--ps-corner)) right top/10px 1px no-repeat,linear-gradient(var(--ps-corner),var(--ps-corner)) right top/1px 10px no-repeat,linear-gradient(var(--ps-corner),var(--ps-corner)) left bottom/10px 1px no-repeat,linear-gradient(var(--ps-corner),var(--ps-corner)) left bottom/1px 10px no-repeat,linear-gradient(var(--ps-corner),var(--ps-corner)) right bottom/10px 1px no-repeat,linear-gradient(var(--ps-corner),var(--ps-corner)) right bottom/1px 10px no-repeat; transition:inset 220ms; }
#tsugumori-glyph-behaviours .ps-button:hover::before,#tsugumori-glyph-behaviours .ps-button[aria-expanded="true"]::before,#tsugumori-glyph-behaviours.ps-playing .ps-play::before { transform:scaleX(1); }

#tsugumori-glyph-behaviours .ps-a-actions { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1fr) 108px; gap:10px; margin-top:16px; }
