</style></head><body><div aria-label="Current control center with proposed refinements" data-mode="refined" data-view="overview" id="ts-control-refinement">
<style>

    #ts-control-refinement { --cr-ink:#e8e8e8; --cr-soft:#909090; --cr-red:#cc1515; --cr-card:#111111; --cr-inner:.22; --cr-sub-size:11px; --cr-mono:'JetBrains Mono',monospace; width:100%; color:var(--cr-ink); font:400 12px/1.4 'Inter',sans-serif; container-type:inline-size; }

    #ts-control-refinement .cr-cross { display:grid; grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr) 70px minmax(0,1fr); grid-template-rows:56px 94px 56px 94px 56px; align-items:center; }
    #ts-control-refinement .cr-slot { position:relative; width:100%; min-width:0; height:56px; background:var(--cr-card); border:1px solid var(--cr-ink); padding:0; color:var(--cr-ink); text-align:left; transform:translateX(0); transition:transform 220ms cubic-bezier(.2,.7,.2,1); }

    #ts-control-refinement .cr-side-strip { position:absolute; width:4px; top:-1px; bottom:-1px; left:-1px; background:var(--cr-ink); transition:background 220ms; }
    #ts-control-refinement .cr-square { position:absolute; left:15px; top:20px; width:14px; height:14px; background:var(--cr-ink); opacity:.85; transition:transform 220ms,opacity 200ms; }
    #ts-control-refinement .cr-copy { position:absolute; left:41px; right:15px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:2px; }

    #ts-control-refinement .cr-focused .cr-focus-mark { opacity:1; }
    #ts-control-refinement .cr-focus-mark::before { content:''; width:8px; height:8px; position:absolute; left:0; top:5px; transform:rotate(45deg); background:var(--cr-ink); }
    #ts-control-refinement .cr-focus-mark::after { content:''; width:8px; height:8px; position:absolute; left:10px; top:5px; transform:rotate(-45deg); border-right:1.4px solid var(--cr-ink); border-bottom:1.4px solid var(--cr-ink); }

    #ts-control-refinement .cr-caption-state { color:light-dark(#6c211e,#c38782); }
    #ts-control-refinement .cr-audio { min-height:356px; max-width:550px; margin:0 auto; display:grid; grid-template-columns:220px 300px; gap:30px; align-items:start; padding-top:32px; }
    #ts-control-refinement .cr-subnav { display:flex; flex-direction:column; gap:12px; }
    #ts-control-refinement .cr-subbutton { position:relative; min-height:36px; padding:7px 25px; width:100%; color:var(--cr-ink); background:var(--cr-card); border:1px solid #e8e8e88c; font-size:13px; font-weight:500; text-align:center; }

    #ts-control-refinement .cr-subbutton::before { content:''; position:absolute; left:8px; top:calc(50% - 3px); width:6px; height:6px; transform:rotate(45deg); background:var(--cr-ink); opacity:0; }
    #ts-control-refinement .cr-subbutton[aria-pressed="true"]::before { opacity:1; }
    #ts-control-refinement .cr-detail { position:relative; border:1px solid var(--cr-ink); background:var(--cr-card); padding:18px; margin-top:82px; min-width:0; }
    #ts-control-refinement .cr-detail .cr-inner { opacity:.35; }
    #ts-control-refinement .cr-detail-body { position:relative; }
    #ts-control-refinement .cr-detail-heading { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
    #ts-control-refinement .cr-detail-heading h2 { font-size:11px; letter-spacing:5px; font-weight:500; color:#e8e8e8b3; margin:0; }

    #ts-control-refinement .cr-action:hover,#ts-control-refinement .cr-action[aria-pressed="true"] { color:var(--cr-card); background:var(--cr-ink); border-color:var(--cr-ink); }
    #ts-control-refinement .cr-range-box { position:relative; height:24px; border:1px solid var(--cr-ink); --cr-fill:var(--cr-ink); --cr-thumb:transparent; }

    #ts-control-refinement .cr-range::-moz-range-track { height:16px; background:transparent; }
    #ts-control-refinement .cr-range::-moz-range-progress { height:16px; background:var(--cr-fill); }
    #ts-control-refinement .cr-range::-moz-range-thumb { width:3px; height:22px; border:0; border-radius:0; background:var(--cr-thumb); }

    #ts-control-refinement[data-mode="refined"] .cr-slot.cr-focused:not(.cr-center) .cr-inner { opacity:.4; }
    #ts-control-refinement[data-mode="refined"] .cr-slot:not(.cr-center) .cr-copy { gap:3px; }
    #ts-control-refinement[data-mode="refined"] .cr-slot:not(.cr-center) .cr-subtitle { font-size:var(--cr-sub-size); letter-spacing:.15px; }
    #ts-control-refinement[data-mode="refined"] .cr-detail .cr-inner { opacity:var(--cr-inner); }

    #ts-control-refinement[data-mode="refined"] .cr-value { visibility:visible; }
    #ts-control-refinement[data-mode="refined"] .cr-range-box { --cr-fill:var(--cr-red); --cr-thumb:var(--cr-ink); }

    #ts-control-refinement[data-mode="refined"] .cr-subbutton { border-color:#e8e8e8b3; transition:transform 220ms cubic-bezier(.2,.7,.2,1),border-color 200ms; }
    #ts-control-refinement[data-mode="refined"] .cr-subbutton[aria-pressed="true"] { border:1px solid var(--cr-ink); padding:7px 25px; box-shadow:inset 3px 0 var(--cr-red); transform:translateX(4px); }
    #ts-control-refinement[data-mode="refined"] .cr-subbutton[aria-pressed="true"]::before { left:12px; }

      #ts-control-refinement .cr-stage { padding:48px 18px; }
      #ts-control-refinement .cr-cross { grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr) 36px minmax(0,1fr); }
      #ts-control-refinement .cr-copy { left:31px; right:9px; }
      #ts-control-refinement .cr-square { left:11px; width:11px; height:11px; top:22px; }

      #ts-control-refinement .cr-focus-mark::before { width:5px; height:5px; top:7px; }
      #ts-control-refinement .cr-focus-mark::after { left:6px; width:5px; height:5px; top:7px; }

    @container(max-width:580px) {
      #ts-control-refinement .cr-view-label { margin-left:0; }

      #ts-control-refinement .cr-slot { height:64px; }
      #ts-control-refinement .cr-slot[data-slot="center"] { grid-column:1 / -1; grid-row:1; }
      #ts-control-refinement .cr-slot[data-slot="top"] { grid-column:1; grid-row:3; }

      #ts-control-refinement .cr-slot[data-slot="bottom"] { grid-column:1; grid-row:5; }

      #ts-control-refinement .cr-copy { left:19px; right:7px; }
      #ts-control-refinement .cr-name { font-size:12px; }
      #ts-control-refinement .cr-square { left:7px; top:27px; width:7px; height:7px; }
      #ts-control-refinement .cr-slot.cr-focused:not(.cr-center) { transform:translateX(4px); }
