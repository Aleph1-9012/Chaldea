    #ts-menu-researched { width:100%; container-type:inline-size; --mr-red:#cc1515; --mr-bg:#0a0a0a; --mr-white:#e8e8e8; --mr-muted:#96918d; --mr-grid:rgba(204,21,21,.10); --mr-line:#cc151538; --mr-sans:'Inter',sans-serif; --mr-mono:'IBM Plex Mono',monospace; --mr-display:'Archivo',sans-serif; --mr-name-size:14px; --mr-name-font:var(--mr-sans); --mr-name-color:var(--mr-red); --mr-name-weight:400; --mr-name-spacing:1.1px; }
