<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>Tsugumori / Clipboard styles / C grid</title><style>html{color-scheme:dark}body{margin:0;padding:16px;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}*,*::before,*::after{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}[hidden],[data-archive-omitted]{display:none!important}.viz-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.btn,.nav-link{background:#151515;color:#ddd;border:1px solid #555;padding:8px 10px;cursor:pointer}.btn[aria-pressed=true],.nav-link.active{background:#cc1515;border-color:#cc1515;color:#080808}.text-small{font-size:11px}.text-muted{color:#999}.form-control,.form-select{background:#151515;color:#eee;border:1px solid #666;padding:7px}.form-range{accent-color:#cc1515}.nav{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}figure{margin:0}svg{flex-shrink:0}.archive-settings{border-top:1px solid #383434;margin:18px 0 0;padding:12px 0;font-size:11px}.archive-settings summary{cursor:pointer;color:#aaa;letter-spacing:1px}.archive-settings label{display:flex;align-items:center;gap:12px;padding-top:10px;flex-wrap:wrap}.archive-settings label span{min-width:145px}.archive-settings input[type=range]{width:150px;max-width:100%;accent-color:#cc1515}.archive-settings select{max-width:100%;background:#151515;color:#ddd;border:1px solid #555;padding:5px}.archive-settings output{color:#aaa}.archive-settings input[type=checkbox]{accent-color:#cc1515}
</style></head><body><div aria-label="Tsugumori clipboard design studies" id="ts-clip-studies">
<style>
    #ts-clip-studies { --cs-accent:#d4161c; --cs-paper:#c7c4c2; --cs-muted:#8d8887; --cs-line:#39282a; --cs-grid:rgba(162,28,34,.095); max-width:700px; margin:0 auto; color:var(--cs-paper); font:13px Arial,Helvetica,sans-serif; }
    #ts-clip-studies * { box-sizing:border-box; }
    #ts-clip-studies button,#ts-clip-studies input { font:inherit; border-radius:0; }
    #ts-clip-studies button { cursor:pointer; }
    #ts-clip-studies button:focus-visible,#ts-clip-studies input:focus-visible { outline:2px solid #dbb4b4; outline-offset:3px; }
    #ts-clip-studies .cs-mono { font-family:"JetBrains Mono","DejaVu Sans Mono",monospace; }
    #ts-clip-studies .cs-choices { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:0 auto 18px; max-width:650px; }
    #ts-clip-studies .cs-choice { border:1px solid #382c2d; background:#151213; color:#a59c9b; padding:12px 6px; font-size:10px; letter-spacing:1.1px; transition:background .2s,color .2s; }
    #ts-clip-studies .cs-choice b { font:14px "DejaVu Sans Mono",monospace; margin-right:7px; }
    #ts-clip-studies .cs-choice:hover { border-color:var(--cs-accent); color:#e1c4c5; }
    #ts-clip-studies .cs-choice[aria-pressed="true"] { background:var(--cs-accent); color:#150809; border-color:var(--cs-accent); }
    #ts-clip-studies .cs-surface { position:relative; width:100%; max-width:650px; margin:auto; border:1px solid #503033; border-top:2px solid var(--cs-accent); background-color:#101011; background-image:linear-gradient(var(--cs-grid) 1px,transparent 1px),linear-gradient(90deg,var(--cs-grid) 1px,transparent 1px); background-size:23px 23px; overflow:hidden; }
    #ts-clip-studies[data-layout="a"] .cs-surface { max-width:430px; }
    #ts-clip-studies[data-layout="d"] .cs-surface { max-width:490px; }
    #ts-clip-studies .cs-header { display:flex; align-items:center; gap:12px; padding:20px 22px 17px; border-bottom:1px solid var(--cs-line); }
    #ts-clip-studies .cs-title { font-size:13px; letter-spacing:2.2px; font-weight:400; margin:0; }
    #ts-clip-studies .cs-rule { width:25px; height:1px; background:#a4a0a0; }
    #ts-clip-studies .cs-jp { color:#8d8585; font-size:11px; letter-spacing:2px; flex:1; }
    #ts-clip-studies .cs-icon { color:var(--cs-muted); background:transparent; border:1px solid #4a3436; padding:7px; font-size:10px; letter-spacing:1px; min-height:30px; transition:background .25s,color .25s; }
    #ts-clip-studies .cs-icon:hover { background:var(--cs-accent); color:#120506; border-color:var(--cs-accent); }
    #ts-clip-studies .cs-icon svg { display:block; width:13px; height:13px; }
    #ts-clip-studies .cs-searchbar { padding:12px 20px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--cs-line); }
    #ts-clip-studies .cs-search-mark { color:var(--cs-accent); font-size:10px; }
    #ts-clip-studies .cs-search { flex:1; min-width:0; background:transparent; border:0; color:var(--cs-paper); padding:5px 0; outline-offset:0; font-size:12px; }
    #ts-clip-studies .cs-search::placeholder { color:#777070; font-style:italic; }
    #ts-clip-studies .cs-filter { border:0; background:transparent; color:#898181; letter-spacing:1px; font-size:9px; padding:5px; }
    #ts-clip-studies .cs-filter[aria-pressed="true"] { color:var(--cs-accent); }
    #ts-clip-studies .cs-scope { display:flex; justify-content:space-between; gap:12px; padding:12px 20px 8px; font-size:9px; letter-spacing:1.6px; color:#817879; }
    #ts-clip-studies .cs-history { padding:4px 0 12px; }
    #ts-clip-studies .cs-entry { position:relative; color:#c1babb; }
    #ts-clip-studies .cs-pick { width:100%; text-align:left; border:0; color:inherit; background:transparent; position:relative; isolation:isolate; padding:0; display:block; }
    #ts-clip-studies .cs-row-head { position:relative; isolation:isolate; transition:color .3s; }
    #ts-clip-studies .cs-row-head::before { content:""; position:absolute; inset:0; background:var(--cs-accent); transform:scaleX(0); transform-origin:left; transition:transform .36s cubic-bezier(.2,.7,.2,1); z-index:-1; }
    #ts-clip-studies .cs-pick:hover .cs-row-head::before,#ts-clip-studies .cs-entry.is-selected .cs-row-head::before { transform:scaleX(1); }
    #ts-clip-studies .cs-pick:hover .cs-row-head,#ts-clip-studies .cs-entry.is-selected .cs-row-head { color:#18090a; }
    #ts-clip-studies .cs-entry.is-selected .cs-pick:hover .cs-row-head::before { transform:scaleX(1); }
    #ts-clip-studies .cs-num { font:10px "DejaVu Sans Mono",monospace; opacity:.75; flex-shrink:0; }
    #ts-clip-studies .cs-entry-name { display:block; font-size:12px; letter-spacing:.4px; line-height:1.4; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #ts-clip-studies .cs-caption { display:block; font:9px "DejaVu Sans Mono",monospace; letter-spacing:.6px; opacity:.6; margin-top:7px; }
    #ts-clip-studies .cs-diamond { opacity:0; flex-shrink:0; font-size:12px; transition:opacity .22s; }
    #ts-clip-studies .is-selected .cs-diamond { opacity:1; }
    #ts-clip-studies [data-action="pin"][aria-pressed="true"] { color:var(--cs-accent); }
    #ts-clip-studies .cs-index .is-selected [data-action="pin"][aria-pressed="true"] { color:#170708; background:#17070820; }
    #ts-clip-studies .cs-row-actions { display:flex; gap:5px; position:absolute; right:13px; top:50%; transform:translateY(-50%); }
    #ts-clip-studies .cs-row-actions button { border:0; background:transparent; color:inherit; padding:8px 6px; font:14px "DejaVu Sans Mono",monospace; }
    #ts-clip-studies .cs-row-actions button:hover { background:#ffffff1a; }
    #ts-clip-studies .cs-row-actions svg { width:12px; height:12px; display:block; }
    #ts-clip-studies .cs-footer { border-top:1px solid var(--cs-line); padding:14px 18px; display:flex; gap:8px; align-items:center; }
    #ts-clip-studies .cs-message { color:#827879; font:9px "DejaVu Sans Mono",monospace; letter-spacing:.4px; margin-right:auto; line-height:1.6; min-width:0; }
    #ts-clip-studies .cs-use { border:1px solid var(--cs-accent); background:var(--cs-accent); color:#17090a; padding:11px 15px; font-size:10px; letter-spacing:1.3px; white-space:nowrap; transition:filter .2s; }
    #ts-clip-studies .cs-use:hover { filter:brightness(1.15); }
    #ts-clip-studies .cs-preview-btn { border:1px solid #503335; background:transparent; color:#b69a9b; padding:11px; font-size:10px; letter-spacing:1px; }
    #ts-clip-studies .cs-preview-btn:hover { border-color:var(--cs-accent); color:var(--cs-accent); }
    #ts-clip-studies .cs-media { background:#09090a; border:1px solid #33272a; overflow:hidden; }
    #ts-clip-studies .cs-media svg { display:block; width:100%; height:100%; }
    #ts-clip-studies .cs-empty { min-height:220px; display:grid; place-content:center; gap:18px; text-align:center; color:#968789; padding:25px; font-size:12px; }
    #ts-clip-studies .cs-undo { background:transparent; color:var(--cs-accent); border:0; font-size:10px; letter-spacing:1px; padding:5px; }
    #ts-clip-studies button:disabled { opacity:.35; cursor:default; }
    #ts-clip-studies [hidden] { display:none!important; }
    #ts-clip-studies .cs-index .cs-row-head { min-height:72px; display:flex; align-items:center; gap:12px; padding:12px 74px 12px 18px; }
    #ts-clip-studies .cs-index .cs-row-copy { min-width:0; flex:1; }
    #ts-clip-studies .cs-index .cs-thumb { width:57px; height:41px; flex-shrink:0; }
    #ts-clip-studies .cs-index .cs-txt-icon { width:32px; font:15px "DejaVu Sans Mono",monospace; color:inherit; opacity:.6; flex-shrink:0; text-align:center; }
    #ts-clip-studies .cs-index .cs-entry.is-selected .cs-row-actions { color:#170708; }
    #ts-clip-studies .cs-index .cs-entry { margin-bottom:3px; }
    #ts-clip-studies .cs-inspector { padding:18px 22px 16px; display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:22px; align-items:center; min-height:218px; }
    #ts-clip-studies .cs-inspector-art { height:180px; display:grid; place-items:center; overflow:hidden; }
    #ts-clip-studies .cs-inspector-art.cs-media svg { width:100%; height:auto; max-height:180px; }
    #ts-clip-studies .cs-inspector-art pre { margin:0; font:12px/1.8 "DejaVu Sans Mono",monospace; white-space:pre-wrap; overflow-wrap:anywhere; padding:20px; color:#d3cdcb; }
    #ts-clip-studies .cs-inspector-name { font-size:17px; line-height:1.4; letter-spacing:.7px; font-weight:400; margin:8px 0 12px; }
    #ts-clip-studies .cs-inspector-type { font:10px "DejaVu Sans Mono",monospace; color:var(--cs-accent); letter-spacing:1px; }
    #ts-clip-studies .cs-inspector-meta { color:#82797a; font:10px/1.8 "DejaVu Sans Mono",monospace; }
    #ts-clip-studies .cs-inspector-actions { display:flex; gap:7px; margin-top:20px; }
    #ts-clip-studies .cs-strip { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; padding:0 20px 18px; }
    #ts-clip-studies .cs-strip .cs-pick { border:1px solid #41282b; height:116px; transition:border-color .3s; }
    #ts-clip-studies .cs-strip .is-selected .cs-pick { border-color:var(--cs-accent); }
    #ts-clip-studies .cs-strip .cs-mini { height:85px; display:flex; align-items:center; background:#0d0c0d; overflow:hidden; }
    #ts-clip-studies .cs-strip .cs-mini svg { width:100%; height:100%; display:block; }
    #ts-clip-studies .cs-strip .cs-mini-text { padding:12px; font:9px/1.6 "DejaVu Sans Mono",monospace; color:#b9adac; word-break:break-word; max-height:85px; overflow:hidden; }
    #ts-clip-studies .cs-strip .cs-row-head { height:29px; display:flex; align-items:center; justify-content:space-between; padding:0 8px; font:9px "DejaVu Sans Mono",monospace; }
    #ts-clip-studies .cs-tiles { padding:16px 20px 20px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    #ts-clip-studies .cs-tiles .cs-pick { border:1px solid #412a2c; height:184px; transition:border-color .3s; }
    #ts-clip-studies .cs-tiles .is-selected .cs-pick { border-color:var(--cs-accent); }
    #ts-clip-studies .cs-tiles .cs-tile-body { height:135px; overflow:hidden; background:#0c0c0d; }
    #ts-clip-studies .cs-tiles .cs-tile-body svg { width:100%; height:100%; display:block; }
    #ts-clip-studies .cs-tiles .cs-tile-body pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; padding:22px 17px; color:#c4bbbb; font:11px/1.8 "DejaVu Sans Mono",monospace; }
    #ts-clip-studies .cs-tiles .cs-row-head { display:flex; align-items:center; gap:8px; padding:8px 10px; height:47px; }
    #ts-clip-studies .cs-tiles .cs-entry-name { flex:1; font-size:11px; }
    #ts-clip-studies .cs-tiles .cs-caption { font-size:8px; margin-top:4px; }
    #ts-clip-studies .cs-tile-tools { display:flex; gap:7px; align-items:center; margin-left:auto; }
    #ts-clip-studies .cs-folds { padding-top:8px; }
    #ts-clip-studies .cs-folds .cs-entry { border-bottom:1px solid #332426; }
    #ts-clip-studies .cs-folds .cs-row-head { height:47px; display:flex; gap:13px; align-items:center; padding:0 20px; }
    #ts-clip-studies .cs-folds .cs-entry-name { flex:1; }
    #ts-clip-studies .cs-fold-type { font:9px "DejaVu Sans Mono",monospace; opacity:.6; }
    #ts-clip-studies .cs-fold-body { display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows .38s cubic-bezier(.2,.7,.2,1),opacity .3s; }
    #ts-clip-studies .cs-fold-inner { overflow:hidden; min-height:0; }
    #ts-clip-studies .cs-fold-content { padding:17px 22px; }
    #ts-clip-studies .is-selected .cs-fold-body { grid-template-rows:1fr; opacity:1; }
    #ts-clip-studies .cs-fold-content .cs-media { max-width:290px; height:158px; margin:auto; }
    #ts-clip-studies .cs-fold-content pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.9 "DejaVu Sans Mono",monospace; color:#bdb5b5; }
    #ts-clip-studies .cs-fold-tools { display:flex; align-items:center; gap:7px; margin-top:15px; }
    #ts-clip-studies .cs-fold-tools .cs-caption { flex:1; margin:0; }
    #ts-clip-studies .cs-modal { position:absolute; inset:0; z-index:20; background:#101011; display:flex; flex-direction:column; }
    #ts-clip-studies .cs-modal-head { display:flex; align-items:center; justify-content:space-between; padding:18px; border-bottom:1px solid #42282b; font-size:12px; letter-spacing:1px; }
    #ts-clip-studies .cs-modal-content { padding:24px; flex:1; display:grid; place-content:center; min-height:0; overflow:auto; }
    #ts-clip-studies .cs-modal-content svg { width:100%; max-height:300px; display:block; }
    #ts-clip-studies .cs-modal-content pre { white-space:pre-wrap; overflow-wrap:anywhere; font:13px/1.9 "DejaVu Sans Mono",monospace; }
    #ts-clip-studies .cs-modal-bottom { padding:18px; border-top:1px solid #42282b; font:10px "DejaVu Sans Mono",monospace; color:#8b7d7e; }
    @media(max-width:480px) { #ts-clip-studies .cs-choice { font-size:9px; letter-spacing:.4px; padding:10px 3px; } #ts-clip-studies .cs-choice b { font-size:12px; margin-right:3px; } #ts-clip-studies .cs-header { padding:17px 15px; gap:8px; } #ts-clip-studies .cs-title { font-size:12px; letter-spacing:1.5px; } #ts-clip-studies .cs-searchbar { padding:10px 14px; } #ts-clip-studies .cs-inspector { gap:12px; padding:14px; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); min-height:180px; } #ts-clip-studies .cs-inspector-art { height:140px; } #ts-clip-studies .cs-inspector-name { font-size:14px; } #ts-clip-studies .cs-strip { gap:6px; padding:0 12px 14px; } #ts-clip-studies .cs-strip .cs-pick { height:94px; } #ts-clip-studies .cs-strip .cs-mini { height:63px; } #ts-clip-studies .cs-strip .cs-mini-text { font-size:8px; padding:6px; max-height:63px; } #ts-clip-studies .cs-tiles { padding:12px; gap:8px; } #ts-clip-studies .cs-tiles .cs-pick { height:168px; } #ts-clip-studies .cs-tiles .cs-tile-body { height:119px; } #ts-clip-studies .cs-tiles .cs-tile-body pre { padding:12px 10px; font-size:10px; } #ts-clip-studies .cs-tiles .cs-row-head { padding:7px; gap:5px; } #ts-clip-studies .cs-tiles .cs-entry-name { font-size:10px; } #ts-clip-studies .cs-footer { padding:12px; } #ts-clip-studies .cs-use { padding:10px; } #ts-clip-studies .cs-index .cs-row-head { padding-left:14px; gap:9px; } }
    @media(max-width:480px) { #ts-clip-studies .cs-footer { flex-wrap:wrap; } #ts-clip-studies .cs-message { flex-basis:100%; } #ts-clip-studies .cs-use { margin-left:auto; } #ts-clip-studies .cs-tile-tools { margin-left:0; } }
    @media(prefers-reduced-motion:reduce) { #ts-clip-studies *,#ts-clip-studies *::before { transition:none!important; } }
  </style>
<nav aria-label="Clipboard layout alternatives" class="cs-choices">
<button aria-pressed="true" class="cs-choice" data-layout-choice="a"><b>A</b> INDEX</button>
<button aria-pressed="false" class="cs-choice" data-layout-choice="b"><b>B</b> STRIP</button>
<button aria-pressed="false" class="cs-choice" data-layout-choice="c"><b>C</b> GRID</button>
<button aria-pressed="false" class="cs-choice" data-layout-choice="d"><b>D</b> FOLDOUT</button>
</nav>
<section aria-label="Clipboard style preview" class="cs-surface">
<header class="cs-header"><h2 class="cs-title">CLIPBOARD</h2><span class="cs-rule"></span><span class="cs-jp">履歴</span><button aria-label="Close clipboard preview" class="cs-icon" data-action="close">ESC</button></header>
<div class="cs-open-content">
<div class="cs-searchbar"><span aria-hidden="true" class="cs-search-mark">▸</span><input aria-label="Search sample clips" class="cs-search" placeholder="Search clipboard…"/><button aria-pressed="false" class="cs-filter" data-action="filter">PINNED</button></div>
<div class="cs-scope"><span class="cs-scope-name">RECENT COPIES</span><span class="cs-total cs-mono">04 ENTRIES</span></div>
<div class="cs-layout-area"></div>
<footer class="cs-footer"><span aria-live="polite" class="cs-message">LOCAL // PREVIEW</span><button class="cs-undo" data-action="undo" hidden="">UNDO</button><button class="cs-preview-btn" data-action="preview">PREVIEW</button><button class="cs-use" data-action="use">USE ENTRY ↵</button></footer>
</div>
<div class="cs-closed cs-empty" hidden=""><span>CLIPBOARD CLOSED</span><button class="cs-preview-btn" data-action="reopen">REOPEN PREVIEW</button></div>
<div aria-label="Sample clipboard entry preview" aria-modal="true" class="cs-modal" hidden="" role="dialog"><div class="cs-modal-head"><span class="cs-modal-name"></span><button aria-label="Close entry preview" class="cs-icon" data-action="dismiss">×</button></div><div class="cs-modal-content"></div><div class="cs-modal-bottom">SAMPLE ENTRY // NO SYSTEM CLIPBOARD ACCESS</div></div>
</section>

</div>
