</style></head><body><div aria-label="Tsugumori menu redesign comparison" data-design="b" id="ts-menu-rebuild">
<style>

    #ts-menu-rebuild { width:100%; container-type:inline-size; --tm-red:#cc1515; --tm-bg:#0a0a0a; --tm-white:#e8e8e8; --tm-muted:#a49d98; --tm-line:#cc151540; --tm-grid:rgba(204,21,21,.115); --tm-mono:'JetBrains Mono',monospace; --tm-display:'Barlow Condensed','Arial Narrow',sans-serif; --tm-sans:'IBM Plex Sans',sans-serif; --tm-row:44px; }

    #ts-menu-rebuild [hidden] { display:none !important; }
    #ts-menu-rebuild .tm-options { margin-bottom:14px; }
    #ts-menu-rebuild .tm-surface { background-color:var(--tm-bg); color:var(--tm-white); color-scheme:dark; background-image:linear-gradient(var(--tm-grid) 1px,transparent 1px),linear-gradient(90deg,var(--tm-grid) 1px,transparent 1px); background-size:20px 20px; border:1px solid var(--tm-line); border-top:2px solid var(--tm-red); border-bottom:1px solid var(--tm-red); }

    #ts-menu-rebuild .tm-surface button { cursor:pointer; font-family:var(--tm-mono); }
    #ts-menu-rebuild .tm-search { display:grid; grid-template-columns:62px minmax(0,1fr) 68px; gap:18px; align-items:center; padding:19px 24px 20px; border-bottom:1px solid var(--tm-red); }
    #ts-menu-rebuild .tm-query-mark { display:flex; align-items:center; justify-content:center; width:62px; height:64px; background:var(--tm-red); color:var(--tm-bg); font:500 38px/1 var(--tm-display); letter-spacing:-2px; }
    #ts-menu-rebuild .tm-search-copy { min-width:0; }
    #ts-menu-rebuild .tm-search label { display:block; color:var(--tm-red); font:400 11px/1.3 var(--tm-mono); letter-spacing:2px; margin-bottom:4px; }
    #ts-menu-rebuild .tm-search input { display:block; width:100%; padding:0; border:0; min-width:0; background:transparent; color:var(--tm-white); font:400 32px/1.3 var(--tm-display); letter-spacing:.3px; }

    #ts-menu-rebuild .tm-search:focus-within .tm-query-mark { background:var(--tm-white); }
    #ts-menu-rebuild .tm-result { display:flex; flex-direction:column; gap:4px; align-items:end; font:400 11px/1.4 var(--tm-mono); color:var(--tm-muted); }

    #ts-menu-rebuild .tm-column-head { display:flex; justify-content:space-between; gap:12px; padding:11px 24px 10px; color:var(--tm-muted); font:400 11px/1.4 var(--tm-mono); letter-spacing:1px; border-bottom:1px solid var(--tm-line); }
    #ts-menu-rebuild .tm-empty { padding:50px 24px; font:400 18px/1.5 var(--tm-sans); color:var(--tm-muted); }

    #ts-menu-rebuild .tm-index-name { min-width:0; display:block; padding:8px 0; font:400 25px/1.08 var(--tm-display); letter-spacing:.5px; }
    #ts-menu-rebuild .tm-index-category { justify-self:end; color:var(--tm-muted); font:400 11px/1.2 var(--tm-mono); letter-spacing:1.4px; transform:translate(var(--tm-jitter-x),var(--tm-jitter-y)); }
