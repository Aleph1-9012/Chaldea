<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>Tsugumori / Volume OSD / Segmented</title><style>html{color-scheme:dark}body{margin:0;padding:16px;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}*,*::before,*::after{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}[hidden],[data-archive-omitted]{display:none!important}.viz-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.btn,.nav-link{background:#151515;color:#ddd;border:1px solid #555;padding:8px 10px;cursor:pointer}.btn[aria-pressed=true],.nav-link.active{background:#cc1515;border-color:#cc1515;color:#080808}.text-small{font-size:11px}.text-muted{color:#999}.form-control,.form-select{background:#151515;color:#eee;border:1px solid #666;padding:7px}.form-range{accent-color:#cc1515}.nav{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}figure{margin:0}svg{flex-shrink:0}.archive-settings{border-top:1px solid #383434;margin:18px 0 0;padding:12px 0;font-size:11px}.archive-settings summary{cursor:pointer;color:#aaa;letter-spacing:1px}.archive-settings label{display:flex;align-items:center;gap:12px;padding-top:10px;flex-wrap:wrap}.archive-settings label span{min-width:145px}.archive-settings input[type=range]{width:150px;max-width:100%;accent-color:#cc1515}.archive-settings select{max-width:100%;background:#151515;color:#ddd;border:1px solid #555;padding:5px}.archive-settings output{color:#aaa}.archive-settings input[type=checkbox]{accent-color:#cc1515}
</style></head><body><style>

#ts-level-preview { --ts-bg:#111111; --ts-ink:#e8e8e8; --ts-muted:#909090; --ts-red:#cc1515; --ts-line:#383838; color:var(--ts-ink); font-family:'Share Tech Mono',monospace; width:100%; }
#ts-level-preview * { box-sizing:border-box; }
#ts-level-preview .ts-meter-stack { width:min(100%,430px); margin:0 auto; display:grid; gap:18px; padding:8px; }
#ts-level-preview .ts-osd { background:var(--ts-bg); border:1px solid var(--ts-line); position:relative; padding:19px 20px 17px; }
#ts-level-preview .ts-corner { position:absolute; width:15px; height:15px; pointer-events:none; }
#ts-level-preview .ts-corner::before { content:''; position:absolute; width:9px; height:9px; border-left:1px solid #939393; border-top:1px solid #939393; left:5px; top:5px; }
#ts-level-preview .ts-corner::after { content:''; position:absolute; width:3px; height:3px; background:var(--ts-ink); left:4px; top:4px; }
#ts-level-preview .ts-tl { left:-6px; top:-6px; }
#ts-level-preview .ts-tr { right:-6px; top:-6px; transform:rotate(90deg); }
#ts-level-preview .ts-br { right:-6px; bottom:-6px; transform:rotate(180deg); }
#ts-level-preview .ts-bl { left:-6px; bottom:-6px; transform:rotate(270deg); }
#ts-level-preview .ts-head { display:flex; align-items:center; gap:11px; }
#ts-level-preview .ts-icon { display:flex; width:28px; flex:none; justify-content:center; color:var(--ts-ink); }
#ts-level-preview .ts-icon svg { width:22px; height:22px; stroke-width:1.3; }
#ts-level-preview .ts-channel { flex:1; min-width:0; }
#ts-level-preview .ts-label { font-size:13px; line-height:1.3; letter-spacing:2px; }
#ts-level-preview .ts-device { font-size:11px; line-height:1.4; color:var(--ts-muted); margin-top:4px; letter-spacing:.5px; }
#ts-level-preview .ts-value { font-size:30px; line-height:1; font-weight:400; font-variant-numeric:tabular-nums; white-space:nowrap; }
#ts-level-preview .ts-value small { font-size:12px; color:var(--ts-muted); margin-left:4px; }
#ts-level-preview .ts-bars { display:grid; grid-template-columns:repeat(30,minmax(0,1fr)); gap:4px; height:14px; align-items:center; margin-top:18px; }
#ts-level-preview .ts-bars span { height:4px; background:#353535; transition:background 150ms ease,height 150ms ease; }
#ts-level-preview .ts-bars span[data-filled='true'] { background:var(--ts-red); height:8px; }
#ts-level-preview .ts-bars span[data-tip='true'] { background:var(--ts-ink); height:12px; }
#ts-level-preview[data-meter='Continuous'] .ts-bars { gap:0; }
#ts-level-preview[data-meter='Continuous'] .ts-bars span { height:5px; }
#ts-level-preview[data-meter='Continuous'] .ts-bars span[data-tip='true'] { height:11px; }
#ts-level-preview[data-corners='false'] .ts-corner { display:none; }
@media(max-width:360px) { #ts-level-preview .ts-osd { padding:16px; } #ts-level-preview .ts-label { letter-spacing:1px; } #ts-level-preview .ts-bars { gap:3px; } }
@media(prefers-reduced-motion:reduce) { #ts-level-preview .ts-bars span { transition:none; } }
</style>
<div aria-label="Tsugumori volume and brightness overlay concepts" id="ts-level-preview">
<div class="ts-meter-stack">
<section aria-label="Volume overlay preview" class="ts-osd">
<span aria-hidden="true" class="ts-corner ts-tl"></span><span aria-hidden="true" class="ts-corner ts-tr"></span><span aria-hidden="true" class="ts-corner ts-br"></span><span aria-hidden="true" class="ts-corner ts-bl"></span>
<div class="ts-head">
<div class="ts-icon"><i aria-hidden="true" data-lucide="volume-2"></i></div>
<div class="ts-channel"><div class="ts-label">VOLUME</div><div class="ts-device">HEADPHONES</div></div>
<div class="ts-value"><span data-volume-value="">68</span><small>%</small></div>
</div>
<div aria-label="Preview volume" aria-valuemax="100" aria-valuemin="0" aria-valuenow="68" class="ts-bars" data-volume-meter="" role="meter"></div>
</section>
<section aria-label="Brightness overlay preview" class="ts-osd">
<span aria-hidden="true" class="ts-corner ts-tl"></span><span aria-hidden="true" class="ts-corner ts-tr"></span><span aria-hidden="true" class="ts-corner ts-br"></span><span aria-hidden="true" class="ts-corner ts-bl"></span>
<div class="ts-head">
<div class="ts-icon"><i aria-hidden="true" data-lucide="sun"></i></div>
<div class="ts-channel"><div class="ts-label">BRIGHTNESS</div><div class="ts-device">DP-5 / ODYSSEY G5</div></div>
<div class="ts-value"><span data-brightness-value="">45</span><small>%</small></div>
</div>
<div aria-label="Preview brightness" aria-valuemax="100" aria-valuemin="0" aria-valuenow="45" class="ts-bars" data-brightness-meter="" role="meter"></div>
</section>
</div>
</div>
