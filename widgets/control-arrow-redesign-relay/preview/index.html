</style></head><body><div aria-label="New directional marker designs for the Tsugumori control center" id="ts-arrow-redesign">
<style>

    #ts-arrow-redesign { --ta-white:#e8e8e8; --ta-soft:#969696; --ta-red:#cc1515; --ta-bg:#111111; --ta-mono:'JetBrains Mono',monospace; --ta-size:36px; --ta-motion:320ms; width:100%; color:var(--ta-white); font:400 13px/1.4 'Inter',sans-serif; container-type:inline-size; }
    #ts-arrow-redesign * { box-sizing:border-box; }
    #ts-arrow-redesign button { font:inherit; border-radius:0; cursor:pointer; }
    #ts-arrow-redesign .ta-options { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
    #ts-arrow-redesign .ta-option { position:relative; min-width:0; padding:15px 18px 13px; text-align:left; color:var(--ta-white); background:#0a0a0a; border:1px solid #454545; transition:border-color 180ms; }
    #ts-arrow-redesign .ta-option:hover { border-color:#969696; }
    #ts-arrow-redesign .ta-option[aria-pressed="true"] { border-color:var(--ta-red); }
    #ts-arrow-redesign .ta-option[aria-pressed="true"]::after { content:''; width:6px; height:6px; position:absolute; right:16px; top:20px; background:var(--ta-red); transform:rotate(45deg); }
    #ts-arrow-redesign .ta-label { display:block; padding-right:16px; font:400 12px var(--ta-mono); letter-spacing:.4px; }
    #ts-arrow-redesign .ta-label b { color:var(--ta-red); font-weight:500; }
    #ts-arrow-redesign .ta-samples { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding-top:10px; }
    #ts-arrow-redesign .ta-sample { display:flex; flex-direction:column; align-items:center; gap:4px; }
    #ts-arrow-redesign .ta-sample .ta-glyph { font-size:64px; }
    #ts-arrow-redesign .ta-sample small { font:400 11px var(--ta-mono); color:var(--ta-soft); }
    #ts-arrow-redesign .ta-glyph { position:relative; display:block; width:1em; height:1em; font-size:var(--ta-size); color:var(--ta-white); opacity:var(--ta-rest,.6); transition:opacity 220ms; }
    #ts-arrow-redesign .ta-glyph.ta-lit { opacity:1; }
    #ts-arrow-redesign .ta-glyph > i,#ts-arrow-redesign .ta-glyph > span { display:block; position:absolute; }
    #ts-arrow-redesign .ta-glyph .ta-pip { left:.08em; top:.415em; width:.17em; height:.17em; border:.036em solid currentColor; transform:rotate(45deg); transition:background 220ms,border-color 220ms; }
    #ts-arrow-redesign .ta-glyph .ta-link { left:.28em; top:.486em; width:.26em; height:.028em; background:currentColor; }
    #ts-arrow-redesign .ta-glyph .ta-point { left:.53em; top:.35em; width:.30em; height:.30em; border-top:.05em solid currentColor; border-right:.05em solid currentColor; transform:rotate(45deg); }
    #ts-arrow-redesign .ta-lit .ta-pip { background:var(--ta-red); border-color:var(--ta-red); }
    #ts-arrow-redesign .ta-glyph .ta-dart { left:.25em; top:.22em; width:0; height:0; border-top:.28em solid transparent; border-bottom:.28em solid transparent; border-left:.64em solid currentColor; transition:border-left-color 220ms; }
    #ts-arrow-redesign .ta-dart::after { content:''; position:absolute; left:-.645em; top:-.13em; border-top:.13em solid transparent; border-bottom:.13em solid transparent; border-left:.18em solid #0a0a0a; }
    #ts-arrow-redesign .ta-glyph .ta-tail { left:.09em; top:.28em; width:.045em; height:.44em; background:currentColor; }
    #ts-arrow-redesign .ta-lit .ta-dart { border-left-color:var(--ta-red); }
    #ts-arrow-redesign .ta-glyph .ta-gate { width:.16em; height:.16em; border:0 solid currentColor; }
    #ts-arrow-redesign .ta-gate.g1 { top:.16em; left:.16em; border-top-width:.036em; border-left-width:.036em; }
    #ts-arrow-redesign .ta-gate.g2 { top:.16em; right:.16em; border-top-width:.036em; border-right-width:.036em; }
    #ts-arrow-redesign .ta-gate.g3 { bottom:.16em; left:.16em; border-bottom-width:.036em; border-left-width:.036em; }
    #ts-arrow-redesign .ta-gate.g4 { bottom:.16em; right:.16em; border-bottom-width:.036em; border-right-width:.036em; }
    #ts-arrow-redesign .ta-glyph .ta-core { inset:.24em; transition:color 220ms; }
    #ts-arrow-redesign .ta-core svg { display:block; width:100% !important; height:100% !important; stroke-width:1.8; stroke-linecap:square; stroke-linejoin:miter; }
    #ts-arrow-redesign .ta-lit .ta-core { color:var(--ta-red); }
    #ts-arrow-redesign .ta-glyph .ta-step { width:.10em; height:.10em; background:currentColor; }
    #ts-arrow-redesign .ta-step.s1 { left:.25em; top:.12em; }
    #ts-arrow-redesign .ta-step.s2 { left:.36em; top:.23em; }
    #ts-arrow-redesign .ta-step.s3 { left:.47em; top:.34em; }
    #ts-arrow-redesign .ta-step.s4 { left:.58em; top:.45em; }
    #ts-arrow-redesign .ta-step.s5 { left:.47em; top:.56em; }
    #ts-arrow-redesign .ta-step.s6 { left:.36em; top:.67em; }
    #ts-arrow-redesign .ta-step.s7 { left:.25em; top:.78em; }
    #ts-arrow-redesign .ta-glyph .ta-stem { left:.11em; top:.45em; width:.38em; height:.10em; background:currentColor; }
    #ts-arrow-redesign .ta-glyph .ta-step,#ts-arrow-redesign .ta-glyph .ta-stem { transform:translateX(.10em); }
    #ts-arrow-redesign .ta-lit .ta-stem,#ts-arrow-redesign .ta-lit .ta-step.s4 { background:var(--ta-red); }

    #ts-arrow-redesign .ta-frame { position:relative; background:var(--ta-bg); border:1px solid var(--ta-white); color:var(--ta-white); }

    #ts-arrow-redesign .ta-node[data-node="audio"] { grid-column:3; grid-row:5; }
    #ts-arrow-redesign .ta-plate { position:absolute; top:-10px; left:16px; max-width:calc(100% - 30px); margin:0; padding:0 7px; background:var(--ta-bg); font-size:12px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; line-height:20px; white-space:nowrap; }
    #ts-arrow-redesign .ta-value { position:absolute; top:20px; left:41px; right:16px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #ts-arrow-redesign .ta-square { position:absolute; top:22px; left:16px; width:12px; height:12px; background:var(--ta-white); opacity:.85; transition:transform 220ms,opacity 220ms; }
    #ts-arrow-redesign .ta-side { position:absolute; left:-1px; top:0; bottom:0; width:4px; background:var(--ta-white); transition:background 220ms; }
    #ts-arrow-redesign .ta-strip { position:absolute; bottom:4px; left:4px; right:4px; height:28px; padding:0 12px; border-top:1px solid #e8e8e859; display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--ta-soft); font:400 11px var(--ta-mono); white-space:nowrap; }
    #ts-arrow-redesign .ta-live { display:flex; align-items:center; gap:6px; }
    #ts-arrow-redesign .ta-live::before { content:''; display:block; width:4px; height:4px; background:var(--ta-red); }
    #ts-arrow-redesign .ta-focus { position:absolute; left:-32px; top:calc(50% - 7px); width:18px; height:14px; opacity:0; transition:opacity 220ms; }
    #ts-arrow-redesign .ta-focus::before { content:''; position:absolute; top:3px; left:0; width:7px; height:7px; background:var(--ta-white); transform:rotate(45deg); }
    #ts-arrow-redesign .ta-focus::after { content:''; position:absolute; top:3px; left:10px; width:7px; height:7px; border-top:1px solid var(--ta-white); border-right:1px solid var(--ta-white); transform:rotate(45deg); }
    #ts-arrow-redesign .ta-node.ta-focused { transform:translateX(8px); }
    #ts-arrow-redesign .ta-focused .ta-side { background:var(--ta-red); }
    #ts-arrow-redesign .ta-focused .ta-square { opacity:0; transform:scale(0); }
    #ts-arrow-redesign .ta-focused .ta-focus { opacity:1; }
    #ts-arrow-redesign .ta-corner { position:absolute; width:8px; height:8px; border:0 solid var(--ta-white); pointer-events:none; }
    #ts-arrow-redesign .ta-corner.tl { left:5px; top:-3px; border-top-width:2px; border-left-width:2px; }
    #ts-arrow-redesign .ta-corner.tr { right:-1px; top:-3px; border-top-width:2px; border-right-width:2px; }
    #ts-arrow-redesign .ta-corner.bl { left:5px; bottom:-3px; border-bottom-width:2px; border-left-width:2px; }
    #ts-arrow-redesign .ta-corner.br { right:-1px; bottom:-3px; border-bottom-width:2px; border-right-width:2px; }
    #ts-arrow-redesign .ta-center { grid-column:3; grid-row:3; height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
    #ts-arrow-redesign .ta-center strong { font-size:15px; font-weight:500; letter-spacing:6px; }
    #ts-arrow-redesign .ta-center small { font-size:11px; letter-spacing:1px; color:var(--ta-soft); }
    #ts-arrow-redesign .ta-arrow { position:relative; width:var(--ta-size); height:var(--ta-size); justify-self:center; pointer-events:none; transform:rotate(var(--ta-angle)); transition:transform var(--ta-motion) cubic-bezier(.2,.7,.2,1); }
    #ts-arrow-redesign .ta-arrow[data-axis="connection"] { grid-column:3; grid-row:2; }
    #ts-arrow-redesign .ta-arrow[data-axis="audio"] { grid-column:3; grid-row:4; }
    #ts-arrow-redesign .ta-arrow[data-axis="share"] { grid-column:2; grid-row:3; }
    #ts-arrow-redesign .ta-arrow[data-axis="notifications"] { grid-column:4; grid-row:3; }
    #ts-arrow-redesign .ta-footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding-top:12px; color:light-dark(#5c534e,#aaa39e); font:400 11px var(--ta-mono); }

      #ts-arrow-redesign .ta-samples { padding-top:0; }
      #ts-arrow-redesign .ta-sample .ta-glyph { font-size:52px; }
      #ts-arrow-redesign .ta-option[aria-pressed="true"]::after { right:auto; left:0; top:auto; width:3px; height:26px; transform:none; }

      #ts-arrow-redesign .ta-plate { left:11px; padding:0 5px; font-size:11px; letter-spacing:.6px; }

    @container(max-width:620px) {

      #ts-arrow-redesign .ta-label { line-height:1.6; max-width:140px; }
      #ts-arrow-redesign .ta-samples { padding:0; gap:4px; }

      #ts-arrow-redesign .ta-context-bar .ta-scale { margin-left:0; }

      #ts-arrow-redesign .ta-cross { grid-template-columns:44px minmax(0,1fr); grid-template-rows:56px repeat(4,84px); gap:20px 12px; }
      #ts-arrow-redesign .ta-center { grid-column:1 / -1; grid-row:1; }
      #ts-arrow-redesign .ta-node[data-node="connection"] { grid-column:2; grid-row:2; }
      #ts-arrow-redesign .ta-node[data-node="share"] { grid-column:2; grid-row:3; }
      #ts-arrow-redesign .ta-node[data-node="audio"] { grid-column:2; grid-row:4; }
      #ts-arrow-redesign .ta-node[data-node="notifications"] { grid-column:2; grid-row:5; }
      #ts-arrow-redesign .ta-arrow[data-axis="connection"] { grid-column:1; grid-row:2; }
      #ts-arrow-redesign .ta-arrow[data-axis="share"] { grid-column:1; grid-row:3; }
      #ts-arrow-redesign .ta-arrow[data-axis="audio"] { grid-column:1; grid-row:4; }
      #ts-arrow-redesign .ta-arrow[data-axis="notifications"] { grid-column:1; grid-row:5; }
      #ts-arrow-redesign .ta-node.ta-focused { transform:translateX(3px); }
      #ts-arrow-redesign .ta-focus { display:none; }
    }
    @media(prefers-reduced-motion:reduce) { #ts-arrow-redesign *,#ts-arrow-redesign *::before,#ts-arrow-redesign *::after { transition:none !important; animation:none !important; } }
  </style>
