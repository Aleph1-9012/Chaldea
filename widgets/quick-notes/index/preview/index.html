<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>Tsugumori / Notes b index</title><style>html{color-scheme:dark}body{margin:0;padding:16px;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}*,*::before,*::after{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}[hidden]{display:none!important}

<style>
  #ts-notes-b { --tnb-index: 150px; --tnb-row: 58px; width: 100%; max-width: 560px; margin: 0 auto; color: var(--notes-ink,#e8e8e8); font-family: "Share Tech Mono", monospace; color-scheme: dark; }

  #ts-notes-b .tnb-header { min-height: 52px; padding: 10px 18px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid rgba(var(--notes-accent-rgb,204,21,21),.3); }

  #ts-notes-b .tnb-new { margin-left: auto; flex-shrink: 0; background: var(--notes-paper,#0a0a0a); color: var(--notes-ink,#e8e8e8); border:1px solid rgba(var(--notes-accent-rgb,204,21,21),.55); padding: 7px 10px; font: 11px "Share Tech Mono", monospace; letter-spacing: 1px; cursor: pointer; transition: background-color 150ms, color 150ms; }

  #ts-notes-b .tnb-main { display: grid; grid-template-columns: min(34%, var(--tnb-index)) minmax(0, 1fr); min-height: 316px; }

  #ts-notes-b .tnb-reg::after { position: absolute; content: ""; left: 6px; top: 0; width: 1px; height: 5px; background: currentColor; }

<section aria-label="Indexed quick-notes drawer design" id="ts-notes-b">

<div class="tnb-main">

</section>

<style>

</style><style>
