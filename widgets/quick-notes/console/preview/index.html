<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>Tsugumori / Notes c console</title><style>html{color-scheme:dark}body{margin:0;padding:16px;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}*,*::before,*::after{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}[hidden]{display:none!important}
</style></head><body data-preview-width="492"><style>

#ts-notes-c { width:100%; max-width:460px; margin:0 auto; padding:6px 3px; box-sizing:border-box; color:var(--notes-ink,#e8e8e8); font-family:'Share Tech Mono',monospace; font-size:14px; line-height:1.4; }
#ts-notes-c *, #ts-notes-c *::before, #ts-notes-c *::after { box-sizing:border-box; }
#ts-notes-c .tnc-console { background:var(--notes-paper,#0a0a0a); }
#ts-notes-c .tnc-caption { position:relative; display:flex; justify-content:space-between; gap:8px; padding:6px 9px; border-top:1px solid var(--notes-rule,#743030); color:var(--notes-muted,#ba9b9b); font-size:11px; letter-spacing:1px; }
#ts-notes-c .tnc-caption::before, #ts-notes-c .tnc-caption::after { content:'+'; position:absolute; top:-10px; color:var(--notes-accent,#cc1515); font-size:14px; }
#ts-notes-c .tnc-caption::before { left:-3px; }
#ts-notes-c .tnc-caption::after { right:-3px; }
#ts-notes-c .tnc-panel { position:relative; padding:12px; border:1px solid var(--notes-rule,#562020); background:var(--notes-paper,#0a0a0a); }
#ts-notes-c .tnc-panel::before, #ts-notes-c .tnc-panel::after { content:''; position:absolute; width:15px; height:15px; pointer-events:none; }
#ts-notes-c .tnc-panel::before { left:-1px; top:-1px; border-top:1px solid var(--notes-accent,#cc1515); border-left:1px solid var(--notes-accent,#cc1515); }
#ts-notes-c .tnc-panel::after { right:-1px; bottom:-1px; border-bottom:1px solid var(--notes-accent,#cc1515); border-right:1px solid var(--notes-accent,#cc1515); }
#ts-notes-c .tnc-stamp { display:flex; justify-content:space-between; align-items:center; gap:10px; padding-bottom:8px; margin-bottom:10px; border-bottom:1px solid var(--notes-rule,#431c1c); color:var(--notes-muted,#b5a3a3); font-size:11px; letter-spacing:1px; }
#ts-notes-c .tnc-stamp span:first-child::before { content:''; display:inline-block; width:5px; height:5px; margin-right:7px; background:var(--notes-accent,#cc1515); vertical-align:middle; }
#ts-notes-c .tnc-title-line { display:flex; align-items:center; min-width:0; gap:9px; }
#ts-notes-c .tnc-prefix { flex:none; color:var(--notes-accent,#cc1515); font-size:24px; }
#ts-notes-c input, #ts-notes-c textarea, #ts-notes-c button { font-family:inherit; font-weight:400; border-radius:0; }
#ts-notes-c .tnc-title { display:block; width:100%; min-width:0; background:var(--notes-paper,#0a0a0a); color:var(--notes-ink,#e8e8e8); border:0; padding:3px 0; font-size:var(--notes-title-size); line-height:1.35; }
#ts-notes-c .tnc-body { display:block; width:100%; height:var(--notes-editor-height); min-height:100px; padding:10px 0 8px; margin:0 0 9px; border:0; resize:none; overflow:auto; background:var(--notes-paper,#0a0a0a); color:var(--notes-ink,#e8e8e8); font-size:16px; line-height:1.65; }
#ts-notes-c input::placeholder, #ts-notes-c textarea::placeholder { color:var(--notes-muted,#a69a9a); opacity:1; }
#ts-notes-c .tnc-actions { display:flex; gap:8px; border-top:1px solid var(--notes-rule,#431c1c); padding-top:10px; }
#ts-notes-c button { background:var(--notes-paper,#0a0a0a); color:var(--notes-ink,#e8e8e8); border:1px solid var(--notes-rule,#663030); cursor:pointer; padding:6px 10px; min-height:32px; font-size:12px; letter-spacing:1px; }
#ts-notes-c button:hover { background:var(--notes-hover,#2a1010); border-color:var(--notes-accent,#cc1515); }
#ts-notes-c .tnc-notes-toggle { flex:1; }
#ts-notes-c .tnc-new { min-width:80px; }
#ts-notes-c .tnc-note-index { margin-top:8px; display:grid; gap:3px; }
#ts-notes-c .tnc-note-index[hidden] { display:none; }
#ts-notes-c .tnc-note-option { display:flex; gap:10px; width:100%; text-align:left; border:1px solid transparent; padding:7px 9px; letter-spacing:0; font-size:14px; }
#ts-notes-c .tnc-note-option[aria-current='true'] { border-left:3px solid var(--notes-accent,#cc1515); padding-left:7px; background:var(--notes-hover,#1b0d0d); }
#ts-notes-c .tnc-note-number { color:var(--notes-muted,#c7a5a5); flex:none; }
#ts-notes-c .tnc-note-name { overflow-wrap:anywhere; min-width:0; }
#ts-notes-c .tnc-footer { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; border-top:1px solid var(--notes-rule,#743030); padding:6px 9px; color:var(--notes-muted,#ba9b9b); font-size:11px; letter-spacing:1px; }
#ts-notes-c .tnc-accessible { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
#ts-notes-c[data-spacing='comfortable'] .tnc-panel { padding:18px; }
#ts-notes-c[data-heading='red'] .tnc-title { color:var(--notes-accent,#cc1515); }
@media (pointer:coarse) { #ts-notes-c button { min-height:44px; } }
@media (max-width:360px) { #ts-notes-c .tnc-caption { letter-spacing:.5px; } #ts-notes-c .tnc-panel { padding:10px; } #ts-notes-c[data-spacing='comfortable'] .tnc-panel { padding:14px; } }
</style>
<section aria-label="Compact notes console" data-heading="white" data-spacing="compact" id="ts-notes-c">
<div class="tnc-console">
<div class="tnc-caption"><span>TSUGUMORI // PERSONAL LOG</span><span>C</span></div>
<div class="tnc-panel">
<div class="tnc-stamp"><span>QUICK NOTES</span><span class="tnc-note-count">NOTE 01 / 02</span></div>
<span data-text-count="" hidden=""></span>
<div class="tnc-title-line"><span aria-hidden="true" class="tnc-prefix">//</span>
<input aria-label="Note title" class="tnc-title" placeholder="Untitled note" spellcheck="false" value="Before I leave"/></div>
<textarea aria-label="Note contents" class="tnc-body" placeholder="Write a note…" spellcheck="false">Pick up groceries
Charge the headphones
Back up the dotfiles</textarea>
<div class="tnc-actions">
<button aria-controls="ts-notes-c-index" aria-expanded="false" class="tnc-notes-toggle" type="button">↓ NOTES · 02</button>
<button class="tnc-new" type="button">+ NEW</button>
</div>
<div aria-label="Choose a note" class="tnc-note-index" hidden="" id="ts-notes-c-index"></div>
</div>
<div class="tnc-footer"><span>TSUGUMORI NOTES</span><span>PREVIEW</span></div>
<div aria-live="polite" class="tnc-accessible" role="status"></div>
</div>
</section>

<style>
/* Palette controls for the notes preview. */
#ts-notes-c[data-custom-palette="true"] :is(input,textarea) { caret-color:var(--notes-ink); }
#ts-notes-c[data-custom-palette="true"] :is(button,input,textarea):focus-visible { outline-color:var(--notes-ink); }
#ts-notes-c[data-custom-palette="true"] :is(input,textarea)::selection { background:var(--notes-accent); color:var(--notes-on-accent); }
</style><style>
/* Reading and writing controls. */
#ts-notes-c [data-text-count] { display:block; color:var(--notes-muted,#909090); font:11px/1.5 monospace; margin-bottom:8px; }
#ts-notes-c textarea { height:var(--notes-editor-height); min-height:100px; overflow:auto; flex:none; }
#ts-notes-c .tnc-title { font-size:var(--notes-title-size); }
#ts-notes-c .tnc-note-index { position:relative; max-height:var(--notes-list-height); overflow-y:auto; gap:var(--notes-row-gap); scrollbar-width:thin; }
#ts-notes-c .tnc-note-option { min-height:var(--notes-row-height); flex-shrink:0; }
#ts-notes-c .tnc-note-option { height:var(--notes-row-height); overflow:hidden; padding-top:4px; padding-bottom:4px; }
#ts-notes-c[data-numbers="false"] .tnc-note-number { display:none; }
</style><script src="../preview-runtime.js"></script><script src="options.js"></script><script src="appearance.js"></script><script src="demo.js"></script></body></html>
