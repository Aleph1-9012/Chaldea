<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><meta content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" http-equiv="Content-Security-Policy"/><title>Tsugumori / Player directions / Ledger</title><style>html{color-scheme:dark}body{margin:0;padding:0;display:flow-root;background:transparent;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}*,*::before,*::after{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}[hidden]{display:none!important}figure{margin:0}svg{flex-shrink:0}

<style>
#tsugumori-player-studies { --ps-black:#0a0a0a; --ps-paper:#e8e8e8; --ps-red:#cc1515; --ps-muted:#a09b96; --ps-line:#34302f; color:var(--ps-paper); font-family:'JetBrains Mono','DejaVu Sans Mono',monospace; width:100%; background:transparent; font-size:12px; line-height:1.5; }
#tsugumori-player-studies * { box-sizing:border-box; }
#tsugumori-player-studies [hidden] { display:none !important; }
#tsugumori-player-studies .ps-design { width:100%; }
#tsugumori-player-studies .ps-surface { background:var(--ps-black); color:var(--ps-paper); border:1px solid var(--ps-line); position:relative; max-width:100%; }
#tsugumori-player-studies.ps-strong-frames .ps-surface { border-color:#716863; }
#tsugumori-player-studies .ps-surface::before, #tsugumori-player-studies .ps-surface::after { content:''; position:absolute; pointer-events:none; width:7px; height:7px; border-color:var(--ps-red); border-style:solid; z-index:2; }
#tsugumori-player-studies .ps-surface::before { top:-1px; left:-1px; border-width:1px 0 0 1px; }
#tsugumori-player-studies .ps-surface::after { bottom:-1px; right:-1px; border-width:0 1px 1px 0; }
#tsugumori-player-studies .ps-meta, #tsugumori-player-studies .ps-micro { font-size:11px; letter-spacing:1px; color:var(--ps-muted); }
#tsugumori-player-studies .ps-artist { color:var(--ps-muted); margin:7px 0 0; font-size:13px; }
#tsugumori-player-studies .ps-button { appearance:none; position:relative; isolation:isolate; display:inline-flex; align-items:center; justify-content:center; font:inherit; font-size:11px; font-weight:500; letter-spacing:1px; padding:10px 13px; min-height:39px; color:var(--ps-paper); background:transparent; border:1px solid #4a403c; cursor:pointer; overflow:hidden; white-space:nowrap; transition:border-color .2s,color .2s; }
#tsugumori-player-studies .ps-button::before { content:''; position:absolute; z-index:-1; inset:0; background:var(--ps-red); transform:translateX(-102%); transition:transform .24s cubic-bezier(.65,0,.35,1); }
#tsugumori-player-studies .ps-button:hover::before { transform:translateX(0); }
#tsugumori-player-studies .ps-button:hover { border-color:var(--ps-red); }
#tsugumori-player-studies .ps-button:active { color:#fff; }
#tsugumori-player-studies .ps-play { border-color:var(--ps-red); color:var(--ps-paper); min-width:84px; }
#tsugumori-player-studies .ps-playing .ps-play { background:var(--ps-red); }
#tsugumori-player-studies .ps-seek { appearance:none; display:block; width:100%; height:24px; margin:0; cursor:pointer; background:transparent; accent-color:var(--ps-red); }
#tsugumori-player-studies .ps-seek::-webkit-slider-runnable-track { height:3px; background:linear-gradient(to right,var(--ps-red) 0 var(--ps-progress,32%),#403a36 var(--ps-progress,32%) 100%); }
#tsugumori-player-studies .ps-seek::-webkit-slider-thumb { appearance:none; width:9px; height:13px; margin-top:-5px; border:0; border-radius:0; background:var(--ps-paper); }
#tsugumori-player-studies .ps-seek::-moz-range-track { height:3px; background:#403a36; }
#tsugumori-player-studies .ps-seek::-moz-range-progress { height:3px; background:var(--ps-red); }
#tsugumori-player-studies .ps-seek::-moz-range-thumb { width:9px; height:13px; border:0; border-radius:0; background:var(--ps-paper); }
#tsugumori-player-studies .ps-time { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--ps-muted); font-size:11px; font-variant-numeric:tabular-nums; }
#tsugumori-player-studies canvas[data-art] { display:block; width:100%; height:auto; aspect-ratio:1; filter:grayscale(1); }
#tsugumori-player-studies .ps-sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
@media(pointer:coarse) {
 #tsugumori-player-studies .ps-button { min-height:44px; }
 #tsugumori-player-studies .ps-seek { height:44px; }
}
@media(prefers-reduced-motion:reduce) {
 #tsugumori-player-studies *, #tsugumori-player-studies *::before, #tsugumori-player-studies *::after { transition:none !important; animation:none !important; }
}
</style>
<div aria-label="Tsugumori music player design studies" id="tsugumori-player-studies">





<style>
#tsugumori-player-studies .ps-track {position:relative;isolation:isolate;display:grid;grid-template-columns:45px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;margin:0;padding:12px 10px;border:0;border-bottom:1px solid #312e2b;border-radius:0;background:#0a0a0a;color:#e8e8e8;font:inherit;text-align:left;cursor:pointer;min-height:61px;overflow:hidden;}
#tsugumori-player-studies .ps-track::before {content:"";position:absolute;z-index:-1;inset:0;background:#cc1515;transform:scaleX(0);transform-origin:left center;transition:transform 220ms cubic-bezier(.2,.75,.2,1);}
#tsugumori-player-studies .ps-track:hover::before,
#tsugumori-player-studies .ps-track[aria-pressed="true"]::before {transform:scaleX(1);}
#tsugumori-player-studies .ps-track-number {font-size:12px;letter-spacing:-.025em;color:#a09b96;transition:color 160ms;}
#tsugumori-player-studies .ps-track-copy {display:flex;flex-direction:column;gap:5px;min-width:0;}
#tsugumori-player-studies .ps-track-title {font-size:13px;font-weight:500;line-height:1.3;overflow-wrap:anywhere;}
#tsugumori-player-studies .ps-track-artist {font-size:11px;line-height:1.3;color:#a09b96;transition:color 160ms;}
#tsugumori-player-studies .ps-track-length {font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;color:#a09b96;transition:color 160ms;}
#tsugumori-player-studies .ps-track:hover .ps-track-number,
#tsugumori-player-studies .ps-track:hover .ps-track-artist,
#tsugumori-player-studies .ps-track:hover .ps-track-length,
#tsugumori-player-studies .ps-track[aria-pressed="true"] .ps-track-number,
#tsugumori-player-studies .ps-track[aria-pressed="true"] .ps-track-artist,
#tsugumori-player-studies .ps-track[aria-pressed="true"] .ps-track-length {color:#e8e8e8;}
#tsugumori-player-studies .ps-ledger {max-width:630px;margin:0 auto;}
#tsugumori-player-studies .ps-ledger-caption {display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;padding:17px 18px;border-bottom:1px solid #363230;}
#tsugumori-player-studies .ps-ledger-heading {margin:0;font-size:19px;font-weight:500;letter-spacing:-.04em;}

#tsugumori-player-studies .ps-ledger-album {padding:18px 15px;border-right:1px solid #363230;min-width:0;}
#tsugumori-player-studies .ps-ledger-art {display:block;width:100%;aspect-ratio:1;border:1px solid #4a4540;}
#tsugumori-player-studies .ps-ledger-album .ps-micro {display:block;color:#a09b96;letter-spacing:.08em;margin:17px 0 7px;}
#tsugumori-player-studies .ps-ledger-album-name {font-size:12px;line-height:1.55;color:#e8e8e8;overflow-wrap:anywhere;}
#tsugumori-player-studies .ps-ledger-album .ps-artist {font-size:11px;line-height:1.5;margin-top:7px;}
#tsugumori-player-studies .ps-ledger-source {display:flex;align-items:center;gap:6px;margin-top:21px;}
#tsugumori-player-studies .ps-ledger-source::before {content:"";display:block;width:5px;height:5px;background:#cc1515;}
#tsugumori-player-studies .ps-ledger-right {min-width:0;}
#tsugumori-player-studies .ps-ledger-library-head {display:flex;justify-content:space-between;gap:12px;padding:16px 14px 12px;font-size:11px;letter-spacing:.10em;color:#a09b96;}
#tsugumori-player-studies .ps-ledger-right [data-library] {padding:0 10px 10px;}
#tsugumori-player-studies .ps-ledger-controls {border-top:1px solid #363230;padding:14px 14px 12px;}
#tsugumori-player-studies .ps-ledger-control-row {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;}
#tsugumori-player-studies .ps-ledger-transport {display:flex;gap:5px;}
#tsugumori-player-studies .ps-ledger-transport .ps-button {min-width:43px;height:36px;padding:0 8px;font-size:11px;}
#tsugumori-player-studies .ps-ledger-transport .ps-play {min-width:70px;}
#tsugumori-player-studies .ps-ledger-controls .ps-seek {display:block;width:100%;margin:0;}
#tsugumori-player-studies .ps-ledger-controls .ps-time {display:flex;justify-content:space-between;gap:12px;margin-top:8px;color:#a09b96;font-size:11px;font-variant-numeric:tabular-nums;}
#tsugumori-player-studies .ps-ledger-controls .ps-time [data-field="elapsed"] {color:#e8e8e8;}
@media(max-width:560px) {

  #tsugumori-player-studies .ps-ledger-controls {padding:12px 10px;}
  #tsugumori-player-studies .ps-ledger-control-row {flex-wrap:wrap;gap:10px;}
  #tsugumori-player-studies .ps-ledger-transport {flex:1;}
  #tsugumori-player-studies .ps-ledger-transport .ps-button {flex:1;}
  #tsugumori-player-studies .ps-track {grid-template-columns:38px minmax(0,1fr) auto;gap:6px;padding:11px 7px;}
}
@media(max-width:420px) {
  #tsugumori-player-studies .ps-ledger-caption {padding:15px 13px;}

  #tsugumori-player-studies .ps-ledger-album {display:grid;grid-template-columns:80px minmax(0,1fr);align-items:center;gap:14px;padding:15px 13px;border-right:0;border-bottom:1px solid #363230;}
  #tsugumori-player-studies .ps-ledger-art {width:80px;height:80px;}
  #tsugumori-player-studies .ps-ledger-album .ps-micro {margin:0 0 5px;}
  #tsugumori-player-studies .ps-ledger-source {margin-top:9px;}
  #tsugumori-player-studies .ps-ledger-right [data-library] {padding:0 8px 10px;}
  #tsugumori-player-studies .ps-ledger-controls {padding:13px;}
  #tsugumori-player-studies .ps-ledger-control-row {flex-wrap:nowrap;}
  #tsugumori-player-studies .ps-ledger-transport {flex:initial;}
  #tsugumori-player-studies .ps-ledger-transport .ps-button {min-width:42px;height:40px;}
  #tsugumori-player-studies .ps-ledger-transport .ps-play {min-width:66px;}
}
@media(pointer:coarse) {

}
@media(prefers-reduced-motion:reduce) {

  #tsugumori-player-studies .ps-track-number,
  #tsugumori-player-studies .ps-track-artist,
  #tsugumori-player-studies .ps-track-length {transition:none;}
}
</style>
