<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>Tsugumori / Clipboard control studies / Dark docks</title><style>html{color-scheme:dark}body{margin:0;padding:16px;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}*,*::before,*::after{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}[hidden],[data-archive-omitted]{display:none!important}.viz-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.btn,.nav-link{background:#151515;color:#ddd;border:1px solid #555;padding:8px 10px;cursor:pointer}.btn[aria-pressed=true],.nav-link.active{background:#cc1515;border-color:#cc1515;color:#080808}.text-small{font-size:11px}.text-muted{color:#999}.form-control,.form-select{background:#151515;color:#eee;border:1px solid #666;padding:7px}.form-range{accent-color:#cc1515}.nav{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}figure{margin:0}svg{flex-shrink:0}.archive-settings{border-top:1px solid #383434;margin:18px 0 0;padding:12px 0;font-size:11px}.archive-settings summary{cursor:pointer;color:#aaa;letter-spacing:1px}.archive-settings label{display:flex;align-items:center;gap:12px;padding-top:10px;flex-wrap:wrap}.archive-settings label span{min-width:145px}.archive-settings input[type=range]{width:150px;max-width:100%;accent-color:#cc1515}.archive-settings select{max-width:100%;background:#151515;color:#ddd;border:1px solid #555;padding:5px}.archive-settings output{color:#aaa}.archive-settings input[type=checkbox]{accent-color:#cc1515}
</style></head><body><style>

  #tsugumori-clipboard-studies { display: grid; gap: 14px; width: 100%; background: transparent; }
  #tsugumori-clipboard-studies [hidden] { display: none !important; }
  #tsugumori-clipboard-studies .clipboard {
    --cb-paper: #c8c8c4; --cb-key: #ecece7; --cb-ink: #252424; --cb-muted: #514f4a;
    --cb-rule: #a4a4a0; --cb-red: #d4161c; --cb-dark: #111112; --cb-white: #f4f2ec;
    --cb-grid: rgba(212,22,28,.16);
    width: 100%; max-width: 690px; margin-inline: auto; box-sizing: border-box;
    position: relative; color: var(--cb-ink); background-color: var(--cb-paper);
    background-image: linear-gradient(var(--cb-grid) 1px, transparent 1px), linear-gradient(90deg, var(--cb-grid) 1px, transparent 1px);
    background-size: 24px 24px; border: 1px solid var(--cb-rule); border-top: 3px solid var(--cb-red);
    font-family: Inter, sans-serif; font-size: 13px; line-height: 1.5;
  }
  #tsugumori-clipboard-studies .clipboard * { box-sizing: border-box; }
  #tsugumori-clipboard-studies .cb-top { display: flex; align-items: center; gap: 14px; padding: 16px 20px; }
  #tsugumori-clipboard-studies .cb-brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
  #tsugumori-clipboard-studies .cb-title { font-size: 12px; font-weight: 500; letter-spacing: 2.4px; white-space: nowrap; }
  #tsugumori-clipboard-studies .cb-separator { width: 26px; height: 1px; background: var(--cb-muted); flex-shrink: 0; }
  #tsugumori-clipboard-studies .cb-jp { font-size: 12px; color: var(--cb-muted); white-space: nowrap; }
  #tsugumori-clipboard-studies .cb-search-row { display: flex; gap: 10px; padding: 0 20px 16px; align-items: stretch; }
  #tsugumori-clipboard-studies .cb-search { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; padding: 0 10px; border: 1px solid transparent; }
  #tsugumori-clipboard-studies .cb-search > svg { flex-shrink: 0; color: var(--cb-red); }
  #tsugumori-clipboard-studies .cb-search input { width: 100%; min-width: 0; height: 42px; padding: 0; border: 0; border-radius: 0; background: transparent; color: inherit; font: 400 16px Inter, sans-serif; }
  #tsugumori-clipboard-studies .cb-search input::placeholder { color: var(--cb-muted); opacity: 1; }
  #tsugumori-clipboard-studies .cb-button {
    --key-fill: var(--cb-paper); --key-ink: #a3181e; --key-border: var(--cb-red);
    --hover-fill: var(--cb-red); --hover-ink: var(--cb-white);
    appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    position: relative; isolation: isolate; min-height: 36px; padding: 8px 12px;
    border: 1px solid var(--key-border); border-radius: 0; background: var(--key-fill); color: var(--key-ink);
    font: 500 11px/1.3 Inter, sans-serif; letter-spacing: 1.2px; white-space: nowrap; cursor: pointer;
  }
  #tsugumori-clipboard-studies .cb-button::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--hover-fill); transform: scaleX(0); transform-origin: left; transition: transform 220ms cubic-bezier(.76,0,.24,1); }
  #tsugumori-clipboard-studies .cb-button:not(:disabled):is(:hover,:focus-visible,[aria-pressed="true"])::before,
  #tsugumori-clipboard-studies .clipboard.force-hover .cb-button:not(:disabled)::before { transform: scaleX(1); }
  #tsugumori-clipboard-studies .cb-button:not(:disabled):is(:hover,:focus-visible,[aria-pressed="true"]),
  #tsugumori-clipboard-studies .clipboard.force-hover .cb-button:not(:disabled) { color: var(--hover-ink); }
  #tsugumori-clipboard-studies .cb-button:disabled { opacity: .45; cursor: default; }
  #tsugumori-clipboard-studies .cb-close { width: 36px; height: 36px; padding: 0; flex-shrink: 0; }
  #tsugumori-clipboard-studies .cb-pinned { min-width: 92px; --key-ink: var(--cb-muted); }
  #tsugumori-clipboard-studies .cb-body { border-top: 1px solid var(--cb-rule); border-bottom: 1px solid var(--cb-rule); display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  #tsugumori-clipboard-studies .cb-list-pane { min-width: 0; border-right: 1px solid var(--cb-rule); }
  #tsugumori-clipboard-studies .cb-label-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; color: var(--cb-muted); font-size: 11px; letter-spacing: 1px; }
  #tsugumori-clipboard-studies .cb-mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0; }
  #tsugumori-clipboard-studies .cb-list { min-height: 180px; }
  #tsugumori-clipboard-studies .cb-entry { display: grid; grid-template-columns: 24px minmax(0,1fr); column-gap: 10px; width: 100%; padding: 13px 20px; text-align: left; border: 0; border-top: 1px solid var(--cb-rule); border-radius: 0; background: transparent; color: var(--cb-ink); cursor: pointer; font: 400 13px/1.5 Inter, sans-serif; }
  #tsugumori-clipboard-studies .cb-entry[aria-pressed="true"] { background: var(--cb-red); color: var(--cb-white); }
  #tsugumori-clipboard-studies .cb-entry:not([aria-pressed="true"]):hover { background: var(--cb-key); }
  #tsugumori-clipboard-studies .cb-entry-number { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding-top: 2px; }
  #tsugumori-clipboard-studies .cb-entry-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #tsugumori-clipboard-studies .cb-entry-meta { grid-column: 2; font-size: 11px; letter-spacing: .6px; margin-top: 3px; }
  #tsugumori-clipboard-studies .cb-detail { min-width: 0; }
  #tsugumori-clipboard-studies .cb-preview { margin: 8px 20px 24px; min-height: 123px; white-space: pre-wrap; overflow-wrap: anywhere; font: 400 13px/1.8 'JetBrains Mono', monospace; }
  #tsugumori-clipboard-studies .cb-empty { padding: 20px; color: var(--cb-muted); font-size: 13px; }
  #tsugumori-clipboard-studies .cb-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; }
  #tsugumori-clipboard-studies .cb-count { font: 400 11px/1.5 'JetBrains Mono', monospace; color: var(--cb-muted); white-space: nowrap; }
  #tsugumori-clipboard-studies .cb-actions { display: flex; gap: 8px; }
  #tsugumori-clipboard-studies .cb-use { min-width: 134px; }
  #tsugumori-clipboard-studies .cb-confirm { position: absolute; z-index: 3; inset: auto 0 0; padding: 20px; background: var(--cb-dark); color: var(--cb-white); border-top: 2px solid var(--cb-red); }
  #tsugumori-clipboard-studies .cb-confirm-label { margin-bottom: 14px; font-size: 13px; }
  #tsugumori-clipboard-studies .cb-confirm .cb-button { --key-fill: var(--cb-dark); --key-ink: var(--cb-white); }
  #tsugumori-clipboard-studies .cb-confirm .cb-confirm-clear { --key-fill: var(--cb-red); }

  /* A: Opaque black bands separate controls from the paper grid. */
  #tsugumori-clipboard-studies [data-variant="a"] .cb-header,
  #tsugumori-clipboard-studies [data-variant="a"] .cb-footer { background: var(--cb-dark); color: var(--cb-white); }
  #tsugumori-clipboard-studies [data-variant="a"] :is(.cb-jp,.cb-count) { color: #b5b4ad; }
  #tsugumori-clipboard-studies [data-variant="a"] .cb-search { background: #232324; border-color: #444143; border-left: 3px solid var(--cb-red); }
  #tsugumori-clipboard-studies [data-variant="a"] .cb-search input::placeholder { color: #b5b4ad; }
  #tsugumori-clipboard-studies [data-variant="a"] .cb-button { --key-fill: #232324; --key-ink: var(--cb-white); --key-border: #696567; }
  #tsugumori-clipboard-studies [data-variant="a"] :is(.cb-use,.cb-close) { --key-fill: var(--cb-red); --key-border: var(--cb-red); --hover-fill: var(--cb-white); --hover-ink: var(--cb-dark); }

  /* B: Opaque key faces and a two-pixel mechanical edge. */
  #tsugumori-clipboard-studies [data-variant="b"] .cb-button { --key-fill: var(--cb-key); --key-ink: var(--cb-ink); --key-border: #393737; box-shadow: 2px 2px 0 #393737; }
  #tsugumori-clipboard-studies [data-variant="b"] .cb-button:active { box-shadow: none; transform: translate(1px,1px); }
  #tsugumori-clipboard-studies [data-variant="b"] .cb-use { --key-fill: var(--cb-dark); --key-ink: var(--cb-white); --key-border: var(--cb-dark); box-shadow: 2px 2px 0 var(--cb-red); }
  #tsugumori-clipboard-studies [data-variant="b"] .cb-search { background: var(--cb-key); border: 1px solid #66635f; border-bottom: 2px solid var(--cb-red); }

  /* C: Red plates identify controls even at rest. */
  #tsugumori-clipboard-studies [data-variant="c"] .cb-top,
  #tsugumori-clipboard-studies [data-variant="c"] .cb-footer { background: #dadad5; }
  #tsugumori-clipboard-studies [data-variant="c"] .cb-title { background: var(--cb-dark); color: var(--cb-white); padding: 7px 9px; }
  #tsugumori-clipboard-studies [data-variant="c"] .cb-separator { width: 10px; background: var(--cb-red); }
  #tsugumori-clipboard-studies [data-variant="c"] .cb-search-row { padding-top: 10px; }
  #tsugumori-clipboard-studies [data-variant="c"] .cb-search { background: var(--cb-key); border-color: var(--cb-rule); }
  #tsugumori-clipboard-studies [data-variant="c"] .cb-button { --key-fill: var(--cb-red); --key-ink: var(--cb-white); --hover-fill: var(--cb-dark); }
  #tsugumori-clipboard-studies [data-variant="c"] .cb-clear { --key-fill: var(--cb-key); --key-ink: var(--cb-ink); --hover-fill: var(--cb-red); border-left-width: 4px; }

  /* D: Only the functional groups sit inside dark recessed docks. */
  #tsugumori-clipboard-studies [data-variant="d"] .cb-close { --key-fill: var(--cb-dark); --key-ink: var(--cb-white); --key-border: var(--cb-dark); }
  #tsugumori-clipboard-studies [data-variant="d"] .cb-search-row { margin: 0 20px 16px; padding: 5px; background: var(--cb-dark); gap: 5px; border-bottom: 2px solid var(--cb-red); }
  #tsugumori-clipboard-studies [data-variant="d"] .cb-search { color: var(--cb-white); }
  #tsugumori-clipboard-studies [data-variant="d"] .cb-search input::placeholder { color: #b5b4ad; }
  #tsugumori-clipboard-studies [data-variant="d"] .cb-pinned { --key-fill: #303032; --key-ink: var(--cb-white); --key-border: #696567; }
  #tsugumori-clipboard-studies [data-variant="d"] .cb-actions { background: var(--cb-dark); padding: 5px; gap: 5px; }
  #tsugumori-clipboard-studies [data-variant="d"] .cb-clear { --key-fill: var(--cb-dark); --key-ink: var(--cb-white); --key-border: #696567; }
  #tsugumori-clipboard-studies [data-variant="d"] .cb-use { --key-fill: var(--cb-key); --key-ink: var(--cb-dark); --key-border: var(--cb-key); border-bottom: 2px solid var(--cb-red); }

  @media (max-width: 560px) {
    #tsugumori-clipboard-studies .cb-body { grid-template-columns: minmax(0,1fr); }
    #tsugumori-clipboard-studies .cb-list-pane { border-right: 0; border-bottom: 1px solid var(--cb-rule); }
    #tsugumori-clipboard-studies .cb-preview { min-height: 70px; }
    #tsugumori-clipboard-studies .cb-count { flex-basis: 100%; }
    #tsugumori-clipboard-studies .cb-actions { width: 100%; }
    #tsugumori-clipboard-studies .cb-actions > .cb-button { flex: 1; }
  }
  @media (max-width: 380px) {
    #tsugumori-clipboard-studies .cb-top { padding: 12px; gap: 8px; }
    #tsugumori-clipboard-studies .cb-brand { gap: 8px; }
    #tsugumori-clipboard-studies .cb-separator { width: 14px; }
    #tsugumori-clipboard-studies .cb-title { letter-spacing: 1.6px; }
    #tsugumori-clipboard-studies .cb-search-row { padding: 0 12px 12px; gap: 6px; }
    #tsugumori-clipboard-studies [data-variant="c"] .cb-search-row { padding-top: 10px; }
    #tsugumori-clipboard-studies [data-variant="d"] .cb-search-row { margin: 0 12px 12px; padding: 4px; }
    #tsugumori-clipboard-studies .cb-search { gap: 6px; padding-inline: 6px; }
    #tsugumori-clipboard-studies .cb-footer { padding: 12px; }
    #tsugumori-clipboard-studies .cb-use { min-width: 0; }
    #tsugumori-clipboard-studies .cb-button { padding-inline: 9px; letter-spacing: .9px; }
    #tsugumori-clipboard-studies .cb-close { padding: 0; }
    #tsugumori-clipboard-studies .cb-pinned { min-width: 82px; }
  }
  @media (pointer: coarse) { #tsugumori-clipboard-studies .cb-button { min-height: 44px; } #tsugumori-clipboard-studies .cb-close { width: 44px; height: 44px; } }
  @media (prefers-reduced-motion: reduce) { #tsugumori-clipboard-studies .cb-button::before { transition: none; } }
</style>
<div id="tsugumori-clipboard-studies">
<div aria-label="Clipboard control designs" class="viz-row" role="group">
<button aria-pressed="false" class="btn" data-design="current" type="button">Current</button>
<button aria-pressed="true" class="btn btn-primary" data-design="a" type="button">A · Black bands</button>
<button aria-pressed="false" class="btn" data-design="b" type="button">B · Raised keys</button>
<button aria-pressed="false" class="btn" data-design="c" type="button">C · Red plates</button>
<button aria-pressed="false" class="btn" data-design="d" type="button">D · Dark docks</button>
</div>
<section aria-label="Clipboard design A, black header and footer bands. Sample entries only." class="clipboard" data-variant="a">
<header class="cb-header">
<div class="cb-top">
<div class="cb-brand"><span class="cb-title">CLIPBOARD</span><span aria-hidden="true" class="cb-separator"></span><span class="cb-jp" lang="ja">履歴</span></div>
<button aria-label="Close clipboard preview" class="cb-button cb-close" type="button"><i aria-hidden="true" data-lucide="x"></i></button>
</div>
<div class="cb-search-row">
<label class="cb-search"><i aria-hidden="true" data-lucide="search"></i><input aria-label="Search sample copied items" autocomplete="off" placeholder="Search copied items..." type="search"/></label>
<button aria-pressed="false" class="cb-button cb-pinned" type="button">PINNED</button>
</div>
</header>
<div class="cb-body">
<section aria-label="Sample clipboard history" class="cb-list-pane">
<div class="cb-label-row"><span>RECENT COPIES</span><span class="cb-mono cb-visible-count">03</span></div>
<div class="cb-list">
<button aria-pressed="false" class="cb-entry" data-entry="01" type="button"><span class="cb-entry-number">01</span><span class="cb-entry-title">Terminal refinement</span><span class="cb-entry-meta">PINNED · TEXT</span></button>
<button aria-pressed="false" class="cb-entry" data-entry="02" type="button"><span class="cb-entry-number">02</span><span class="cb-entry-title">Tsugumori repository</span><span class="cb-entry-meta">2 MIN AGO · TEXT</span></button>
<button aria-pressed="true" class="cb-entry" data-entry="03" type="button"><span class="cb-entry-number">03</span><span class="cb-entry-title">Everyday shortcuts</span><span class="cb-entry-meta">5 MIN AGO · TEXT</span></button>
</div>
</section>
<section aria-label="Selected entry preview" class="cb-detail">
<div class="cb-label-row"><span>PREVIEW</span><span class="cb-mono cb-type">03 / TEXT</span></div>
<div aria-live="polite" class="cb-preview">Super + N opens Quick Notes.
Super + J opens clipboard history.</div>
</section>
</div>
<footer class="cb-footer">
<span aria-live="polite" class="cb-count">03 ENTRIES // LOCAL</span>
<div class="cb-actions">
<button class="cb-button cb-clear" type="button">CLEAR HISTORY</button>
<button class="cb-button cb-use" type="button"><span class="cb-use-label">USE ENTRY</span><i aria-hidden="true" data-lucide="corner-down-left"></i></button>
</div>
</footer>
<div aria-label="Clear sample history confirmation" class="cb-confirm" hidden="" role="group">
<div class="cb-confirm-label">Clear the unpinned sample entries?</div>
<div class="cb-actions">
<button class="cb-button cb-cancel" type="button">CANCEL</button>
<button class="cb-button cb-confirm-clear" type="button">CLEAR SAMPLES</button>
</div>
</div>
</section>
<div class="reopen-zone" hidden=""><button class="btn cb-reopen" type="button">Reopen preview</button></div>
</div>

<style></style><script src="../preview-runtime.js"></script><script src="support.js"></script><script src="demo.js"></script></body></html>
