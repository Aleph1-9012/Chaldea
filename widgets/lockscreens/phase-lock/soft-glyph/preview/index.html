<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>Tsugumori / Phase lock / Soft glyph</title><style>html{color-scheme:dark}body{margin:0;padding:16px;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}*,*::before,*::after{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}[hidden],[data-archive-omitted]{display:none!important}.viz-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.btn,.nav-link{background:#151515;color:#ddd;border:1px solid #555;padding:8px 10px;cursor:pointer}.btn[aria-pressed=true],.nav-link.active{background:#cc1515;border-color:#cc1515;color:#080808}.text-small{font-size:11px}.text-muted{color:#999}.form-control,.form-select{background:#151515;color:#eee;border:1px solid #666;padding:7px}.form-range{accent-color:#cc1515}.nav{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}figure{margin:0}svg{flex-shrink:0}.archive-settings{border-top:1px solid #383434;margin:18px 0 0;padding:12px 0;font-size:11px}.archive-settings summary{cursor:pointer;color:#aaa;letter-spacing:1px}.archive-settings label{display:flex;align-items:center;gap:12px;padding-top:10px;flex-wrap:wrap}.archive-settings label span{min-width:145px}.archive-settings input[type=range]{width:150px;max-width:100%;accent-color:#cc1515}.archive-settings select{max-width:100%;background:#151515;color:#ddd;border:1px solid #555;padding:5px}.archive-settings output{color:#aaa}.archive-settings input[type=checkbox]{accent-color:#cc1515}
</style></head><body>
<div id="ts-phase-formation-lock">
<div aria-label="Full-screen background sequence previews" class="viz-row" role="group">
<button class="btn" data-action="enter" type="button">Play lock</button>
<button class="btn" data-action="exit" type="button">Play unlock</button>
<span aria-live="polite" class="text-small" data-sequence-status="" role="status">Phase lock · locked frame</span>
</div>
<section aria-label="Phase lock with D formation corners and the centered Red folio and K panel" class="wb-stage" id="fl-background-panel" role="region">
<canvas aria-label="Short glyph fragments subdivide and settle in place as the center panel becomes active" class="wb-field" role="img">Full-screen lock and unlock animation preview.</canvas>
<canvas aria-label="D formation terminal corner decorations" class="fl-corners" role="img">Angular terminal links and a four-position formation strip.</canvas>
<canvas aria-hidden="true" class="fl-register"></canvas>
<div class="fl-shell">
<section aria-label="Centered Red folio and K reference panel" class="wb-panel">
<aside aria-label="Tsugumori" class="wb-folio">
<span class="wb-folio-top">TYPE-17</span>
<div class="wb-title" lang="ja"><span>継</span><span>衛</span></div>
<span class="wb-folio-bottom">SID0NIA</span>
</aside>
<div class="wb-login">
<header class="wb-user-head">
<div class="wb-register"><span>USER <b>//</b></span><span class="wb-unit">◆ 704</span></div>
<div class="wb-user">SILVERHAND9012</div>
</header>
<div class="wb-clock-strip">
<time aria-label="00:14" datetime="2026-09-14T00:14:00">00<span>:</span>14</time>
<div class="wb-date"><span>14 SEP</span><span>MON <b>//</b> 2026</span></div>
</div>
<canvas aria-label="K compound glyph, unchanged by the background animation" class="wb-glyph" height="324" role="img" width="324">K compound glyph.</canvas>
<div class="wb-auth">
<label for="fl-dummy-input"><span>PASSWORD <b>//</b></span><span lang="ja">認証</span></label>
<div class="wb-input-row"><input aria-label="Demo password. Use dummy text only. No authentication takes place." autocapitalize="off" autocomplete="off" id="fl-dummy-input" maxlength="64" placeholder="Dummy text only…" spellcheck="false" type="password"/><button aria-label="Preview unlock animation" class="wb-unlock" type="button"><i aria-hidden="true" data-lucide="arrow-up-right"></i></button></div>
<span aria-live="polite" class="wb-auth-status" role="status">PREVIEW ONLY</span>
</div>
</div>
</section>
</div>
<span data-field-name="" hidden="">PHASE LOCK</span>
<span data-lock-state="" hidden="">LOCKED</span>
</section>
</div>
<style>
  #ts-phase-formation-lock { width:100%; container-type:inline-size; }
  #ts-phase-formation-lock .wb-stage { --wb-red:#d1161c; --wb-white:#e4e2dc; --wb-grey:#99958c; position:relative; isolation:isolate; display:grid; place-items:center; box-sizing:border-box; width:100%; min-height:640px; aspect-ratio:8/5; margin-top:16px; padding:68px 28px; overflow:hidden; background:#080808; color:var(--wb-white); font:400 11px/1.4 "JetBrains Mono",monospace; }
  #ts-phase-formation-lock .wb-stage *, #ts-phase-formation-lock .wb-stage *::before, #ts-phase-formation-lock .wb-stage *::after { box-sizing:border-box; }
  #ts-phase-formation-lock .wb-stage [hidden] { display:none !important; }
  #ts-phase-formation-lock .wb-field { position:absolute; inset:0; width:100%; height:100%; z-index:-1; }
  #ts-phase-formation-lock .fl-corners { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }
  #ts-phase-formation-lock .fl-shell { position:relative; width:min(100%,408px); min-width:0; }
  #ts-phase-formation-lock .fl-register { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }
  #ts-phase-formation-lock .wb-panel { position:relative; display:grid; grid-template-columns:106px minmax(0,1fr); width:100%; min-width:0; border:1px solid #49423a; background:#090909; }
  #ts-phase-formation-lock .wb-folio { display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:20px 9px; color:#170b0a; background:var(--wb-red); }
  #ts-phase-formation-lock .wb-folio-top, #ts-phase-formation-lock .wb-folio-bottom { font-size:11px; font-weight:500; letter-spacing:1px; }
  #ts-phase-formation-lock .wb-folio-bottom { background:#190a09; color:var(--wb-red); padding:4px 7px; }
  #ts-phase-formation-lock .wb-title { display:flex; flex-direction:column; font:500 68px/1.08 "Noto Sans JP",sans-serif; }
  #ts-phase-formation-lock .wb-login { display:grid; gap:18px; padding:20px; min-width:0; }
  #ts-phase-formation-lock .wb-register { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--wb-grey); font-size:11px; letter-spacing:1px; }
  #ts-phase-formation-lock .wb-stage b { color:var(--wb-red); font-weight:400; }
  #ts-phase-formation-lock .wb-unit { background:var(--wb-red); color:#090909; padding:3px 7px; font-weight:500; }
  #ts-phase-formation-lock .wb-user { margin-top:9px; font-size:17px; font-weight:500; letter-spacing:.7px; overflow-wrap:anywhere; }
  #ts-phase-formation-lock .wb-clock-strip { display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:1px solid #3b3631; padding:0 0 14px; }
  #ts-phase-formation-lock .wb-clock-strip time { font-size:32px; line-height:1.1; white-space:nowrap; letter-spacing:-1px; }
  #ts-phase-formation-lock .wb-clock-strip time span { color:var(--wb-red); }
  #ts-phase-formation-lock .wb-date { display:grid; gap:3px; color:var(--wb-grey); border-left:1px solid #3b3631; padding-left:12px; font-size:11px; }
  #ts-phase-formation-lock .wb-date > span:first-child { color:var(--wb-white); }
  #ts-phase-formation-lock .wb-glyph { width:min(100%,162px); aspect-ratio:1; height:auto; display:block; justify-self:center; }
  #ts-phase-formation-lock .wb-auth { display:grid; gap:9px; min-width:0; }
  #ts-phase-formation-lock .wb-auth label { display:flex; justify-content:space-between; gap:12px; font-size:11px; letter-spacing:.7px; color:var(--wb-grey); }
  #ts-phase-formation-lock .wb-input-row { display:grid; grid-template-columns:minmax(0,1fr) 42px; border:1px solid #55504a; border-left:2px solid var(--wb-red); background:#111; }
  #ts-phase-formation-lock #fl-dummy-input { width:100%; min-width:0; border:0; border-radius:0; padding:10px; appearance:none; -webkit-appearance:none; background:transparent; color:var(--wb-white); font:400 16px/1.3 "JetBrains Mono",monospace; letter-spacing:2px; caret-color:var(--wb-red); }
  /* The red left edge replaces the native white focus box for this field. */
  #ts-phase-formation-lock #fl-dummy-input:is(:hover, :focus, :focus-visible) { background:transparent; border:0; outline:none; box-shadow:none; }
  #ts-phase-formation-lock .wb-input-row:focus-within { border-left-color:#ed272d; }
  #ts-phase-formation-lock #fl-dummy-input::placeholder { font-size:11px; letter-spacing:0; color:var(--wb-grey); opacity:1; }
  #ts-phase-formation-lock .wb-unlock { min-width:42px; min-height:42px; padding:8px; display:flex; align-items:center; justify-content:center; border:0; border-radius:0; background:var(--wb-red); color:#090909; cursor:pointer; }
  #ts-phase-formation-lock .wb-unlock:hover { background:#e7282e; }
  #ts-phase-formation-lock .wb-unlock svg { width:16px; height:16px; }
  #ts-phase-formation-lock .wb-auth-status { font-size:11px; color:var(--wb-grey); min-height:15px; }
  @container(max-width:540px) {
    #ts-phase-formation-lock .wb-stage { min-height:650px; aspect-ratio:auto; padding:66px 16px; }
    #ts-phase-formation-lock .wb-panel { grid-template-columns:64px minmax(0,1fr); }
    #ts-phase-formation-lock .wb-title { font-size:43px; }
    #ts-phase-formation-lock .wb-folio-top { writing-mode:vertical-rl; }
    #ts-phase-formation-lock .wb-folio-bottom { writing-mode:vertical-rl; padding:7px 4px; }
    #ts-phase-formation-lock .wb-login { padding:14px; gap:16px; }
    #ts-phase-formation-lock .wb-user { font-size:14px; letter-spacing:.1px; }
    #ts-phase-formation-lock .wb-clock-strip { align-items:flex-start; flex-wrap:wrap; gap:8px; }
    #ts-phase-formation-lock .wb-clock-strip time { font-size:30px; }
    #ts-phase-formation-lock .wb-date { border-left:0; padding:0; }
  }
  @media(pointer:coarse) { #ts-phase-formation-lock .wb-unlock { min-height:44px; } }
</style>
