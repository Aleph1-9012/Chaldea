<style>

    #ts-cc-studies { --cc-red:#cc1515; --cc-bg:#111111; --cc-white:#e8e8e8; --cc-muted:#96928e; --cc-line:#55403e; --cc-grid:rgba(204,21,21,.085); --cc-mono:'JetBrains Mono','JetBrainsMono Nerd Font',monospace; --cc-text:'Inter',sans-serif; width:100%; container-type:inline-size; font:400 12px/1.4 var(--cc-mono); color:var(--cc-white); }

    #ts-cc-studies .cc-cross { min-height:442px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:86px 86px 86px; gap:34px 34px; align-content:center; }
