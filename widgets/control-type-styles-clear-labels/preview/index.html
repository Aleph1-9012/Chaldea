</style></head><body><div aria-label="Tsugumori control center typography and style alternatives" id="ts-cc-type-styles">
<style>

    #ts-cc-type-styles { --tt-white:#e8e8e8; --tt-red:#cc1515; --tt-soft:#a0a0a0; --tt-panel:#111; --tt-mono:'JetBrains Mono',monospace; --tt-sans:'Inter',sans-serif; --tt-condensed:'Barlow Condensed','Arial Narrow',sans-serif; --tt-title-offset:0px; --tt-tracking-offset:0px; --tt-inner:.30; color:var(--tt-white); font:400 13px/1.4 var(--tt-sans); width:100%; container-type:inline-size; }
    #ts-cc-type-styles * { box-sizing:border-box; }
    #ts-cc-type-styles button { cursor:pointer; font:inherit; border-radius:0; }
    #ts-cc-type-styles .tt-choices { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
    #ts-cc-type-styles .tt-choice { min-width:0; position:relative; text-align:left; color:var(--tt-white); border:1px solid #444; padding:16px 14px 22px; background:#0a0a0a; }
    #ts-cc-type-styles .tt-choice:hover { border-color:#888; }
    #ts-cc-type-styles .tt-choice[aria-pressed="true"] { border-color:var(--tt-red); }
    #ts-cc-type-styles .tt-choice[aria-pressed="true"]::after { content:''; position:absolute; right:15px; top:20px; width:6px; height:6px; background:var(--tt-red); transform:rotate(45deg); }
    #ts-cc-type-styles .tt-choice-name { display:block; font:400 12px var(--tt-mono); letter-spacing:.5px; padding-right:12px; }
    #ts-cc-type-styles .tt-choice-name b { font-weight:500; color:var(--tt-red); }
    #ts-cc-type-styles .tt-choice-font { display:block; font:400 11px var(--tt-mono); color:var(--tt-soft); margin-top:7px; line-height:1.5; }
    #ts-cc-type-styles .tt-swatch { display:block; margin-top:30px; --tt-title-offset:0px; --tt-tracking-offset:0px; --tt-inner:.30; }
    #ts-cc-type-styles .tt-treatment { --tt-heading:var(--tt-sans); --tt-value-font:var(--tt-sans); --tt-title-size:14px; --tt-title-spacing:.5px; --tt-value-size:13px; --tt-transform:none; --tt-outer:#d4d4d4; --tt-corner:#e8e8e8; --tt-center-font:var(--tt-sans); --tt-center-size:17px; --tt-center-space:5px; }
    #ts-cc-type-styles .tt-treatment[data-style="mono"] { --tt-heading:var(--tt-mono); --tt-value-font:var(--tt-mono); --tt-title-size:12px; --tt-title-spacing:.65px; --tt-value-size:12px; --tt-transform:uppercase; --tt-outer:#b5b5b5; --tt-center-font:var(--tt-mono); --tt-center-size:17px; --tt-center-space:3px; }
    #ts-cc-type-styles .tt-treatment[data-style="condensed"] { --tt-heading:var(--tt-condensed); --tt-title-size:19px; --tt-title-spacing:1.25px; --tt-transform:uppercase; --tt-outer:#959595; --tt-center-font:var(--tt-condensed); --tt-center-size:25px; --tt-center-space:5px; }
    #ts-cc-type-styles .tt-face { display:block; position:relative; width:100%; min-width:0; height:84px; padding:0; text-align:left; background:var(--tt-panel); border:1px solid var(--tt-outer); color:var(--tt-white); transition:transform 220ms cubic-bezier(.2,.7,.2,1),border-color 220ms; }
    #ts-cc-type-styles .tt-face::before { content:''; position:absolute; inset:3px; border:1px solid var(--tt-white); opacity:var(--tt-inner); pointer-events:none; }
    #ts-cc-type-styles .tt-title { position:absolute; top:-11px; left:16px; max-width:calc(100% - 30px); padding:0 7px; background:var(--tt-panel); color:var(--tt-white); font:500 calc(var(--tt-title-size) + var(--tt-title-offset))/22px var(--tt-heading); letter-spacing:calc(var(--tt-title-spacing) + var(--tt-tracking-offset)); text-transform:var(--tt-transform); white-space:nowrap; transition:background 220ms,color 220ms; }
    #ts-cc-type-styles .tt-value { position:absolute; top:20px; left:41px; right:16px; color:#d1d1d1; font:400 var(--tt-value-size)/20px var(--tt-value-font); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #ts-cc-type-styles .tt-strip { position:absolute; bottom:4px; left:4px; right:4px; height:28px; padding:0 12px; border-top:1px solid #e8e8e840; display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--tt-soft); font:400 11px/16px var(--tt-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
    #ts-cc-type-styles .tt-live { display:flex; align-items:center; gap:6px; }
    #ts-cc-type-styles .tt-live::before { content:''; width:4px; height:4px; background:var(--tt-red); }
    #ts-cc-type-styles .tt-side { position:absolute; left:-1px; top:0; bottom:0; width:4px; background:var(--tt-white); transition:background 220ms; }
    #ts-cc-type-styles .tt-square { position:absolute; top:23px; left:16px; width:10px; height:10px; background:var(--tt-white); opacity:.85; transition:opacity 220ms,transform 220ms; }
    #ts-cc-type-styles .tt-focused { border-color:var(--tt-white); }
    #ts-cc-type-styles .tt-focused .tt-side { background:var(--tt-red); }
    #ts-cc-type-styles .tt-focused .tt-value { color:var(--tt-white); }
    #ts-cc-type-styles .tt-focused .tt-square { opacity:0; transform:scale(0); }
    #ts-cc-type-styles .tt-corner { position:absolute; width:8px; height:8px; border:0 solid var(--tt-corner); pointer-events:none; }
    #ts-cc-type-styles .tt-corner.tl { left:5px; top:-3px; border-top-width:2px; border-left-width:2px; }
    #ts-cc-type-styles .tt-corner.tr { right:-1px; top:-3px; border-top-width:2px; border-right-width:2px; }
    #ts-cc-type-styles .tt-corner.bl { left:5px; bottom:-3px; border-bottom-width:2px; border-left-width:2px; }
    #ts-cc-type-styles .tt-corner.br { right:-1px; bottom:-3px; border-bottom-width:2px; border-right-width:2px; }
    #ts-cc-type-styles .tt-treatment[data-style="mono"] .tt-face:not(.tt-center) { background-color:var(--tt-panel); background-image:linear-gradient(#cc15150d 1px,transparent 1px),linear-gradient(90deg,#cc15150d 1px,transparent 1px); background-size:12px 12px; }
    #ts-cc-type-styles .tt-treatment[data-style="mono"] .tt-title { top:4px; left:4px; right:4px; max-width:none; height:23px; padding:0 11px; line-height:23px; background:#1b1b1b; border-bottom:1px solid #e8e8e82e; }
    #ts-cc-type-styles .tt-treatment[data-style="mono"] .tt-value { top:31px; left:31px; right:12px; line-height:20px; }
    #ts-cc-type-styles .tt-treatment[data-style="mono"] .tt-square { top:37px; left:16px; width:5px; height:5px; }
    #ts-cc-type-styles .tt-treatment[data-style="mono"] .tt-strip { height:23px; background:#111; padding:0 11px; }
    #ts-cc-type-styles .tt-treatment[data-style="mono"] .tt-focused .tt-title { background:var(--tt-red); border-bottom-color:var(--tt-red); color:#080808; }
    #ts-cc-type-styles .tt-treatment[data-style="condensed"] .tt-title { top:-12px; line-height:24px; padding:0 7px; }
    #ts-cc-type-styles .tt-treatment[data-style="condensed"] .tt-value { top:19px; left:37px; font-size:13px; }
    #ts-cc-type-styles .tt-treatment[data-style="condensed"] .tt-strip { background:#1a1a1a; border-top:0; height:25px; color:#b4b4b4; }
    #ts-cc-type-styles .tt-treatment[data-style="condensed"] .tt-square { left:16px; top:25px; width:7px; height:7px; }
    #ts-cc-type-styles .tt-treatment[data-style="condensed"] .tt-corner { width:12px; height:7px; }
    #ts-cc-type-styles .tt-treatment[data-style="condensed"] .tt-focused .tt-corner { border-color:var(--tt-red); }
    #ts-cc-type-styles .tt-treatment[data-style="condensed"] .tt-focused .tt-strip { box-shadow:inset 2px 0 var(--tt-red); }
    #ts-cc-type-styles .tt-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:12px 15px; background:#111; color:var(--tt-soft); font:400 11px var(--tt-mono); border-bottom:1px solid #333; }
    #ts-cc-type-styles .tt-bar .tt-selected-name { color:var(--tt-white); }
    #ts-cc-type-styles .tt-bar .tt-fixed-arrow { margin-left:auto; }
    #ts-cc-type-styles .tt-stage { background:#0a0a0a; padding:48px 24px; color-scheme:dark; }
    #ts-cc-type-styles .tt-cross { display:grid; grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr) 70px minmax(0,1fr); grid-template-rows:84px 66px 84px 66px 84px; align-items:center; }
    #ts-cc-type-styles .tt-node[data-node="connection"] { grid-column:3; grid-row:1; }
    #ts-cc-type-styles .tt-node[data-node="share"] { grid-column:1; grid-row:3; }
    #ts-cc-type-styles .tt-node[data-node="notifications"] { grid-column:5; grid-row:3; }
    #ts-cc-type-styles .tt-node[data-node="audio"] { grid-column:3; grid-row:5; }
    #ts-cc-type-styles .tt-node.tt-focused { transform:translateX(8px); }
    #ts-cc-type-styles .tt-center { grid-column:3; grid-row:3; height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
    #ts-cc-type-styles .tt-center strong { font:500 var(--tt-center-size)/1 var(--tt-center-font); letter-spacing:var(--tt-center-space); margin-left:var(--tt-center-space); }
    #ts-cc-type-styles .tt-center small { font:400 11px/1.2 var(--tt-mono); color:var(--tt-soft); letter-spacing:.35px; }
    #ts-cc-type-styles .tt-focus { position:absolute; left:-32px; top:calc(50% - 7px); width:18px; height:14px; opacity:0; transition:opacity 220ms; }
    #ts-cc-type-styles .tt-focus::before { content:''; position:absolute; top:3px; left:0; width:7px; height:7px; background:var(--tt-white); transform:rotate(45deg); }
    #ts-cc-type-styles .tt-focus::after { content:''; position:absolute; top:3px; left:10px; width:7px; height:7px; border-top:1px solid var(--tt-white); border-right:1px solid var(--tt-white); transform:rotate(45deg); }
    #ts-cc-type-styles .tt-focused .tt-focus { opacity:1; }
    #ts-cc-type-styles .tt-arrow { position:relative; width:36px; height:36px; justify-self:center; pointer-events:none; transform:rotate(var(--tt-angle)); transition:transform 320ms cubic-bezier(.2,.7,.2,1); }
    #ts-cc-type-styles .tt-arrow[data-axis="connection"] { grid-column:3; grid-row:2; }
    #ts-cc-type-styles .tt-arrow[data-axis="audio"] { grid-column:3; grid-row:4; }
    #ts-cc-type-styles .tt-arrow[data-axis="share"] { grid-column:2; grid-row:3; }
    #ts-cc-type-styles .tt-arrow[data-axis="notifications"] { grid-column:4; grid-row:3; }
    #ts-cc-type-styles .tt-glyph { position:relative; display:block; width:36px; height:36px; font-size:36px; color:var(--tt-white); opacity:.65; transition:opacity 220ms; }
    #ts-cc-type-styles .tt-arrow.tt-active .tt-glyph { opacity:1; }
    #ts-cc-type-styles .tt-glyph > i,#ts-cc-type-styles .tt-glyph > span { position:absolute; display:block; }
    #ts-cc-type-styles .tt-gate { width:.16em; height:.16em; border:0 solid currentColor; }
    #ts-cc-type-styles .tt-gate.g1 { top:.16em; left:.16em; border-top-width:.036em; border-left-width:.036em; }
    #ts-cc-type-styles .tt-gate.g2 { top:.16em; right:.16em; border-top-width:.036em; border-right-width:.036em; }
    #ts-cc-type-styles .tt-gate.g3 { bottom:.16em; left:.16em; border-bottom-width:.036em; border-left-width:.036em; }
    #ts-cc-type-styles .tt-gate.g4 { bottom:.16em; right:.16em; border-bottom-width:.036em; border-right-width:.036em; }
    #ts-cc-type-styles .tt-glyph .tt-core { inset:.24em; transition:color 220ms; }
    #ts-cc-type-styles .tt-core svg { display:block; width:100% !important; height:100% !important; stroke-width:1.8; stroke-linecap:square; stroke-linejoin:miter; }
    #ts-cc-type-styles .tt-active .tt-core { color:var(--tt-red); }
    #ts-cc-type-styles .tt-footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding-top:12px; color:light-dark(#5c534e,#aaa39e); font:400 11px var(--tt-mono); }
    @container(max-width:850px) {
      #ts-cc-type-styles .tt-choices { gap:10px; }
      #ts-cc-type-styles .tt-choice { padding:14px 10px 18px; }
      #ts-cc-type-styles .tt-choice-font { min-height:34px; }
      #ts-cc-type-styles .tt-swatch { margin-top:24px; }
      #ts-cc-type-styles .tt-stage { padding:42px 18px; }
      #ts-cc-type-styles .tt-cross { grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr) 48px minmax(0,1fr); }
      #ts-cc-type-styles .tt-title { left:10px; padding:0 5px; max-width:calc(100% - 18px); letter-spacing:var(--tt-tracking-offset); }
      #ts-cc-type-styles .tt-treatment[data-style="condensed"] .tt-title { letter-spacing:calc(.7px + var(--tt-tracking-offset)); }
      #ts-cc-type-styles .tt-treatment[data-style="mono"] .tt-title { padding:0 9px; }
      #ts-cc-type-styles .tt-value { left:31px; right:10px; }
      #ts-cc-type-styles .tt-treatment[data-style="condensed"] .tt-value { left:31px; }
      #ts-cc-type-styles .tt-square { left:12px; }
      #ts-cc-type-styles .tt-strip { padding:0 8px; gap:5px; }
      #ts-cc-type-styles .tt-focus { left:-20px; width:12px; }
      #ts-cc-type-styles .tt-focus::before { width:5px; height:5px; top:5px; }
      #ts-cc-type-styles .tt-focus::after { width:5px; height:5px; top:5px; left:6px; }
    }
    @container(max-width:620px) {
      #ts-cc-type-styles .tt-choices { grid-template-columns:1fr; gap:10px; }
      #ts-cc-type-styles .tt-choice { padding:13px 16px 17px; }
      #ts-cc-type-styles .tt-choice-font { min-height:0; }
      #ts-cc-type-styles .tt-swatch { margin-top:22px; }
      #ts-cc-type-styles .tt-bar .tt-fixed-arrow { margin-left:0; }
      #ts-cc-type-styles .tt-stage { padding:28px 18px; }
      #ts-cc-type-styles .tt-cross { grid-template-columns:44px minmax(0,1fr); grid-template-rows:56px repeat(4,84px); gap:20px 12px; }
      #ts-cc-type-styles .tt-center { grid-column:1 / -1; grid-row:1; }
      #ts-cc-type-styles .tt-node[data-node="connection"] { grid-column:2; grid-row:2; }
      #ts-cc-type-styles .tt-node[data-node="share"] { grid-column:2; grid-row:3; }
      #ts-cc-type-styles .tt-node[data-node="audio"] { grid-column:2; grid-row:4; }
      #ts-cc-type-styles .tt-node[data-node="notifications"] { grid-column:2; grid-row:5; }
      #ts-cc-type-styles .tt-arrow[data-axis="connection"] { grid-column:1; grid-row:2; }
      #ts-cc-type-styles .tt-arrow[data-axis="share"] { grid-column:1; grid-row:3; }
      #ts-cc-type-styles .tt-arrow[data-axis="audio"] { grid-column:1; grid-row:4; }
      #ts-cc-type-styles .tt-arrow[data-axis="notifications"] { grid-column:1; grid-row:5; }
      #ts-cc-type-styles .tt-node.tt-focused { transform:translateX(3px); }
      #ts-cc-type-styles .tt-focus { display:none; }
    }
    @media(prefers-reduced-motion:reduce) { #ts-cc-type-styles *,#ts-cc-type-styles *::before,#ts-cc-type-styles *::after { transition:none !important; animation:none !important; } }
  </style>

</nav>
<div class="tt-bar"><span aria-live="polite" class="tt-selected-name" role="status">A // CLEAR LABELS</span><span class="tt-fixed-arrow">ARROW C // FIXED ACROSS ALL STYLES</span></div>
