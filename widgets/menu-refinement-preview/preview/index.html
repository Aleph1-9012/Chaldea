<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>Tsugumori / Menu refinement preview</title><style>html{color-scheme:dark}body{margin:0;padding:16px;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}*,*::before,*::after{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}[hidden],[data-archive-omitted]{display:none!important}.viz-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.btn,.nav-link{background:#151515;color:#ddd;border:1px solid #555;padding:8px 10px;cursor:pointer}.btn[aria-pressed=true],.nav-link.active{background:#cc1515;border-color:#cc1515;color:#080808}.text-small{font-size:11px}.text-muted{color:#999}.form-control,.form-select{background:#151515;color:#eee;border:1px solid #666;padding:7px}.form-range{accent-color:#cc1515}.nav{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}figure{margin:0}svg{flex-shrink:0}.archive-settings{border-top:1px solid #383434;margin:18px 0 0;padding:12px 0;font-size:11px}.archive-settings summary{cursor:pointer;color:#aaa;letter-spacing:1px}.archive-settings label{display:flex;align-items:center;gap:12px;padding-top:10px;flex-wrap:wrap}.archive-settings label span{min-width:145px}.archive-settings input[type=range]{width:150px;max-width:100%;accent-color:#cc1515}.archive-settings select{max-width:100%;background:#151515;color:#ddd;border:1px solid #555;padding:5px}.archive-settings output{color:#aaa}.archive-settings input[type=checkbox]{accent-color:#cc1515}
</style></head><body><div aria-label="Tsugumori Menu refinement preview" id="tsugumori-menu-refinement">
<style>

    #tsugumori-menu-refinement {
      --tm-paper: #0a0a0a;
      --tm-red: #cc1515;
      --tm-bright: #e8e8e8;
      --tm-muted: #92908e;
      --tm-line: rgba(204,21,21,.22);
      --tm-grid: rgba(204,21,21,.08);
      --tm-mono: 'JetBrains Mono', 'JetBrainsMono Nerd Font', monospace;
      --tm-text: 'Inter', sans-serif;
      --tm-row-height: 54px;
      color: var(--tm-bright);
      font-family: var(--tm-text);
      position: relative;
      width: 100%;
      container-type: inline-size;
      color-scheme: dark;
    }
    #tsugumori-menu-refinement * { box-sizing: border-box; }
    #tsugumori-menu-refinement button,
    #tsugumori-menu-refinement input { font-family: inherit; }
    #tsugumori-menu-refinement button { cursor: pointer; border-radius: 0; }
    #tsugumori-menu-refinement [hidden] { display: none !important; }
    #tsugumori-menu-refinement .tm-stage { position: relative; overflow: hidden; }
    #tsugumori-menu-refinement .tm-menu {
      width: 100%; background-color: var(--tm-paper);
      background-image: linear-gradient(var(--tm-grid) 1px, transparent 1px), linear-gradient(90deg, var(--tm-grid) 1px, transparent 1px);
      background-size: 20px 20px; border: 1px solid var(--tm-red);
      position: relative; transform: translateX(0); opacity: 1;
      transition: transform 340ms cubic-bezier(.76,0,.24,1) 160ms, opacity 1ms 0ms;
    }
    #tsugumori-menu-refinement .tm-menu::after {
      content: ''; position: absolute; inset: 0; background: var(--tm-bright);
      transform: scaleX(0); transform-origin: right center; pointer-events: none; z-index: 10;
      transition: transform 280ms cubic-bezier(.76,0,.24,1);
    }
    #tsugumori-menu-refinement.tm-closed .tm-menu {
      transform: translateX(102%); opacity: 0; pointer-events: none;
      transition: transform 340ms cubic-bezier(.76,0,.24,1) 180ms, opacity 1ms 520ms;
    }
    #tsugumori-menu-refinement.tm-closed .tm-menu::after { transform: scaleX(1); }
    #tsugumori-menu-refinement .tm-header {
      min-height: 62px; padding: 14px 20px; display: flex; align-items: center;
      gap: 16px; border-bottom: 1px solid var(--tm-line);
    }
    #tsugumori-menu-refinement .tm-heading {
      display: flex; align-items: center; gap: 13px; flex: 1; min-width: 0;
      font-size: 12px; font-weight: 500; letter-spacing: 3px;
    }
    #tsugumori-menu-refinement .tm-rule { width: 24px; height: 1px; background: var(--tm-muted); flex-shrink: 0; }
    #tsugumori-menu-refinement .tm-japanese { color: var(--tm-muted); font-size: 12px; letter-spacing: 1.5px; white-space: nowrap; }
    #tsugumori-menu-refinement .tm-header-data {
      display: flex; align-items: center; gap: 16px; font: 11px var(--tm-mono);
      color: var(--tm-muted); white-space: nowrap; letter-spacing: .6px;
    }
    #tsugumori-menu-refinement .tm-clock { color: var(--tm-bright); font-variant-numeric: tabular-nums; }
    #tsugumori-menu-refinement .tm-small-button {
      display: grid; place-items: center; width: 30px; height: 30px; flex-shrink: 0;
      border: 1px solid var(--tm-line); color: var(--tm-red); background: var(--tm-paper);
      font-size: 21px; line-height: 1; transition: background 180ms, color 180ms;
    }
    #tsugumori-menu-refinement .tm-small-button:hover { background: var(--tm-red); color: var(--tm-paper); }
    #tsugumori-menu-refinement .tm-body { display: grid; grid-template-columns: 150px minmax(0,1fr); }
    #tsugumori-menu-refinement .tm-sidebar { border-right: 1px solid var(--tm-line); padding-top: 16px; display: flex; flex-direction: column; }
    #tsugumori-menu-refinement .tm-categories { display: flex; flex-direction: column; }
    #tsugumori-menu-refinement .tm-category {
      display: grid; grid-template-columns: 10px minmax(0,1fr) 20px; align-items: center; gap: 8px;
      min-height: 36px; width: 100%; padding: 0 12px 0 17px; text-align: left;
      font-size: 11px; letter-spacing: 1.2px; font-weight: 400;
      background: transparent; color: var(--tm-muted); border: 0; position: relative;
      transition: color 160ms, background 160ms;
    }
    #tsugumori-menu-refinement .tm-category:hover { background: rgba(232,232,232,.045); color: var(--tm-bright); }
    #tsugumori-menu-refinement .tm-category[aria-pressed="true"] { background: var(--tm-red); color: var(--tm-paper); }
    #tsugumori-menu-refinement .tm-category-mark { width: 4px; height: 1px; background: currentColor; transition: width 180ms; }
    #tsugumori-menu-refinement .tm-category:hover .tm-category-mark,
    #tsugumori-menu-refinement .tm-category[aria-pressed="true"] .tm-category-mark { width: 10px; }
    #tsugumori-menu-refinement .tm-category-count { font: 11px var(--tm-mono); text-align: right; opacity: .85; letter-spacing: 0; }
    #tsugumori-menu-refinement[data-category-style="edge"] .tm-category[aria-pressed="true"] { background: rgba(204,21,21,.1); color: var(--tm-bright); box-shadow: inset 2px 0 var(--tm-red); }
    #tsugumori-menu-refinement .tm-node-meter { margin-top: auto; padding: 30px 17px 22px; font: 11px var(--tm-mono); letter-spacing: .7px; color: var(--tm-muted); }
    #tsugumori-menu-refinement .tm-node-track { height: 2px; width: 76px; background: var(--tm-line); margin-top: 9px; }
    #tsugumori-menu-refinement .tm-node-fill { height: 100%; background: var(--tm-red); width: 100%; transition: width 220ms; }
    #tsugumori-menu-refinement .tm-main { min-width: 0; }
    #tsugumori-menu-refinement .tm-search {
      display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 10px 20px;
      border-bottom: 1px solid var(--tm-line); position: relative;
    }
    #tsugumori-menu-refinement .tm-search::after {
      content: ''; position: absolute; height: 1px; background: var(--tm-red); left: 20px; right: 20px; bottom: 0;
      transform: scaleX(0); transform-origin: left; transition: transform 240ms cubic-bezier(.2,.7,.2,1);
    }
    #tsugumori-menu-refinement .tm-search:focus-within::after { transform: scaleX(1); }
    #tsugumori-menu-refinement .tm-search-mark { color: var(--tm-red); font: 14px var(--tm-mono); }
    #tsugumori-menu-refinement .tm-search-input {
      min-width: 0; flex: 1; width: 100%; padding: 5px 0; border: 0; border-radius: 0;
      background: transparent; color: var(--tm-bright); font: 14px var(--tm-text); letter-spacing: .2px;
    }
    #tsugumori-menu-refinement .tm-search-input::placeholder { color: var(--tm-muted); opacity: 1; font-style: normal; }
    #tsugumori-menu-refinement .tm-search-input::-webkit-search-cancel-button { display: none; }
    #tsugumori-menu-refinement .tm-search-clear { width: 27px; height: 27px; visibility: hidden; }
    #tsugumori-menu-refinement .tm-search-clear.tm-has-query { visibility: visible; }
    #tsugumori-menu-refinement .tm-apps { min-height: calc(8 * var(--tm-row-height)); }
    #tsugumori-menu-refinement .tm-app-row {
      display: grid; grid-template-columns: 28px minmax(0,1fr) 84px 8px; align-items: center;
      gap: 13px; width: 100%; min-height: var(--tm-row-height); padding: 8px 20px;
      border: 0; border-bottom: 1px solid rgba(204,21,21,.1); background: transparent;
      color: var(--tm-red); text-align: left; position: relative; isolation: isolate;
    }
    #tsugumori-menu-refinement .tm-app-row::before {
      content: ''; position: absolute; inset: 0; z-index: -1; background: var(--tm-red);
      transform: scaleX(0); transform-origin: left; transition: transform 280ms cubic-bezier(.2,.7,.2,1);
    }
    #tsugumori-menu-refinement .tm-app-row.tm-selected::before { transform: scaleX(1); }
    #tsugumori-menu-refinement .tm-app-row.tm-selected { color: var(--tm-paper); }
    #tsugumori-menu-refinement .tm-app-icon {
      width: 28px; height: 28px; border: 1px solid currentColor; display: grid; place-items: center;
      font: 15px var(--tm-mono); transition: color 180ms;
    }
    #tsugumori-menu-refinement .tm-app-info { min-width: 0; }
    #tsugumori-menu-refinement .tm-title-line { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
    #tsugumori-menu-refinement .tm-app-number { font: 11px var(--tm-mono); color: var(--tm-muted); white-space: nowrap; }
    #tsugumori-menu-refinement .tm-app-name {
      font: 500 13px var(--tm-text); letter-spacing: .35px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #tsugumori-menu-refinement .tm-app-meta {
      font: 11px var(--tm-mono); opacity: 0; color: var(--tm-paper); padding-left: 37px; margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 180ms;
    }
    #tsugumori-menu-refinement .tm-app-category { font: 11px var(--tm-mono); color: var(--tm-muted); text-align: right; letter-spacing: .2px; }
    #tsugumori-menu-refinement .tm-app-row.tm-selected .tm-app-meta { opacity: .78; }
    #tsugumori-menu-refinement .tm-app-row.tm-selected .tm-app-category,
    #tsugumori-menu-refinement .tm-app-row.tm-selected .tm-app-number { color: var(--tm-paper); }
    #tsugumori-menu-refinement .tm-selection-mark { width: 6px; height: 6px; transform: rotate(45deg); background: var(--tm-paper); opacity: 0; }
    #tsugumori-menu-refinement .tm-app-row.tm-selected .tm-selection-mark { opacity: 1; }
    #tsugumori-menu-refinement .tm-empty { padding: 44px 20px; color: var(--tm-muted); font: 11px var(--tm-mono); letter-spacing: 1.3px; text-align: center; }
    #tsugumori-menu-refinement .tm-footer { border-top: 1px solid var(--tm-line); padding: 0 20px; }
    #tsugumori-menu-refinement .tm-footer-actions { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 46px; flex-wrap: wrap; }
    #tsugumori-menu-refinement .tm-action-group { display: flex; align-items: center; }
    #tsugumori-menu-refinement .tm-footer-button {
      color: var(--tm-muted); background: transparent; border: 0; font-size: 11px; letter-spacing: 1.2px;
      min-height: 38px; padding: 0 12px; position: relative;
    }
    #tsugumori-menu-refinement .tm-footer-button:first-child { padding-left: 0; }
    #tsugumori-menu-refinement .tm-footer-button::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 1px; background: var(--tm-red); transform: scaleX(0); transition: transform 180ms; }
    #tsugumori-menu-refinement .tm-footer-button:first-child::after { left: 0; }
    #tsugumori-menu-refinement .tm-footer-button:hover { color: var(--tm-bright); }
    #tsugumori-menu-refinement .tm-footer-button.tm-danger:hover { color: var(--tm-red); }
    #tsugumori-menu-refinement .tm-footer-button:hover::after { transform: scaleX(1); }
    #tsugumori-menu-refinement .tm-footer-secondary { min-height: 31px; border-top: 1px solid var(--tm-line); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 6px 0; }
    #tsugumori-menu-refinement .tm-action-state { font: 11px var(--tm-mono); letter-spacing: .3px; color: var(--tm-muted); min-width: 0; overflow-wrap: anywhere; }
    #tsugumori-menu-refinement .tm-keyboard { display: flex; align-items: center; gap: 14px; margin-left: auto; }
    #tsugumori-menu-refinement .tm-keyboard > span { white-space: nowrap; display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--tm-muted); letter-spacing: .5px; }
    #tsugumori-menu-refinement kbd { border: 1px solid var(--tm-line); background: var(--tm-paper); color: var(--tm-red); font: 11px var(--tm-mono); padding: 1px 4px; border-radius: 0; }
    #tsugumori-menu-refinement .tm-reopen {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      color: var(--tm-bright); background: var(--tm-paper); border: 1px solid var(--tm-red);
      padding: 13px 20px; font: 11px var(--tm-mono); letter-spacing: 2px; visibility: hidden;
    }
    #tsugumori-menu-refinement.tm-closed .tm-reopen { visibility: visible; }
    @container (max-width: 560px) {
      #tsugumori-menu-refinement .tm-header { padding: 12px 14px; gap: 12px; flex-wrap: wrap; }
      #tsugumori-menu-refinement .tm-heading { gap: 9px; letter-spacing: 2px; }
      #tsugumori-menu-refinement .tm-header-data { gap: 10px; }
      #tsugumori-menu-refinement .tm-header-count { display: none; }
      #tsugumori-menu-refinement .tm-body { display: block; }
      #tsugumori-menu-refinement .tm-sidebar { padding: 8px 0 0; border-right: 0; border-bottom: 1px solid var(--tm-line); }
      #tsugumori-menu-refinement .tm-categories { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 0; }
      #tsugumori-menu-refinement .tm-category { padding: 0 9px; gap: 5px; grid-template-columns: 4px minmax(0,1fr) 18px; letter-spacing: .2px; }
      #tsugumori-menu-refinement .tm-category:hover .tm-category-mark,
      #tsugumori-menu-refinement .tm-category[aria-pressed="true"] .tm-category-mark { width: 4px; }
      #tsugumori-menu-refinement .tm-node-meter { padding: 12px 14px; display: flex; align-items: center; gap: 14px; }
      #tsugumori-menu-refinement .tm-node-track { margin-top: 0; }
      #tsugumori-menu-refinement .tm-search { padding: 10px 14px; }
      #tsugumori-menu-refinement .tm-search-input { font-size: 16px; }
      #tsugumori-menu-refinement .tm-app-row { grid-template-columns: 28px minmax(0,1fr) 8px; gap: 11px; padding: 8px 14px; }
      #tsugumori-menu-refinement .tm-app-category { display: none; }
      #tsugumori-menu-refinement .tm-footer { padding: 0 14px; }
      #tsugumori-menu-refinement .tm-footer-actions { gap: 0; padding: 5px 0; }
      #tsugumori-menu-refinement .tm-footer-button { padding: 0 9px; letter-spacing: .7px; }
    }
    @container (max-width: 360px) {
      #tsugumori-menu-refinement .tm-japanese,
      #tsugumori-menu-refinement .tm-rule { display: none; }
      #tsugumori-menu-refinement .tm-categories { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (pointer: coarse) {
      #tsugumori-menu-refinement .tm-small-button { width: 44px; height: 44px; }
      #tsugumori-menu-refinement .tm-category,
      #tsugumori-menu-refinement .tm-footer-button { min-height: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #tsugumori-menu-refinement *, #tsugumori-menu-refinement *::before,
      #tsugumori-menu-refinement *::after { transition: none !important; animation: none !important; }
    }
  </style>
<div class="tm-stage">
<section aria-label="Application menu" class="tm-menu">
<header class="tm-header">
<div class="tm-heading"><span>SYSTEM</span><span aria-hidden="true" class="tm-rule"></span><span class="tm-japanese" lang="ja">システム</span></div>
<div class="tm-header-data"><span class="tm-header-count">08 APPS</span><time class="tm-clock">21:17</time></div>
<button aria-label="Close Menu" class="tm-small-button tm-close" type="button">×</button>
</header>
<div class="tm-body">
<aside aria-label="Application categories" class="tm-sidebar">
<nav aria-label="Filter applications" class="tm-categories"></nav>
<div class="tm-node-meter"><span class="tm-node-count">08/08 NODES</span><div aria-hidden="true" class="tm-node-track"><div class="tm-node-fill"></div></div></div>
</aside>
<div class="tm-main">
<div class="tm-search">
<span aria-hidden="true" class="tm-search-mark">▸</span>
<input aria-label="Search applications" autocomplete="off" class="tm-search-input" placeholder="Search applications…" spellcheck="false" type="search"/>
<button aria-label="Clear search" class="tm-small-button tm-search-clear" type="button">×</button>
</div>
<div aria-label="Applications" class="tm-apps" role="group"></div>
</div>
</div>
<footer class="tm-footer">
<div class="tm-footer-actions">
<div aria-label="Quick launches" class="tm-action-group">
<button class="tm-footer-button" data-action="Terminal" type="button">TERMINAL</button>
<button class="tm-footer-button" data-action="Files" type="button">FILES</button>
</div>
<div aria-label="Session actions" class="tm-action-group">
<button class="tm-footer-button" data-action="Lock" type="button">LOCK</button>
<button class="tm-footer-button tm-danger" data-action="Shutdown" type="button">SHUTDOWN</button>
<button class="tm-footer-button tm-danger" data-action="Restart" type="button">RESTART</button>
</div>
</div>
<div class="tm-footer-secondary">
<span aria-live="polite" class="tm-action-state" role="status">ALL APPLICATIONS</span>
<div aria-label="Keyboard shortcuts" class="tm-keyboard"><span><kbd>↑↓</kbd>NAV</span><span><kbd>↵</kbd>OPEN</span><span><kbd>ESC</kbd>CLOSE</span></div>
</div>
</footer>
</section>
<button class="tm-reopen" type="button">OPEN MENU</button>
</div>

</div>
<style></style><script src="../preview-runtime.js"></script><script src="support.js"></script><script src="demo.js"></script></body></html>
