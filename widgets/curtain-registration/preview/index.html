<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>

<title>Registration curtain</title><style>html{color-scheme:dark}body{margin:0;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}body>*{box-sizing:border-box}button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}.viz-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.btn{background:#151515;color:#ddd;border:1px solid #555;padding:8px 10px;cursor:pointer}.btn[aria-pressed=true]{background:#cc1515;border-color:#cc1515;color:#080808}.text-small{font-size:11px;padding:0 12px}[hidden]{display:none!important}body{padding:16px}</style></head><body>
<style>
#ts-curtain-a-refinements { --ts-red:#cc1515; --ts-dark:#0a0a0a; --ts-paper:#c8c8c4; --ts-muted:#96948e; color:var(--ts-paper); font:400 12px/1.5 'JetBrains Mono',monospace; width:100%; }
#ts-curtain-a-refinements * { box-sizing:border-box; }
#ts-curtain-a-refinements button,#ts-curtain-a-refinements select { font:inherit; color:var(--ts-paper); border:1px solid #48423e; background:#111111; border-radius:0; min-height:34px; padding:6px 12px; cursor:pointer; }
#ts-curtain-a-refinements button:hover { border-color:var(--ts-red); }
#ts-curtain-a-refinements button[aria-pressed="true"] { background:var(--ts-red); color:#080808; border-color:var(--ts-red); }
#ts-curtain-a-refinements .ts-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
#ts-curtain-a-refinements .ts-panel-select { display:flex; gap:4px; }
#ts-curtain-a-refinements .ts-toolbar .ts-replay { margin-left:auto; border-color:var(--ts-red); }
#ts-curtain-a-refinements .ts-grid { display:grid; grid-template-columns:1fr; gap:22px 20px; }
#ts-curtain-a-refinements .ts-study { min-width:0; }
#ts-curtain-a-refinements .ts-caption { display:flex; align-items:center; gap:12px; margin:0 0 8px; font-size:12px; font-weight:400; }
#ts-curtain-a-refinements .ts-letter { color:var(--ts-red); font-weight:500; font-size:16px; }
#ts-curtain-a-refinements .ts-caption-name { color:light-dark(#292824,#c8c8c4); }
#ts-curtain-a-refinements .ts-stage { position:relative; height:256px; overflow:hidden; isolation:isolate; background:#141414; }
#ts-curtain-a-refinements .ts-stage::before { content:''; position:absolute; inset:0; background:linear-gradient(145deg,transparent 52%,#171717 52.2%,#171717 70%,transparent 70.2%); }
#ts-curtain-a-refinements .ts-assembly { position:absolute; inset:0; overflow:hidden; }
#ts-curtain-a-refinements .ts-content { position:absolute; inset:0; }
#ts-curtain-a-refinements .ts-menu,#ts-curtain-a-refinements .ts-player { position:absolute; inset:0; background-color:var(--ts-dark); border:1px solid #62302d; }
#ts-curtain-a-refinements .ts-menu { background-image:linear-gradient(#cc15150b 1px,transparent 1px),linear-gradient(90deg,#cc15150b 1px,transparent 1px); background-size:20px 20px; }
#ts-curtain-a-refinements .ts-menu-head { height:41px; display:flex; gap:18px; padding:12px 16px; border-bottom:1px solid #cc151525; letter-spacing:2px; white-space:nowrap; font-size:11px; }
#ts-curtain-a-refinements .ts-menu-head span:last-child { color:var(--ts-muted); letter-spacing:1px; }
#ts-curtain-a-refinements .ts-menu-body { display:flex; height:177px; }
#ts-curtain-a-refinements .ts-categories { width:86px; flex-shrink:0; padding-top:13px; border-right:1px solid #cc15152c; }
#ts-curtain-a-refinements .ts-category { padding:7px 9px; letter-spacing:1px; font-size:11px; color:var(--ts-muted); }
#ts-curtain-a-refinements .ts-category:first-child { background:var(--ts-red); color:#090909; }
#ts-curtain-a-refinements .ts-apps { flex:1; min-width:0; }
#ts-curtain-a-refinements .ts-search { height:37px; padding:11px 13px; color:var(--ts-muted); font-size:11px; }
#ts-curtain-a-refinements .ts-app { display:flex; align-items:center; gap:10px; padding:7px 13px; height:33px; color:var(--ts-red); white-space:nowrap; }
#ts-curtain-a-refinements .ts-app span { color:var(--ts-muted); font-size:11px; }
#ts-curtain-a-refinements .ts-app.selected { background:var(--ts-red); color:#080808; }
#ts-curtain-a-refinements .ts-app.selected span { color:#080808; }
#ts-curtain-a-refinements .ts-footer { height:36px; display:flex; gap:18px; align-items:center; justify-content:center; border-top:1px solid #cc151533; color:var(--ts-muted); font-size:11px; letter-spacing:1px; }
#ts-curtain-a-refinements .ts-player-head { height:41px; border-bottom:1px solid #453a34; display:flex; align-items:center; justify-content:space-between; padding:0 14px; color:var(--ts-red); letter-spacing:1px; font-size:11px; }
#ts-curtain-a-refinements .ts-player-head span:last-child { color:var(--ts-muted); }
#ts-curtain-a-refinements .ts-player-body { display:flex; height:143px; }
#ts-curtain-a-refinements .ts-glyph { margin:12px; width:112px; flex-shrink:0; display:flex; justify-content:center; align-items:center; overflow:hidden; color:#827c76; background:#0d0d0d; font:400 8px/9px monospace; white-space:pre; letter-spacing:2px; }
#ts-curtain-a-refinements .ts-player-meta { min-width:0; padding:14px 8px; }
#ts-curtain-a-refinements .ts-playing { color:var(--ts-muted); font-size:11px; }
#ts-curtain-a-refinements .ts-playing::before { content:''; display:inline-block; width:4px; height:4px; margin-right:7px; background:var(--ts-red); }
#ts-curtain-a-refinements .ts-song { font-size:23px; margin-top:9px; letter-spacing:1px; }
#ts-curtain-a-refinements .ts-artist { color:var(--ts-muted); margin-top:2px; }
#ts-curtain-a-refinements .ts-album { color:var(--ts-muted); font-size:11px; margin-top:11px; }
#ts-curtain-a-refinements .ts-progress { margin:4px 14px 0; height:2px; background:#453a34; }
#ts-curtain-a-refinements .ts-progress::before { content:''; display:block; width:35%; height:2px; background:var(--ts-red); }
#ts-curtain-a-refinements .ts-times { display:flex; justify-content:space-between; padding:5px 14px 7px; color:var(--ts-muted); font-size:11px; }
#ts-curtain-a-refinements .ts-transport { display:flex; gap:8px; padding:0 14px; font-size:11px; letter-spacing:1px; }
#ts-curtain-a-refinements .ts-transport span { flex:1; border:1px solid #49433d; text-align:center; padding:5px 2px; }
#ts-curtain-a-refinements .ts-transport span:nth-child(2) { background:var(--ts-red); color:#090909; border-color:var(--ts-red); }
#ts-curtain-a-refinements [hidden] { display:none !important; }
#ts-curtain-a-refinements .ts-curtain { position:absolute; top:0; right:0; bottom:0; width:55%; overflow:hidden; pointer-events:none; }
#ts-curtain-a-refinements .ts-red-field { background:var(--ts-red); color:#130707; }
#ts-curtain-a-refinements .ts-red-field .ts-stencil { position:absolute; right:16px; top:18px; display:flex; flex-direction:column; gap:3px; font-size:11px; letter-spacing:2px; white-space:nowrap; }
#ts-curtain-a-refinements .ts-red-field::after { content:''; position:absolute; right:16px; bottom:17px; width:46px; height:3px; background:#160707; }
#ts-curtain-a-refinements .ts-additions { position:absolute; inset:0; opacity:var(--ts-detail-opacity,0.8); }
#ts-curtain-a-refinements .ts-crop { position:absolute; width:12px; height:12px; border-color:#130707; border-style:solid; border-width:0; }
#ts-curtain-a-refinements .ts-crop.tl { top:8px; left:8px; border-top-width:1px; border-left-width:1px; }
#ts-curtain-a-refinements .ts-crop.tr { top:8px; right:8px; border-top-width:1px; border-right-width:1px; }
#ts-curtain-a-refinements .ts-crop.bl { bottom:8px; left:8px; border-bottom-width:1px; border-left-width:1px; }
#ts-curtain-a-refinements .ts-crop.br { bottom:8px; right:8px; border-bottom-width:1px; border-right-width:1px; }
#ts-curtain-a-refinements .ts-unit-code { position:absolute; left:23px; bottom:20px; font-size:11px; white-space:nowrap; letter-spacing:1px; }
#ts-curtain-a-refinements .ts-unit-code::before { content:''; display:block; height:12px; width:72px; margin-bottom:7px; background:repeating-linear-gradient(90deg,#130707 0 1px,transparent 1px 4px,#130707 4px 7px,transparent 7px 9px,#130707 9px 10px,transparent 10px 15px,#130707 15px 17px,transparent 17px 19px); }
#ts-curtain-a-refinements .ts-rail { position:absolute; left:17px; top:85px; bottom:39px; width:11px; border-left:1px solid #130707; background:repeating-linear-gradient(0deg,#130707 0 1px,transparent 1px 14px); }
#ts-curtain-a-refinements .ts-rail::before,#ts-curtain-a-refinements .ts-rail::after { content:''; position:absolute; left:-3px; width:5px; height:5px; background:#130707; }
#ts-curtain-a-refinements .ts-rail::before { top:0; } #ts-curtain-a-refinements .ts-rail::after { bottom:0; }
#ts-curtain-a-refinements .ts-rail-name { position:absolute; top:97px; left:35px; writing-mode:vertical-rl; font-size:11px; letter-spacing:2px; }
#ts-curtain-a-refinements .ts-hatch { position:absolute; right:16px; bottom:30px; width:46px; height:7px; background:repeating-linear-gradient(120deg,#130707 0 2px,transparent 2px 6px); }
#ts-curtain-a-refinements .ts-ghost { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font:400 74px/1 'Noto Sans CJK JP',sans-serif; letter-spacing:6px; white-space:nowrap; color:#130707; opacity:0.22; }
#ts-curtain-a-refinements .ts-ghost-caption { position:absolute; left:50%; top:calc(50% + 48px); transform:translateX(-50%); white-space:nowrap; font-size:11px; letter-spacing:4px; opacity:0.6; }
#ts-curtain-a-refinements .ts-inspector { display:flex; align-items:center; gap:12px; margin-top:20px; color:light-dark(#48423e,#c8c8c4); font-size:11px; }
#ts-curtain-a-refinements .ts-inspector input { flex:1; min-width:50px; accent-color:var(--ts-red); cursor:pointer; }
#ts-curtain-a-refinements .ts-state { min-width:95px; text-align:right; font-variant-numeric:tabular-nums; }
#ts-curtain-a-refinements[data-details="false"] .ts-additions { display:none; }
@media(max-width:580px) { #ts-curtain-a-refinements .ts-grid { grid-template-columns:1fr; } }
@media(pointer:coarse) { #ts-curtain-a-refinements button,#ts-curtain-a-refinements select { min-height:44px; } #ts-curtain-a-refinements .ts-inspector input { min-height:44px; } }
</style>
