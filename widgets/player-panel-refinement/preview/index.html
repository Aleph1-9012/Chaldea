#tsg-panel-study{--tsg-bg:#111111;--tsg-paper:#e8e8e8;--tsg-muted:#909090;--tsg-line:rgba(232,232,232,.16);--tsg-red:#cc1515;--tsg-grid:rgba(204,21,21,.04);--tsg-title:20px;--tsg-ui:'Inter',Arial,sans-serif;--tsg-mono:'JetBrains Mono',monospace;font-family:var(--tsg-ui);color:var(--tsg-paper);width:100%;max-width:700px;margin:0 auto;padding:3px;color-scheme:dark}
#tsg-panel-study *{box-sizing:border-box}
#tsg-panel-study [hidden]{display:none!important}
#tsg-panel-study .player-frame{position:relative;background:var(--tsg-bg);border:1px solid rgba(232,232,232,.6);padding:5px}
#tsg-panel-study .player-frame::before{content:'';position:absolute;inset:4px;border:1px solid rgba(232,232,232,.22);pointer-events:none;z-index:2}
#tsg-panel-study .edge-tab{position:absolute;left:-2px;top:16px;width:4px;height:40px;background:var(--tsg-red);z-index:3}
#tsg-panel-study .frame-corner{position:absolute;width:8px;height:8px;border-color:var(--tsg-paper);border-style:solid;pointer-events:none;z-index:3}
#tsg-panel-study .frame-corner.tl{top:-2px;left:6px;border-width:2px 0 0 2px}
#tsg-panel-study .frame-corner.tr{top:-2px;right:-2px;border-width:2px 2px 0 0}
#tsg-panel-study .frame-corner.bl{bottom:-2px;left:6px;border-width:0 0 2px 2px}
#tsg-panel-study .frame-corner.br{bottom:-2px;right:-2px;border-width:0 2px 2px 0}
#tsg-panel-study .player-header{min-height:46px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--tsg-line);font-size:11px;letter-spacing:4px}
#tsg-panel-study .header-name{display:flex;align-items:center;gap:16px;font-weight:500}
#tsg-panel-study .header-rule{width:36px;height:1px;background:rgba(204,21,21,.55);flex:none}
#tsg-panel-study .header-id{font-family:var(--tsg-mono);color:var(--tsg-muted);letter-spacing:1.5px;font-size:10px;white-space:nowrap}
#tsg-panel-study .main-panel{display:grid;grid-template-columns:46% 54%}
#tsg-panel-study .matrix-area{padding:18px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--tsg-line);min-width:0}
#tsg-panel-study .glyph-art{width:100%;aspect-ratio:1;display:block;background:#111111;cursor:crosshair;touch-action:pan-y}
#tsg-panel-study .matrix-caption{display:flex;justify-content:space-between;margin-top:14px;font-family:var(--tsg-mono);font-size:10px;letter-spacing:1px;color:var(--tsg-muted)}
#tsg-panel-study .metadata-area{padding:28px 24px 20px;display:flex;flex-direction:column;min-width:0;background-image:linear-gradient(var(--tsg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--tsg-grid) 1px,transparent 1px);background-size:20px 20px}
#tsg-panel-study .source-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--tsg-mono);font-size:10px;letter-spacing:1.4px;color:var(--tsg-muted);line-height:1.6}
#tsg-panel-study .status-square{width:5px;height:5px;flex:none;background:var(--tsg-red)}
#tsg-panel-study .track-title{font-family:var(--tsg-ui);font-size:var(--tsg-title);font-weight:500;line-height:1.45;letter-spacing:.5px;margin:22px 0 8px;color:var(--tsg-paper);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
#tsg-panel-study .track-artist{font-size:12px;letter-spacing:.3px;color:var(--tsg-muted);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tsg-panel-study .album-row{display:flex;align-items:center;gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid rgba(204,21,21,.25);min-width:0}
#tsg-panel-study .track-index{font-family:var(--tsg-mono);font-size:11px;letter-spacing:.5px;line-height:1.6;color:var(--tsg-muted);white-space:nowrap}
#tsg-panel-study .track-index::after{content:' //';color:var(--tsg-red)}
#tsg-panel-study .album-name{font-family:var(--tsg-mono);font-size:10px;letter-spacing:.8px;line-height:1.7;color:var(--tsg-muted);overflow-wrap:anywhere}
#tsg-panel-study .seek-area{margin-top:auto;padding-top:24px}
#tsg-panel-study .transport-area{border-top:1px solid var(--tsg-line);padding:15px 18px 18px}
#tsg-panel-study .seek-bar{appearance:none;-webkit-appearance:none;display:block;width:100%;height:24px;margin:0 0 3px;border:0;border-radius:0;background:linear-gradient(to right,var(--tsg-red) 0 var(--tsg-progress,32%),#3b3b3b var(--tsg-progress,32%) 100%) center/100% 3px no-repeat;cursor:pointer}
#tsg-panel-study .seek-bar::-webkit-slider-thumb{appearance:none;width:9px;height:13px;border:0;border-radius:0;background:var(--tsg-paper)}
#tsg-panel-study .seek-bar::-moz-range-thumb{width:9px;height:13px;border:0;border-radius:0;background:var(--tsg-paper)}
#tsg-panel-study .track-times{display:flex;justify-content:space-between;font-family:var(--tsg-mono);font-size:11px;color:var(--tsg-muted);line-height:17px}
#tsg-panel-study .transport-buttons{display:grid;grid-template-columns:1fr 1.45fr 1fr 1.08fr;gap:10px}
#tsg-panel-study .transport-button{--tsg-corner:rgba(232,232,232,.7);--tsg-fill:var(--tsg-paper);position:relative;isolation:isolate;min-width:0;min-height:44px;cursor:pointer;border:0;padding:10px;background:transparent;color:var(--tsg-paper);font:500 10px var(--tsg-ui);letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:0;transition:color 220ms}
#tsg-panel-study .transport-button::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--tsg-corner),var(--tsg-corner)) left top/10px 1px no-repeat,linear-gradient(var(--tsg-corner),var(--tsg-corner)) left top/1px 10px no-repeat,linear-gradient(var(--tsg-corner),var(--tsg-corner)) right top/10px 1px no-repeat,linear-gradient(var(--tsg-corner),var(--tsg-corner)) right top/1px 10px no-repeat,linear-gradient(var(--tsg-corner),var(--tsg-corner)) left bottom/10px 1px no-repeat,linear-gradient(var(--tsg-corner),var(--tsg-corner)) left bottom/1px 10px no-repeat,linear-gradient(var(--tsg-corner),var(--tsg-corner)) right bottom/10px 1px no-repeat,linear-gradient(var(--tsg-corner),var(--tsg-corner)) right bottom/1px 10px no-repeat;transition:inset 220ms}
#tsg-panel-study .transport-button::after{content:'';position:absolute;inset:5px;background:var(--tsg-fill);z-index:-1;transform:scaleX(0);transform-origin:left;transition:transform 220ms cubic-bezier(.22,.61,.36,1)}
#tsg-panel-study .transport-button:hover::before{inset:4px}
#tsg-panel-study .transport-button:hover::after,#tsg-panel-study .transport-button[aria-pressed=true]::after,#tsg-panel-study .transport-button[aria-expanded=true]::after{transform:scaleX(1)}
#tsg-panel-study .transport-button:hover,#tsg-panel-study .transport-button[aria-pressed=true],#tsg-panel-study .transport-button[aria-expanded=true]{color:#0a0a0a}
#tsg-panel-study .transport-button.primary{background:rgba(204,21,21,.05);--tsg-corner:var(--tsg-red);--tsg-fill:var(--tsg-red)}
#tsg-panel-study .transport-button svg{width:15px;height:15px;flex:none}
#tsg-panel-study .local-drawer{padding:0 18px 17px}
#tsg-panel-study .drawer-heading{display:flex;justify-content:space-between;border-top:1px solid var(--tsg-line);padding:11px 8px;font-size:11px;color:var(--tsg-muted);letter-spacing:1px}
#tsg-panel-study .track-row{width:100%;display:flex;align-items:center;gap:14px;min-height:48px;padding:10px;border:0;border-bottom:1px solid rgba(204,21,21,.15);border-radius:0;color:var(--tsg-paper);background:transparent;cursor:pointer;font:400 12px var(--tsg-mono);letter-spacing:.5px;text-align:left;transition:background 220ms,color 220ms}
#tsg-panel-study .track-row:hover,#tsg-panel-study .track-row.selected{background:var(--tsg-red);color:#0a0a0a}
#tsg-panel-study .track-marker{width:6px;height:6px;margin-right:6px;transform:rotate(45deg);background:transparent;flex:none}
#tsg-panel-study .track-row.selected .track-marker{background:#090909}
#tsg-panel-study .row-number{font-size:11px;white-space:nowrap}
@media(max-width:540px){#tsg-panel-study .main-panel{grid-template-columns:1fr}#tsg-panel-study .matrix-area{border-right:0;border-bottom:1px solid var(--tsg-line);align-items:center}#tsg-panel-study .glyph-art,#tsg-panel-study .matrix-caption{width:100%;max-width:290px}#tsg-panel-study .metadata-area{padding:28px 22px}#tsg-panel-study .transport-buttons{grid-template-columns:1fr 1.3fr 1fr}#tsg-panel-study .drawer-toggle{grid-column:1/-1;min-height:44px}#tsg-panel-study .transport-button{gap:7px;padding:8px;font-size:10px;letter-spacing:1.5px}#tsg-panel-study .player-header{padding:14px 18px}#tsg-panel-study .header-name{gap:10px}#tsg-panel-study .header-id{font-size:9px;letter-spacing:1px}}
@media(pointer:coarse){#tsg-panel-study .seek-bar{height:44px}}
@media(prefers-reduced-motion:reduce){#tsg-panel-study *::before,#tsg-panel-study *::after,#tsg-panel-study .track-row,#tsg-panel-study .transport-button{transition:none}}
</style>
