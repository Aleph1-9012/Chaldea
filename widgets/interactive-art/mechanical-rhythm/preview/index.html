<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" http-equiv="Content-Security-Policy"/>
<title>Tsugumori / Mechanical rhythm</title><style>html{color-scheme:dark}body{margin:0;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}body>*{box-sizing:border-box}button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}.viz-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.btn{background:#151515;color:#ddd;border:1px solid #555;padding:8px 10px;cursor:pointer}.btn[aria-pressed=true]{background:#cc1515;border-color:#cc1515;color:#080808}.text-small{font-size:11px;padding:0 12px}[hidden]{display:none!important}</style></head><body>
<style>
#tsugumori-eight-studies { --eight-bg:#080808; --eight-ink:#e8e4d8; --eight-red:#cc1515; --eight-dim:#9b9790; font-family:'JetBrains Mono','DejaVu Sans Mono',monospace; color:var(--eight-ink); color-scheme:dark; width:100%; font-size:12px; line-height:1.5; }
#tsugumori-eight-studies * { box-sizing:border-box; }
#tsugumori-eight-studies .eight-shell { background:var(--eight-bg); border:1px solid #522020; padding:19px 20px 16px; position:relative; }
#tsugumori-eight-studies .eight-shell::before { content:''; position:absolute; width:7px; height:7px; border-top:1px solid var(--eight-ink); border-left:1px solid var(--eight-ink); left:-1px; top:-1px; pointer-events:none; }
#tsugumori-eight-studies .eight-brand { display:flex; justify-content:space-between; gap:12px; font-size:11px; letter-spacing:2px; color:var(--eight-dim); margin-bottom:15px; }
#tsugumori-eight-studies .eight-brand span:last-child { color:var(--eight-red); }
#tsugumori-eight-studies button, #tsugumori-eight-studies select, #tsugumori-eight-studies input { font:inherit; color:inherit; }
#tsugumori-eight-studies button { border:1px solid #453a35; background:transparent; border-radius:0; padding:9px 11px; min-height:38px; cursor:pointer; position:relative; isolation:isolate; }
#tsugumori-eight-studies button::before { content:''; position:absolute; inset:-1px; background:var(--eight-red); transform:scaleX(0); transform-origin:left; transition:transform 220ms cubic-bezier(.76,0,.24,1); z-index:-1; }
#tsugumori-eight-studies button:hover:not(:disabled)::before, #tsugumori-eight-studies button[aria-pressed="true"]::before { transform:scaleX(1); }
#tsugumori-eight-studies button[aria-pressed="true"] { border-color:var(--eight-red); }
#tsugumori-eight-studies button:disabled { opacity:.4; cursor:default; }
#tsugumori-eight-studies .eight-nav { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
#tsugumori-eight-studies .eight-nav button { text-align:left; font-size:11px; padding:9px 8px; letter-spacing:.2px; }
#tsugumori-eight-studies .eight-nav small { color:inherit; font-size:11px; opacity:.65; margin-right:5px; }
#tsugumori-eight-studies .eight-heading { display:flex; gap:12px; align-items:baseline; justify-content:space-between; margin-top:20px; }
#tsugumori-eight-studies h2 { font-size:16px; line-height:1.5; letter-spacing:2.5px; font-weight:400; margin:0; }
#tsugumori-eight-studies .eight-index { color:var(--eight-red); font-size:11px; white-space:nowrap; }
#tsugumori-eight-studies canvas { display:block; width:100%; height:410px; touch-action:none; cursor:crosshair; }
#tsugumori-eight-studies .eight-controls { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:end; border-top:1px solid #372323; padding-top:14px; }
#tsugumori-eight-studies .eight-controls label { display:flex; flex-direction:column; gap:5px; min-width:115px; flex:1 1 126px; max-width:220px; color:var(--eight-dim); font-size:11px; letter-spacing:.5px; }
#tsugumori-eight-studies .eight-controls label span { display:flex; justify-content:space-between; gap:10px; }
#tsugumori-eight-studies .eight-controls output { color:var(--eight-ink); font-size:11px; }
#tsugumori-eight-studies select { height:38px; border:1px solid #453a35; background:#101010; border-radius:0; padding:7px 24px 7px 8px; max-width:100%; }
#tsugumori-eight-studies input[type="range"] { accent-color:var(--eight-red); width:100%; margin:0; height:23px; cursor:pointer; }
#tsugumori-eight-studies .eight-footer { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:13px; }
#tsugumori-eight-studies .eight-status { font-size:11px; color:#bdb8ad; overflow-wrap:anywhere; }
#tsugumori-eight-studies .eight-pause { font-size:11px; flex:none; min-width:62px; color:var(--eight-dim); border-color:#363636; }
#tsugumori-eight-studies .eight-hint { color:var(--eight-dim); font-size:11px; margin-top:5px; }
@media(max-width:520px) {
  #tsugumori-eight-studies .eight-shell { padding:16px 13px; }
  #tsugumori-eight-studies .eight-brand { letter-spacing:1px; }
  #tsugumori-eight-studies .eight-nav { grid-template-columns:repeat(2,minmax(0,1fr)); }
  #tsugumori-eight-studies h2 { font-size:14px; letter-spacing:1.7px; }
  #tsugumori-eight-studies canvas { height:390px; }
  #tsugumori-eight-studies .eight-controls label { max-width:none; flex-basis:115px; }
}
@media(pointer:coarse) {
  #tsugumori-eight-studies button, #tsugumori-eight-studies select { min-height:44px; }
  #tsugumori-eight-studies select { font-size:16px; }
  #tsugumori-eight-studies input[type="range"] { height:36px; }
}
@media(prefers-reduced-motion:reduce) { #tsugumori-eight-studies button::before { transition:none; } }
</style>
<div aria-label="Mechanical rhythm" id="tsugumori-eight-studies">
<section class="eight-shell">
<div class="eight-brand"><span>TSUGUMORI // PLAY STUDIES</span><span>704</span></div>

<div class="eight-heading"><h2 data-title="">MECHANICAL RHYTHM</h2></div>
<canvas aria-label="Mechanical rhythm. Place pins around the wheel. Sound starts off. Controls are below." data-stage="" role="img">Interactive art. All main actions have native controls below.</canvas>
<div aria-label="Study controls" class="eight-controls" data-controls=""></div>
<div class="eight-footer"><output aria-live="polite" class="eight-status" data-status=""></output><button class="eight-pause" data-pause="" type="button">PAUSE</button></div>
<div class="eight-hint" data-hint="">Place pins around the wheel. Sound starts off.</div>
</section>
</div>
<script src="../preview-runtime.js"></script>
<script src="demo.js"></script>
</body></html>
