<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" http-equiv="Content-Security-Policy"/>
<title>Tsugumori / Fish in space</title><style>html{color-scheme:dark}body{margin:0;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}body>*{box-sizing:border-box}button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}.viz-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.btn{background:#151515;color:#ddd;border:1px solid #555;padding:8px 10px;cursor:pointer}.btn[aria-pressed=true]{background:#cc1515;border-color:#cc1515;color:#080808}.text-small{font-size:11px;padding:0 12px}[hidden]{display:none!important}</style></head><body>
<style>
#tsugumori-organic-lab { --org-red:#cc1515; --org-fg:#e8e8e8; --org-dim:#969696; color:var(--org-fg); font-family:'JetBrains Mono','DejaVu Sans Mono',monospace; color-scheme:dark; width:100%; font-size:12px; line-height:1.5; }
#tsugumori-organic-lab * { box-sizing:border-box; }
#tsugumori-organic-lab [hidden] { display:none !important; }
#tsugumori-organic-lab .org-window { background:#080808; padding:18px 20px 17px; border:1px solid transparent; position:relative; }
#tsugumori-organic-lab .org-window::after { content:''; width:7px; height:7px; position:absolute; top:-1px; right:-1px; border-top:1px solid #e8e8e8; border-right:1px solid #e8e8e8; pointer-events:none; }
#tsugumori-organic-lab button { font:inherit; color:var(--org-fg); cursor:pointer; border:1px solid #493030; border-radius:0; padding:9px 12px; background:transparent; letter-spacing:.5px; position:relative; isolation:isolate; min-height:38px; }
#tsugumori-organic-lab button::before { content:''; background:var(--org-red); position:absolute; inset:-1px; z-index:-1; transform:scaleX(0); transform-origin:left; transition:transform 220ms cubic-bezier(.76,0,.24,1); }
#tsugumori-organic-lab button:hover::before, #tsugumori-organic-lab button[aria-pressed="true"]::before { transform:scaleX(1); }
#tsugumori-organic-lab button[aria-pressed="true"] { border-color:var(--org-red); }
#tsugumori-organic-lab .org-tabs { display:flex; gap:7px; flex-wrap:wrap; }
#tsugumori-organic-lab .org-tabs button { font-size:11px; letter-spacing:1px; }
#tsugumori-organic-lab .org-stage { position:relative; margin-top:21px; }
#tsugumori-organic-lab canvas { width:100%; height:414px; display:block; touch-action:pan-y; }
#tsugumori-organic-lab canvas:focus-visible { outline:1px solid var(--org-dim); outline-offset:-2px; }
#tsugumori-organic-lab .org-name { pointer-events:none; position:absolute; top:1px; left:0; display:flex; align-items:center; gap:9px; }
#tsugumori-organic-lab .org-name h2 { font-size:12px; letter-spacing:2.5px; line-height:1.5; font-weight:400; margin:0; }
#tsugumori-organic-lab .org-name span { color:var(--org-red); font-size:11px; }
#tsugumori-organic-lab .org-footer { border-top:1px solid #2b2020; padding-top:14px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
#tsugumori-organic-lab .org-actions { display:flex; flex-wrap:wrap; gap:7px; }
#tsugumori-organic-lab .org-pause { margin-left:auto; color:var(--org-dim); border-color:#353535; }
#tsugumori-organic-lab .org-caption { margin-top:12px; display:flex; gap:16px; justify-content:space-between; align-items:baseline; }
#tsugumori-organic-lab output { font-size:11px; color:#b6b6b6; }
#tsugumori-organic-lab .org-id { flex:none; font-size:11px; letter-spacing:1px; color:var(--org-red); }
#tsugumori-organic-lab .org-hint { font-size:11px; color:var(--org-dim); margin-top:5px; }
@media(max-width:480px) {
  #tsugumori-organic-lab .org-window { padding:16px 13px; }
  #tsugumori-organic-lab .org-tabs button { flex:1; padding:10px 7px; letter-spacing:.3px; }
  #tsugumori-organic-lab canvas { height:390px; }
  #tsugumori-organic-lab button { font-size:11px; padding:9px; }
  #tsugumori-organic-lab .org-caption { gap:9px; }
}
@media(pointer:coarse) { #tsugumori-organic-lab button { min-height:44px; } }
@media(prefers-reduced-motion:reduce) { #tsugumori-organic-lab button::before { transition:none; } }
</style>
<div aria-label="Fish in space" id="tsugumori-organic-lab">
<section class="org-window">

<div class="org-stage">
<div class="org-name"><span data-number="">01</span><h2 data-title="">DRIFT</h2></div>
<canvas aria-label="Two skeletal fish swimming independently. Click or tap a destination, or press Enter or Space to call them to the center." data-scene="" role="img" tabindex="0">Animated artwork. Controls below provide alternatives to pointer interaction.</canvas>
</div>
<div class="org-footer">
<div class="org-actions" data-controls="fish"><button aria-pressed="false" data-gather="" type="button">GATHER</button></div>

<button class="org-pause" data-pause="" type="button">PAUSE</button>
</div>
<div class="org-caption"><output aria-live="polite" data-status="">Two fish, swimming independently.</output><span class="org-id" data-id="">NO. 704</span></div>
<div class="org-hint" data-hint="">Click or tap anywhere to draw them toward that point.</div>
</section>
</div>
<script src="../preview-runtime.js"></script>
<script src="ArtEngine.js"></script>
<script src="demo.js"></script>
</body></html>
