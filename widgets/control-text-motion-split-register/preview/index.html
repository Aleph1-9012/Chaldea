<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>Tsugumori / Text motion / Split register</title><style>html{color-scheme:dark}body{margin:0;padding:16px;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}*,*::before,*::after{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}[hidden],[data-archive-omitted]{display:none!important}.viz-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.btn,.nav-link{background:#151515;color:#ddd;border:1px solid #555;padding:8px 10px;cursor:pointer}.btn[aria-pressed=true],.nav-link.active{background:#cc1515;border-color:#cc1515;color:#080808}.text-small{font-size:11px}.text-muted{color:#999}.form-control,.form-select{background:#151515;color:#eee;border:1px solid #666;padding:7px}.form-range{accent-color:#cc1515}.nav{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}figure{margin:0}svg{flex-shrink:0}.archive-settings{border-top:1px solid #383434;margin:18px 0 0;padding:12px 0;font-size:11px}.archive-settings summary{cursor:pointer;color:#aaa;letter-spacing:1px}.archive-settings label{display:flex;align-items:center;gap:12px;padding-top:10px;flex-wrap:wrap}.archive-settings label span{min-width:145px}.archive-settings input[type=range]{width:150px;max-width:100%;accent-color:#cc1515}.archive-settings select{max-width:100%;background:#151515;color:#ddd;border:1px solid #555;padding:5px}.archive-settings output{color:#aaa}.archive-settings input[type=checkbox]{accent-color:#cc1515}
</style></head><body><div aria-label="Four control-center text animation options" id="ts-text-iterations">
<style>

    #ts-text-iterations { --tx-white:#e8e8e8; --tx-muted:#a2a2a2; --tx-red:#cc1515; --tx-bg:#111; --tx-line:#858585; --tx-font:'JetBrains Mono',monospace; --tx-speed:1; width:100%; color:var(--tx-white); font:400 12px/1.5 var(--tx-font); container-type:inline-size; }
    #ts-text-iterations * { box-sizing:border-box; }
    #ts-text-iterations [hidden] { display:none !important; }
    #ts-text-iterations button { font:inherit; border-radius:0; cursor:pointer; }
    #ts-text-iterations .tx-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; color:light-dark(#4d4844,#b0aaa6); }
    #ts-text-iterations .tx-toolbar-label { font-size:11px; letter-spacing:1.2px; }
    #ts-text-iterations .tx-replay { min-height:34px; padding:6px 10px; background:transparent; border:1px solid light-dark(#9d9792,#555); color:light-dark(#292623,#e8e8e8); font-size:11px; }
    #ts-text-iterations .tx-replay:hover { border-color:var(--tx-red); color:light-dark(#a81010,#ef7664); }
    #ts-text-iterations .tx-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
    #ts-text-iterations .tx-study { margin:0; min-width:0; }
    #ts-text-iterations .tx-caption { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; color:light-dark(#302c28,#e8e8e8); }
    #ts-text-iterations .tx-name { display:block; font-size:13px; font-weight:500; letter-spacing:.6px; }
    #ts-text-iterations .tx-desc { display:block; margin-top:3px; color:light-dark(#655e59,#a2a2a2); font-size:11px; }
    #ts-text-iterations .tx-stage { padding:22px; background:#0a0a0a; color-scheme:dark; }
    #ts-text-iterations .tx-panel { max-width:376px; margin:0 auto; position:relative; background:var(--tx-bg); border:1px solid var(--tx-line); padding:8px 16px 20px; }
    #ts-text-iterations .tx-panel::before { content:''; position:absolute; width:3px; height:32px; left:-1px; top:8px; background:var(--tx-red); }
    #ts-text-iterations .tx-corner { position:absolute; width:8px; height:8px; border:0 solid var(--tx-white); pointer-events:none; }
    #ts-text-iterations .tx-corner.tl { left:5px; top:-3px; border-left-width:2px; border-top-width:2px; }
    #ts-text-iterations .tx-corner.tr { right:-1px; top:-3px; border-right-width:2px; border-top-width:2px; }
    #ts-text-iterations .tx-corner.bl { left:5px; bottom:-3px; border-left-width:2px; border-bottom-width:2px; }
    #ts-text-iterations .tx-corner.br { right:-1px; bottom:-3px; border-right-width:2px; border-bottom-width:2px; }
    #ts-text-iterations .tx-head { margin:0 -8px 24px; height:32px; background:var(--tx-red); display:flex; align-items:stretch; color:#080808; }
    #ts-text-iterations .tx-index { width:32px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-right:1px solid #08080855; font-size:11px; }
    #ts-text-iterations .tx-heading-button { flex:1; display:flex; align-items:center; min-width:0; padding:0 12px; border:0; background:transparent; color:inherit; font-weight:500; font-size:13px; letter-spacing:.25px; text-align:left; }
    #ts-text-iterations .tx-heading-button .tx-label { --tx-scan:#e8e8e8; }
    #ts-text-iterations .tx-section { margin:0; font-size:12px; font-weight:500; letter-spacing:1.5px; }
    #ts-text-iterations .tx-section::after { content:''; display:block; width:34px; height:1px; background:var(--tx-line); margin-top:8px; }
    #ts-text-iterations .tx-status { display:flex; align-items:flex-start; gap:9px; margin:14px 0 16px; font-size:12px; min-height:18px; }
    #ts-text-iterations .tx-dot { width:7px; height:7px; margin-top:5px; flex-shrink:0; background:var(--tx-red); border-radius:50%; }
    #ts-text-iterations .tx-dot.tx-off { background:#777; }
    #ts-text-iterations .tx-status-text { min-width:0; overflow-wrap:anywhere; }
    #ts-text-iterations .tx-action { position:relative; display:flex; align-items:center; gap:10px; width:100%; min-height:36px; margin-bottom:8px; padding:8px 12px; border:1px solid var(--tx-white); background:var(--tx-white); color:#080808; font-size:12px; font-weight:500; letter-spacing:.7px; text-align:left; transition:color 220ms linear; }
    #ts-text-iterations .tx-action::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--tx-red); transform:scaleX(0); transform-origin:left; transition:transform 220ms cubic-bezier(.215,.61,.355,1); }
    #ts-text-iterations .tx-action:is(:hover,:focus-visible,.tx-demo) { color:#a81010; }
    #ts-text-iterations .tx-action:is(:hover,:focus-visible,.tx-demo)::after { transform:scaleX(1); }
    #ts-text-iterations .tx-diamond { width:6px; height:6px; background:currentColor; flex-shrink:0; transform:rotate(45deg); }
    #ts-text-iterations .tx-list { display:grid; gap:8px; }
    #ts-text-iterations .tx-row { position:relative; isolation:isolate; display:flex; align-items:center; justify-content:center; gap:12px; width:100%; min-height:38px; padding:8px 12px; border:1px solid var(--tx-line); background:var(--tx-bg); color:var(--tx-white); font-size:12px; font-weight:500; letter-spacing:.45px; }
    #ts-text-iterations .tx-row::after { content:''; position:absolute; inset:0; z-index:-1; background:var(--tx-red); transform:scaleX(0); transform-origin:left; transition:transform 220ms cubic-bezier(.76,0,.24,1); }
    #ts-text-iterations .tx-row:is(:hover,:focus-visible,.tx-demo,[aria-pressed="true"])::after { transform:scaleX(1); }
    #ts-text-iterations .tx-row[aria-pressed="true"] { border-color:var(--tx-red); }
    #ts-text-iterations .tx-row[aria-pressed="true"]::after { transition-duration:0ms; }
    #ts-text-iterations .tx-row[aria-pressed="true"]::before { content:''; position:absolute; left:8px; top:calc(50% - 2px); width:4px; height:4px; background:#080808; transform:rotate(45deg); }
    #ts-text-iterations .tx-indicators { display:flex; align-items:center; gap:10px; flex-shrink:0; }
    #ts-text-iterations .tx-indicators svg { width:12px; height:12px; }
    #ts-text-iterations .tx-strength { display:flex; align-items:center; gap:5px; padding:0 2px; }
    #ts-text-iterations .tx-strength i { display:block; width:7px; height:4px; transform:skewX(-24deg); background:currentColor; }
    #ts-text-iterations .tx-strength .tx-dim { background:transparent; box-shadow:inset 0 0 0 1px currentColor; opacity:.7; }
    #ts-text-iterations .tx-empty { margin:0; min-height:130px; display:flex; justify-content:center; align-items:center; color:var(--tx-muted); }
    #ts-text-iterations .tx-label { --tx-scan:#ef7664; display:inline-flex; position:relative; flex-shrink:1; min-width:0; max-width:100%; white-space:pre; vertical-align:middle; }
    #ts-text-iterations .tx-action .tx-label { --tx-scan:#a81010; }
    #ts-text-iterations .tx-row .tx-label { --tx-scan:#fff; }
    #ts-text-iterations .tx-char { position:relative; display:inline-block; flex:0 0 auto; width:calc(1ch + .45px); height:1.5em; }
    #ts-text-iterations .tx-char > .tx-face { display:block; }
    #ts-text-iterations .tx-roll-window { position:absolute; inset:0; overflow:hidden; visibility:hidden; }
    #ts-text-iterations .tx-roll-strip { display:block; height:4.5em; }
    #ts-text-iterations .tx-roll-strip > span { display:block; height:1.5em; }
    #ts-text-iterations .tx-running[data-effect="roll"] .tx-char > .tx-face { visibility:hidden; }
    #ts-text-iterations .tx-running[data-effect="roll"] .tx-roll-window { visibility:visible; }
    #ts-text-iterations .tx-split { position:absolute; inset:0; display:flex; visibility:hidden; pointer-events:none; white-space:pre; }
    #ts-text-iterations .tx-split.tx-top { clip-path:inset(0 0 50% 0); }
    #ts-text-iterations .tx-split.tx-bottom { clip-path:inset(50% 0 0 0); }
    #ts-text-iterations .tx-running[data-effect="split"] > .tx-char > .tx-face { visibility:hidden; }
    #ts-text-iterations .tx-running[data-effect="split"] > .tx-split { visibility:visible; }
    #ts-text-iterations .tx-foot { margin-top:12px; font-size:11px; color:light-dark(#655e59,#a2a2a2); }
    @container(max-width:780px) {
      #ts-text-iterations .tx-grid { gap:18px; }
      #ts-text-iterations .tx-stage { padding:16px 10px; }
      #ts-text-iterations .tx-panel { padding-left:12px; padding-right:12px; }
      #ts-text-iterations .tx-row { gap:9px; letter-spacing:0; }
      #ts-text-iterations .tx-indicators { gap:7px; }
    }
    @container(max-width:660px) { #ts-text-iterations .tx-grid { grid-template-columns:minmax(0,1fr); gap:26px; } }
    @media(pointer:coarse) { #ts-text-iterations :is(.tx-replay,.tx-action,.tx-row,.tx-heading-button) { min-height:44px; } #ts-text-iterations .tx-head { height:44px; } #ts-text-iterations .tx-panel::before { height:44px; } }
    @media(prefers-reduced-motion:reduce) { #ts-text-iterations *,#ts-text-iterations *::before,#ts-text-iterations *::after { animation:none !important; transition:none !important; } }
  </style>
