</style></head><body><div aria-label="Tsugumori Menu design studies" data-design="a" id="ts-menu-details">
<style>

    #ts-menu-details { --md-red:#cc1515; --md-bg:#0a0a0a; --md-white:#e8e8e8; --md-muted:#999692; --md-line:#cc151535; --md-grid:rgba(204,21,21,.09); --md-row:48px; --md-mono:'JetBrains Mono','JetBrainsMono Nerd Font',monospace; --md-sans:'Inter',sans-serif; width:100%; color:var(--md-white); font:400 12px/1.4 var(--md-mono); container-type:inline-size; }
    #ts-menu-details * { box-sizing:border-box; }
    #ts-menu-details button,#ts-menu-details input { font:inherit; border-radius:0; }
    #ts-menu-details button { cursor:pointer; }
    #ts-menu-details [hidden] { display:none !important; }
    #ts-menu-details .md-options { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
    #ts-menu-details .md-option,#ts-menu-details .md-replay { padding:8px 12px; min-height:36px; color:light-dark(#252525,#d3d0ca); border:1px solid light-dark(#b2aaa5,#47403c); background:transparent; font-size:12px; }

    #ts-menu-details .md-replay { margin-left:auto; }
    #ts-menu-details .md-stage { position:relative; overflow:hidden; background:#151515; }
    #ts-menu-details .md-assembly { position:relative; }
    #ts-menu-details .md-menu { color-scheme:dark; background-color:var(--md-bg); background-image:linear-gradient(var(--md-grid) 1px,transparent 1px),linear-gradient(90deg,var(--md-grid) 1px,transparent 1px); background-size:20px 20px; border:1px solid var(--md-red); }
    #ts-menu-details .md-header { min-height:68px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px 24px; border-bottom:1px solid var(--md-line); }
    #ts-menu-details .md-heading { display:flex; align-items:center; gap:13px; min-width:0; }

    #ts-menu-details .md-title-rule { width:23px; height:1px; background:#77736f; flex-shrink:0; }
    #ts-menu-details .md-jp { font-family:var(--md-sans); font-size:12px; letter-spacing:2px; color:var(--md-muted); white-space:nowrap; }
    #ts-menu-details .md-header-right { display:flex; flex-direction:column; align-items:flex-end; gap:3px; white-space:nowrap; }

    #ts-menu-details .md-clock { font-size:11px; color:var(--md-muted); letter-spacing:1px; }

    #ts-menu-details .md-category::before { content:''; height:1px; width:5px; background:currentColor; transition:width 220ms; }
    #ts-menu-details .md-category:hover { background:#cc15151a; color:var(--md-white); }
    #ts-menu-details .md-category[aria-pressed="true"] { background:var(--md-red); color:var(--md-bg); }
    #ts-menu-details .md-category[aria-pressed="true"]::before { width:10px; }

    #ts-menu-details .md-node-rule { height:2px; width:54px; background:var(--md-red); }
    #ts-menu-details .md-main { min-width:0; }
    #ts-menu-details .md-search { min-height:56px; display:flex; align-items:center; gap:12px; margin:0 20px; border-bottom:1px solid var(--md-line); position:relative; }
    #ts-menu-details .md-search-mark { color:var(--md-red); font-size:13px; }

    #ts-menu-details .md-search:focus-within { border-bottom-color:var(--md-red); }

    #ts-menu-details .md-app::before { content:''; position:absolute; z-index:-1; inset:0; background:var(--md-red); transform:scaleX(0); transform-origin:left; opacity:0; transition:transform 300ms cubic-bezier(.2,.7,.2,1),opacity 300ms; }

    #ts-menu-details .md-footer { border-top:1px solid var(--md-line); padding:10px 18px 0; }
    #ts-menu-details .md-actions { display:flex; flex-wrap:wrap; gap:4px; }
    #ts-menu-details .md-footer-button { display:flex; align-items:center; justify-content:center; gap:8px; min-height:36px; padding:0 10px; background:transparent; color:var(--md-muted); border:1px solid transparent; font:400 11px var(--md-sans); letter-spacing:1px; transition:background 200ms,color 200ms; }
    #ts-menu-details .md-footer-button:hover { background:var(--md-red); color:var(--md-bg); }
    #ts-menu-details .md-footer-button svg { width:13px; height:13px; }

    #ts-menu-details .md-hints { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:32px; padding:4px 0; font-size:11px; color:#918d88; }

    #ts-menu-details .md-hints-keys span { margin-left:12px; }

    #ts-menu-details .md-curtain { position:absolute; inset:0 0 0 auto; width:0; background:var(--md-red); color:#130707; overflow:hidden; pointer-events:none; z-index:3; }
    #ts-menu-details .md-curtain-title { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font:500 24px var(--md-mono); letter-spacing:5px; white-space:nowrap; }
    #ts-menu-details .md-curtain-stencil { position:absolute; top:18px; right:16px; display:flex; flex-direction:column; gap:3px; font-size:11px; letter-spacing:2px; white-space:nowrap; }
    #ts-menu-details .md-corner { width:12px; height:12px; border:0 solid #130707; position:absolute; opacity:.8; }

    #ts-menu-details .md-corner.bl { left:8px; bottom:8px; border-left-width:2px; border-bottom-width:2px; }

    #ts-menu-details .md-serial { position:absolute; left:23px; bottom:20px; font-size:11px; letter-spacing:1px; white-space:nowrap; opacity:.8; }
    #ts-menu-details .md-serial::before { content:''; display:block; width:72px; height:12px; margin-bottom:7px; background:repeating-linear-gradient(90deg,#130707 0 1px,transparent 1px 4px,#130707 4px 7px,transparent 7px 9px,#130707 9px 10px,transparent 10px 15px,#130707 15px 17px,transparent 17px 19px); }
    #ts-menu-details .md-curtain::after { content:''; position:absolute; right:16px; bottom:17px; width:46px; height:3px; background:#160707; }

    /* A: separated red bands, matching the rice's existing flat selection. */
    #ts-menu-details[data-design="a"] .md-title { padding:7px 10px; border:1px solid var(--md-red); color:var(--md-red); }
    #ts-menu-details[data-design="a"] .md-title-rule { display:none; }

    #ts-menu-details[data-design="b"] .md-title { font:500 18px var(--md-mono); letter-spacing:3px; }

    #ts-menu-details[data-design="b"] .md-wordmark { padding:2px 6px; border:1px solid var(--md-line); letter-spacing:2px; }
    #ts-menu-details[data-design="b"] .md-search { margin-left:0; padding-left:60px; }
    #ts-menu-details[data-design="b"] .md-apps { padding-top:7px; background:linear-gradient(90deg,transparent 49px,#cc15153d 49px,#cc15153d 50px,transparent 50px); }
    #ts-menu-details[data-design="b"] .md-app { grid-template-columns:26px 30px minmax(0,1fr) 14px; gap:16px; padding-left:17px; }
    #ts-menu-details[data-design="b"] .md-app::before { inset:0 0 0 50px; }
    #ts-menu-details[data-design="b"] .md-app::after { content:''; position:absolute; left:60px; right:20px; bottom:0; height:1px; background:var(--md-line); z-index:-2; }
    #ts-menu-details[data-design="b"] .md-selected .md-number { color:var(--md-red); }
    #ts-menu-details[data-design="b"] .md-selected .md-number::before { content:''; display:block; position:absolute; left:5px; top:calc(50% - 2px); width:4px; height:4px; background:var(--md-red); }
    #ts-menu-details[data-design="b"] .md-glyph { border:0; }
    #ts-menu-details[data-design="b"] .md-footer { padding:0; }
    #ts-menu-details[data-design="b"] .md-actions { gap:0; }
    #ts-menu-details[data-design="b"] .md-footer-button { flex:1; min-height:44px; border-right-color:var(--md-line); }
    #ts-menu-details[data-design="b"] .md-footer-button:last-child { border-right:0; }
    #ts-menu-details[data-design="b"] .md-hints { border-top:1px solid var(--md-line); padding:7px 18px; }

    /* C: open corners echo the player controls and the approved curtain. */
    #ts-menu-details[data-design="c"] .md-title { padding:6px 12px; }
    #ts-menu-details[data-design="c"] .md-title::before,#ts-menu-details[data-design="c"] .md-title::after { content:''; position:absolute; width:6px; height:6px; border:0 solid var(--md-red); }
    #ts-menu-details[data-design="c"] .md-title::before { top:0; left:0; border-top-width:1px; border-left-width:1px; }
    #ts-menu-details[data-design="c"] .md-title::after { bottom:0; right:0; border-bottom-width:1px; border-right-width:1px; }
    #ts-menu-details[data-design="c"] .md-title-rule { display:none; }
    #ts-menu-details[data-design="c"] .md-category[aria-pressed="true"] { background:#cc151519; color:var(--md-white); box-shadow:inset 2px 0 var(--md-red); }
    #ts-menu-details[data-design="c"] .md-category[aria-pressed="true"]::before { width:5px; height:5px; transform:rotate(45deg); background:var(--md-red); }
    #ts-menu-details[data-design="c"] .md-glyph { border-color:transparent; position:relative; }
    #ts-menu-details[data-design="c"] .md-glyph::before,#ts-menu-details[data-design="c"] .md-glyph::after { content:''; position:absolute; width:6px; height:6px; border:0 solid currentColor; }
    #ts-menu-details[data-design="c"] .md-glyph::before { top:0; left:0; border-top-width:1px; border-left-width:1px; }
    #ts-menu-details[data-design="c"] .md-glyph::after { bottom:0; right:0; border-bottom-width:1px; border-right-width:1px; }
    #ts-menu-details[data-design="c"] .md-search { min-height:44px; margin:12px 20px 0; border:1px solid var(--md-line); padding:0 12px; }
    #ts-menu-details[data-design="c"] .md-search:focus-within { border-color:var(--md-red); }
    #ts-menu-details[data-design="c"] .md-search-index { display:none; }
    #ts-menu-details[data-design="c"] .md-app::before { inset:3px 10px; }
    #ts-menu-details[data-design="c"] .md-app-name { letter-spacing:.8px; }
    #ts-menu-details[data-design="c"] .md-footer-button { position:relative; margin-top:2px; }
    #ts-menu-details[data-design="c"] .md-footer-button::before,#ts-menu-details[data-design="c"] .md-footer-button::after { content:''; position:absolute; width:5px; height:5px; border:0 solid #7b4946; }
    #ts-menu-details[data-design="c"] .md-footer-button::before { top:0; left:0; border-top-width:1px; border-left-width:1px; }
    #ts-menu-details[data-design="c"] .md-footer-button::after { bottom:0; right:0; border-bottom-width:1px; border-right-width:1px; }
    #ts-menu-details[data-design="c"] .md-hints { padding-top:9px; }
    @container(max-width:560px) {
      #ts-menu-details .md-header { padding:15px; gap:10px; }
      #ts-menu-details .md-heading { gap:9px; }

    @container(max-width:390px) {
      #ts-menu-details .md-options { gap:4px; }
      #ts-menu-details .md-option { padding:8px; }
      #ts-menu-details .md-replay { margin-left:0; }
      #ts-menu-details .md-header-right { display:none; }
      #ts-menu-details .md-app-name { font-size:13px; }
      #ts-menu-details .md-hints { align-items:flex-start; flex-direction:column; }
    }
    @media(pointer:coarse) { #ts-menu-details button { min-height:44px; } }
    @media(prefers-reduced-motion:reduce) { #ts-menu-details *,#ts-menu-details *::before,#ts-menu-details *::after { transition:none !important; } }
  </style>
