</style></head><body><div aria-label="Refinements of the Tsugumori system mono control center design" id="ts-cc-mono-refinements">
<style>

    #ts-cc-mono-refinements { --tt-white:#e8e8e8; --tt-red:#cc1515; --tt-soft:#929292; --tt-panel:#111; --tt-mono:'JetBrains Mono',monospace; --tt-title-offset:0px; --tt-tracking-offset:0px; --tt-inner:.25; --tt-grid-alpha:.06; color:var(--tt-white); font:400 13px/1.4 var(--tt-mono); width:100%; container-type:inline-size; }
    #ts-cc-mono-refinements * { box-sizing:border-box; }
    #ts-cc-mono-refinements button { cursor:pointer; font:inherit; border-radius:0; }
    #ts-cc-mono-refinements .tt-choices { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
    #ts-cc-mono-refinements .tt-choice { min-width:0; position:relative; text-align:left; color:var(--tt-white); border:1px solid #444; padding:16px 14px 22px; background:#0a0a0a; }
    #ts-cc-mono-refinements .tt-choice:hover { border-color:#888; }
    #ts-cc-mono-refinements .tt-choice[aria-pressed="true"] { border-color:var(--tt-red); }
    #ts-cc-mono-refinements .tt-choice[aria-pressed="true"]::after { content:''; position:absolute; right:15px; top:20px; width:6px; height:6px; background:var(--tt-red); transform:rotate(45deg); }
    #ts-cc-mono-refinements .tt-choice-name { display:block; font:400 12px var(--tt-mono); letter-spacing:.5px; padding-right:12px; }
    #ts-cc-mono-refinements .tt-choice-name b { font-weight:500; color:var(--tt-red); }
    #ts-cc-mono-refinements .tt-choice-font { display:block; font:400 11px var(--tt-mono); color:var(--tt-soft); margin-top:7px; line-height:1.5; }
    #ts-cc-mono-refinements .tt-swatch { display:block; margin-top:23px; --tt-title-offset:0px; --tt-tracking-offset:0px; --tt-inner:.25; --tt-grid-alpha:.06; }
    #ts-cc-mono-refinements .tt-treatment { --tt-title-size:13px; --tt-title-spacing:.6px; --tt-outer:#b8b8b8; --tt-corner:#e8e8e8; }
    #ts-cc-mono-refinements .tt-treatment[data-style="indexed"] { --tt-title-spacing:.25px; }
    #ts-cc-mono-refinements .tt-treatment[data-style="tabbed"] { --tt-outer:#909090; }
    #ts-cc-mono-refinements .tt-face { display:block; position:relative; width:100%; min-width:0; height:96px; padding:0; text-align:left; background:var(--tt-panel); border:1px solid var(--tt-outer); color:var(--tt-white); transition:transform 220ms cubic-bezier(.2,.7,.2,1),border-color 220ms; }
    #ts-cc-mono-refinements .tt-face::before { content:''; position:absolute; inset:3px; border:1px solid var(--tt-white); opacity:var(--tt-inner); pointer-events:none; }
    #ts-cc-mono-refinements .tt-title { position:absolute; top:4px; left:4px; right:4px; height:26px; padding:0 12px; background:#1c1c1c; border-bottom:1px solid #e8e8e833; color:var(--tt-white); font:500 calc(var(--tt-title-size) + var(--tt-title-offset))/26px var(--tt-mono); letter-spacing:calc(var(--tt-title-spacing) + var(--tt-tracking-offset)); text-transform:uppercase; white-space:nowrap; transition:background 220ms,color 220ms; }
    #ts-cc-mono-refinements .tt-value { position:absolute; top:39px; left:32px; right:14px; color:#bcbcbc; font:400 13px/20px var(--tt-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #ts-cc-mono-refinements .tt-strip { position:absolute; bottom:4px; left:4px; right:4px; height:25px; padding:0 12px; border-top:1px solid #e8e8e833; background:#111; display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--tt-soft); font:400 11px/16px var(--tt-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
    #ts-cc-mono-refinements .tt-pair { display:flex; align-items:center; gap:6px; }
    #ts-cc-mono-refinements .tt-state { color:#dcdcdc; }
    #ts-cc-mono-refinements .tt-live { display:flex; align-items:center; gap:6px; }
    #ts-cc-mono-refinements .tt-live::before { content:''; width:4px; height:4px; background:var(--tt-red); }
    #ts-cc-mono-refinements .tt-side { position:absolute; left:-1px; top:0; bottom:0; width:4px; background:var(--tt-white); transition:background 220ms; }
    #ts-cc-mono-refinements .tt-square { position:absolute; top:46px; left:17px; width:5px; height:5px; background:var(--tt-white); opacity:.85; transition:opacity 220ms,transform 220ms; }
    #ts-cc-mono-refinements .tt-focused { border-color:var(--tt-white); }
    #ts-cc-mono-refinements .tt-focused .tt-side { background:var(--tt-red); }
    #ts-cc-mono-refinements .tt-focused .tt-value { color:var(--tt-white); }
    #ts-cc-mono-refinements .tt-focused .tt-title { color:#080808; background:var(--tt-red); border-bottom-color:var(--tt-red); }
    #ts-cc-mono-refinements .tt-focused .tt-square { opacity:0; transform:scale(0); }
    #ts-cc-mono-refinements .tt-corner { position:absolute; width:8px; height:8px; border:0 solid var(--tt-corner); pointer-events:none; }
    #ts-cc-mono-refinements .tt-corner.tl { left:5px; top:-3px; border-top-width:2px; border-left-width:2px; }
    #ts-cc-mono-refinements .tt-corner.tr { right:-1px; top:-3px; border-top-width:2px; border-right-width:2px; }
    #ts-cc-mono-refinements .tt-corner.bl { left:5px; bottom:-3px; border-bottom-width:2px; border-left-width:2px; }
    #ts-cc-mono-refinements .tt-corner.br { right:-1px; bottom:-3px; border-bottom-width:2px; border-right-width:2px; }
    #ts-cc-mono-refinements .tt-face:not(.tt-center) { background-image:linear-gradient(rgb(204 21 21 / var(--tt-grid-alpha)) 1px,transparent 1px),linear-gradient(90deg,rgb(204 21 21 / var(--tt-grid-alpha)) 1px,transparent 1px); background-size:12px 12px; }
    #ts-cc-mono-refinements .tt-id { display:none; }

    #ts-cc-mono-refinements .tt-treatment[data-style="indexed"] .tt-focused .tt-id { border-color:#08080855; }
    #ts-cc-mono-refinements .tt-treatment[data-style="indexed"] .tt-value { left:48px; }
    #ts-cc-mono-refinements .tt-treatment[data-style="indexed"] .tt-square { left:18px; }
    #ts-cc-mono-refinements .tt-treatment[data-style="tabbed"] .tt-title { right:auto; max-width:calc(100% - 8px); padding:0 12px; border-bottom:0; }
    #ts-cc-mono-refinements .tt-treatment[data-style="tabbed"] .tt-face:not(.tt-center)::after { content:''; position:absolute; left:4px; right:4px; top:30px; height:1px; background:#e8e8e840; }
    #ts-cc-mono-refinements .tt-treatment[data-style="tabbed"] .tt-value { left:16px; }
    #ts-cc-mono-refinements .tt-treatment[data-style="tabbed"] .tt-square { display:none; }
    #ts-cc-mono-refinements .tt-treatment[data-style="tabbed"] .tt-strip { padding:0; display:grid; grid-template-columns:1fr 1fr; gap:0; }
    #ts-cc-mono-refinements .tt-treatment[data-style="tabbed"] .tt-strip > span { height:100%; padding:0 10px; display:flex; align-items:center; }
    #ts-cc-mono-refinements .tt-treatment[data-style="tabbed"] .tt-strip > span + span { border-left:1px solid #e8e8e833; }
    #ts-cc-mono-refinements .tt-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:12px 15px; background:#111; color:var(--tt-soft); font:400 11px var(--tt-mono); border-bottom:1px solid #333; }
    #ts-cc-mono-refinements .tt-bar .tt-selected-name { color:var(--tt-white); }
    #ts-cc-mono-refinements .tt-bar .tt-fixed-arrow { margin-left:auto; }
    #ts-cc-mono-refinements .tt-stage { background:#0a0a0a; padding:48px 24px; color-scheme:dark; }
    #ts-cc-mono-refinements .tt-cross { display:grid; grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr) 70px minmax(0,1fr); grid-template-rows:96px 54px 96px 54px 96px; align-items:center; }
    #ts-cc-mono-refinements .tt-node[data-node="connection"] { grid-column:3; grid-row:1; }
    #ts-cc-mono-refinements .tt-node[data-node="share"] { grid-column:1; grid-row:3; }
    #ts-cc-mono-refinements .tt-node[data-node="notifications"] { grid-column:5; grid-row:3; }
    #ts-cc-mono-refinements .tt-node[data-node="audio"] { grid-column:3; grid-row:5; }
    #ts-cc-mono-refinements .tt-node.tt-focused { transform:translateX(8px); }
    #ts-cc-mono-refinements .tt-center { grid-column:3; grid-row:3; height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
    #ts-cc-mono-refinements .tt-center strong { font:500 17px/1 var(--tt-mono); letter-spacing:3px; margin-left:3px; }
    #ts-cc-mono-refinements .tt-center small { font:400 11px/1.2 var(--tt-mono); color:var(--tt-soft); letter-spacing:.35px; }
    #ts-cc-mono-refinements .tt-focus { position:absolute; left:-32px; top:calc(50% - 7px); width:18px; height:14px; opacity:0; transition:opacity 220ms; }
    #ts-cc-mono-refinements .tt-focus::before { content:''; position:absolute; top:3px; left:0; width:7px; height:7px; background:var(--tt-white); transform:rotate(45deg); }
    #ts-cc-mono-refinements .tt-focus::after { content:''; position:absolute; top:3px; left:10px; width:7px; height:7px; border-top:1px solid var(--tt-white); border-right:1px solid var(--tt-white); transform:rotate(45deg); }
    #ts-cc-mono-refinements .tt-focused .tt-focus { opacity:1; }
    #ts-cc-mono-refinements .tt-arrow { position:relative; width:36px; height:36px; justify-self:center; pointer-events:none; transform:rotate(var(--tt-angle)); transition:transform 320ms cubic-bezier(.2,.7,.2,1); }
    #ts-cc-mono-refinements .tt-arrow[data-axis="connection"] { grid-column:3; grid-row:2; }
    #ts-cc-mono-refinements .tt-arrow[data-axis="audio"] { grid-column:3; grid-row:4; }
    #ts-cc-mono-refinements .tt-arrow[data-axis="share"] { grid-column:2; grid-row:3; }
    #ts-cc-mono-refinements .tt-arrow[data-axis="notifications"] { grid-column:4; grid-row:3; }
    #ts-cc-mono-refinements .tt-glyph { position:relative; display:block; width:36px; height:36px; font-size:36px; color:var(--tt-white); opacity:.65; transition:opacity 220ms; }
    #ts-cc-mono-refinements .tt-arrow.tt-active .tt-glyph { opacity:1; }
    #ts-cc-mono-refinements .tt-glyph > i,#ts-cc-mono-refinements .tt-glyph > span { position:absolute; display:block; }

    #ts-cc-mono-refinements .tt-gate.g1 { top:.16em; left:.16em; border-top-width:.036em; border-left-width:.036em; }
    #ts-cc-mono-refinements .tt-gate.g2 { top:.16em; right:.16em; border-top-width:.036em; border-right-width:.036em; }
    #ts-cc-mono-refinements .tt-gate.g3 { bottom:.16em; left:.16em; border-bottom-width:.036em; border-left-width:.036em; }
    #ts-cc-mono-refinements .tt-gate.g4 { bottom:.16em; right:.16em; border-bottom-width:.036em; border-right-width:.036em; }
    #ts-cc-mono-refinements .tt-glyph .tt-core { inset:.24em; transition:color 220ms; }
    #ts-cc-mono-refinements .tt-core svg { display:block; width:100% !important; height:100% !important; stroke-width:1.8; stroke-linecap:square; stroke-linejoin:miter; }
    #ts-cc-mono-refinements .tt-active .tt-core { color:var(--tt-red); }
    #ts-cc-mono-refinements .tt-footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding-top:12px; color:light-dark(#5c534e,#aaa39e); font:400 11px var(--tt-mono); }
    @container(max-width:850px) {

      #ts-cc-mono-refinements .tt-title { padding-left:10px; letter-spacing:var(--tt-tracking-offset); }
      #ts-cc-mono-refinements .tt-value { left:28px; right:10px; font-size:12px; }

      #ts-cc-mono-refinements .tt-strip { padding:0 8px; gap:4px; }
      #ts-cc-mono-refinements .tt-pair,#ts-cc-mono-refinements .tt-live { gap:4px; }
      #ts-cc-mono-refinements .tt-treatment[data-style="indexed"] .tt-value { left:48px; }
      #ts-cc-mono-refinements .tt-focus { left:-20px; width:12px; }
      #ts-cc-mono-refinements .tt-focus::before { width:5px; height:5px; top:5px; }
      #ts-cc-mono-refinements .tt-focus::after { width:5px; height:5px; top:5px; left:6px; }
    }
    @container(max-width:620px) {
      #ts-cc-mono-refinements .tt-choices { grid-template-columns:1fr; gap:10px; }
      #ts-cc-mono-refinements .tt-choice { padding:13px 16px 17px; }
      #ts-cc-mono-refinements .tt-choice-font { min-height:0; }
      #ts-cc-mono-refinements .tt-swatch { margin-top:22px; }
      #ts-cc-mono-refinements .tt-bar .tt-fixed-arrow { margin-left:0; }
      #ts-cc-mono-refinements .tt-stage { padding:28px 18px; }
      #ts-cc-mono-refinements .tt-cross { grid-template-columns:44px minmax(0,1fr); grid-template-rows:56px repeat(4,96px); gap:20px 12px; }
      #ts-cc-mono-refinements .tt-center { grid-column:1 / -1; grid-row:1; }
      #ts-cc-mono-refinements .tt-node[data-node="connection"] { grid-column:2; grid-row:2; }
      #ts-cc-mono-refinements .tt-node[data-node="share"] { grid-column:2; grid-row:3; }
      #ts-cc-mono-refinements .tt-node[data-node="audio"] { grid-column:2; grid-row:4; }
      #ts-cc-mono-refinements .tt-node[data-node="notifications"] { grid-column:2; grid-row:5; }
      #ts-cc-mono-refinements .tt-arrow[data-axis="connection"] { grid-column:1; grid-row:2; }
      #ts-cc-mono-refinements .tt-arrow[data-axis="share"] { grid-column:1; grid-row:3; }
      #ts-cc-mono-refinements .tt-arrow[data-axis="audio"] { grid-column:1; grid-row:4; }
      #ts-cc-mono-refinements .tt-arrow[data-axis="notifications"] { grid-column:1; grid-row:5; }

      #ts-cc-mono-refinements .tt-focus { display:none; }
    }
    @media(prefers-reduced-motion:reduce) { #ts-cc-mono-refinements *,#ts-cc-mono-refinements *::before,#ts-cc-mono-refinements *::after { transition:none !important; animation:none !important; } }
