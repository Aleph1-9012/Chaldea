<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>Tsugumori / Control center b2 reference rows</title><style>html{color-scheme:dark}body{margin:0;padding:16px;display:flow-root;background:#080808;color:#e4e2dc;font:400 12px/1.5 "JetBrains Mono","DejaVu Sans Mono",monospace}*,*::before,*::after{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e4e2dc;outline-offset:3px}[hidden],[data-archive-omitted]{display:none!important}.viz-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.btn,.nav-link{background:#151515;color:#ddd;border:1px solid #555;padding:8px 10px;cursor:pointer}.btn[aria-pressed=true],.nav-link.active{background:#cc1515;border-color:#cc1515;color:#080808}.text-small{font-size:11px}.text-muted{color:#999}.form-control,.form-select{background:#151515;color:#eee;border:1px solid #666;padding:7px}.form-range{accent-color:#cc1515}.nav{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}figure{margin:0}svg{flex-shrink:0}.archive-settings{border-top:1px solid #383434;margin:18px 0 0;padding:12px 0;font-size:11px}.archive-settings summary{cursor:pointer;color:#aaa;letter-spacing:1px}.archive-settings label{display:flex;align-items:center;gap:12px;padding-top:10px;flex-wrap:wrap}.archive-settings label span{min-width:145px}.archive-settings input[type=range]{width:150px;max-width:100%;accent-color:#cc1515}.archive-settings select{max-width:100%;background:#151515;color:#ddd;border:1px solid #555;padding:5px}.archive-settings output{color:#aaa}.archive-settings input[type=checkbox]{accent-color:#cc1515}
</style></head><body><div aria-label="Reference Wi-Fi layout with B2 typography" id="ts-b2-reference-rows">
<style>

    #ts-b2-reference-rows { --wr-white:#e8e8e8; --wr-muted:#a2a2a2; --wr-red:#cc1515; --wr-panel:#111; --wr-row-height:38px; --wr-row-gap:8px; --wr-mono:'JetBrains Mono',monospace; color:var(--wr-white); font:400 13px/1.45 var(--wr-mono); width:100%; container-type:inline-size; }
    #ts-b2-reference-rows * { box-sizing:border-box; }
    #ts-b2-reference-rows [hidden] { display:none !important; }
    #ts-b2-reference-rows button { font:inherit; border-radius:0; cursor:pointer; }
    #ts-b2-reference-rows .wr-stage { padding:24px 14px; background:#0a0a0a; color-scheme:dark; }
    #ts-b2-reference-rows .wr-panel { position:relative; width:100%; max-width:376px; margin:0 auto; border:1px solid var(--wr-white); background:var(--wr-panel); padding:62px 16px 20px; }
    #ts-b2-reference-rows .wr-corner { position:absolute; width:8px; height:8px; border:0 solid var(--wr-white); pointer-events:none; }
    #ts-b2-reference-rows .wr-corner.tl { left:5px; top:-3px; border-left-width:2px; border-top-width:2px; }
    #ts-b2-reference-rows .wr-corner.tr { right:-1px; top:-3px; border-right-width:2px; border-top-width:2px; }
    #ts-b2-reference-rows .wr-corner.bl { left:5px; bottom:-3px; border-left-width:2px; border-bottom-width:2px; }
    #ts-b2-reference-rows .wr-corner.br { right:-1px; bottom:-3px; border-right-width:2px; border-bottom-width:2px; }
    #ts-b2-reference-rows .wr-head { position:absolute; top:8px; left:8px; right:8px; height:32px; display:flex; align-items:center; color:#080808; background:var(--wr-red); font-weight:500; font-size:13px; letter-spacing:.25px; }
    #ts-b2-reference-rows .wr-index { display:flex; align-items:center; justify-content:center; width:32px; align-self:stretch; border-right:1px solid #08080855; font-size:11px; letter-spacing:0; }
    #ts-b2-reference-rows .wr-head-title { flex:1; padding:0 12px; }
    #ts-b2-reference-rows .wr-close { align-self:stretch; width:32px; display:flex; align-items:center; justify-content:center; padding:0; background:transparent; color:inherit; border:0; border-left:1px solid #08080855; }
    #ts-b2-reference-rows .wr-close:hover { background:#080808; color:var(--wr-red); }
    #ts-b2-reference-rows .wr-close svg { width:15px; height:15px; }
    #ts-b2-reference-rows .wr-side { position:absolute; left:-1px; top:8px; width:3px; height:32px; background:var(--wr-red); }
    #ts-b2-reference-rows .wr-section-title { margin:0; color:var(--wr-muted); font-weight:500; font-size:12px; letter-spacing:1.5px; }
    #ts-b2-reference-rows .wr-section-title::after { content:''; display:block; width:34px; height:1px; margin-top:8px; background:#858585; }
    #ts-b2-reference-rows .wr-status { display:flex; align-items:flex-start; gap:9px; margin:14px 0 16px; font-size:12px; color:var(--wr-white); }
    #ts-b2-reference-rows .wr-status-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-top:5px; background:var(--wr-red); }
    #ts-b2-reference-rows[data-enabled="false"] .wr-status-dot { background:#777; }
    #ts-b2-reference-rows .wr-status-text { min-width:0; overflow-wrap:anywhere; }
    #ts-b2-reference-rows .wr-toggle { display:flex; align-items:center; gap:10px; width:100%; min-height:36px; margin-bottom:var(--wr-row-gap); border:1px solid var(--wr-white); padding:8px 12px; background:var(--wr-white); color:#080808; font-weight:500; font-size:12px; letter-spacing:.7px; text-align:left; transition:background 180ms,color 180ms,border-color 180ms; }
    #ts-b2-reference-rows .wr-toggle:hover { background:var(--wr-red); border-color:var(--wr-red); color:#080808; }
    #ts-b2-reference-rows .wr-diamond { width:6px; height:6px; display:block; flex-shrink:0; background:currentColor; transform:rotate(45deg); }
    #ts-b2-reference-rows .wr-list { display:grid; gap:var(--wr-row-gap); }
    #ts-b2-reference-rows .wr-row { position:relative; display:flex; align-items:center; justify-content:center; gap:12px; width:100%; min-height:var(--wr-row-height); padding:8px 12px; border:1px solid #858585; background:var(--wr-panel); color:var(--wr-white); font-size:12px; font-weight:500; letter-spacing:.45px; transition:background 180ms,color 180ms,border-color 180ms; }
    #ts-b2-reference-rows .wr-name { min-width:0; overflow-wrap:anywhere; text-align:left; }
    #ts-b2-reference-rows .wr-indicators { display:flex; align-items:center; gap:10px; flex-shrink:0; }
    #ts-b2-reference-rows .wr-strength { display:flex; gap:5px; align-items:center; padding:0 2px; }
    #ts-b2-reference-rows .wr-strength i { width:7px; height:4px; transform:skewX(-24deg); background:currentColor; }
    #ts-b2-reference-rows .wr-strength i.wr-empty { background:transparent; box-shadow:inset 0 0 0 1px currentColor; opacity:.7; }
    #ts-b2-reference-rows .wr-indicators svg { width:12px; height:12px; }
    #ts-b2-reference-rows .wr-row:hover:not([aria-pressed="true"]) { color:#080808; background:var(--wr-white); border-color:var(--wr-white); }
    #ts-b2-reference-rows .wr-row[aria-pressed="true"] { color:#080808; background:var(--wr-red); border-color:var(--wr-red); }
    #ts-b2-reference-rows .wr-row[aria-pressed="true"]::before { content:''; position:absolute; left:8px; width:4px; height:4px; background:currentColor; transform:rotate(45deg); }
    #ts-b2-reference-rows .wr-empty-list { padding:28px 12px; color:var(--wr-muted); font-size:12px; text-align:center; }
    #ts-b2-reference-rows .wr-caption { max-width:376px; margin:12px auto 0; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; color:light-dark(#615a55,#aaa39e); font-size:11px; }
    #ts-b2-reference-rows .wr-reopen { display:flex; align-items:center; gap:14px; margin:0 auto; border:1px solid #858585; background:var(--wr-panel); color:var(--wr-white); padding:12px 18px; font-size:13px; }
    #ts-b2-reference-rows .wr-reopen:hover { border-color:var(--wr-red); }
    @container(max-width:360px) {
      #ts-b2-reference-rows .wr-stage { padding:22px 10px; }
      #ts-b2-reference-rows .wr-panel { padding-left:12px; padding-right:12px; }
      #ts-b2-reference-rows .wr-row { gap:9px; letter-spacing:0; }
      #ts-b2-reference-rows .wr-indicators { gap:7px; }
    }
    @media(pointer:coarse) {
      #ts-b2-reference-rows .wr-row,#ts-b2-reference-rows .wr-toggle,#ts-b2-reference-rows .wr-reopen { min-height:44px; }
      #ts-b2-reference-rows .wr-head { height:44px; }
      #ts-b2-reference-rows .wr-close { width:44px; }
      #ts-b2-reference-rows .wr-panel { padding-top:74px; }
      #ts-b2-reference-rows .wr-side { height:44px; }
    }
    @media(prefers-reduced-motion:reduce) { #ts-b2-reference-rows * { transition:none !important; } }
  </style>

<span aria-hidden="true" class="wr-side"></span><i aria-hidden="true" class="wr-corner tl"></i><i aria-hidden="true" class="wr-corner tr"></i><i aria-hidden="true" class="wr-corner bl"></i><i aria-hidden="true" class="wr-corner br"></i>
<h2 class="wr-section-title">WI-FI</h2>
<div aria-live="polite" class="wr-status" role="status"><i aria-hidden="true" class="wr-status-dot"></i><span class="wr-status-text">Enabled · Scanning</span></div>
<button class="wr-toggle" type="button"><i aria-hidden="true" class="wr-diamond"></i><span>DISABLE WI-FI</span></button>
<div aria-label="Sample wireless networks" class="wr-list"></div>
</section>
<button class="wr-reopen" hidden="" type="button"><span>01</span>OPEN CONNECTION</button>
</div>
<div class="wr-caption"><span>B2 // JETBRAINS MONO</span><span>SAMPLE DATA</span></div>

</div>
