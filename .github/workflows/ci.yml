name: Check and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install the pinned Rust toolchain
        run: |
          version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - run: make setup
      - name: Install the test browser
        working-directory: frontend
        run: bunx --bun playwright install --with-deps chromium
      - run: make check
      - run: make build
      - name: Smoke-test the production artifact
        working-directory: frontend
        run: bun scripts/check-dist.ts
      - name: Preserve the static release candidate
        uses: actions/upload-artifact@v7
        with:
          name: chaldea-site
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: build/evidence/
          if-no-files-found: ignore
          retention-days: 14
      # Native checks run locally against the recorded Quickshell/Qt baseline.
      # This job does not claim native or compositor coverage.
