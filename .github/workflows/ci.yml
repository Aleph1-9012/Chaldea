name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install the pinned Rust toolchain
        run: |
          version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - run: make setup
      - run: make check
      - name: Preserve the static release candidate
        uses: actions/upload-artifact@v7
        with:
          name: chaldea-site
          path: dist/
          if-no-files-found: error
          retention-days: 14
